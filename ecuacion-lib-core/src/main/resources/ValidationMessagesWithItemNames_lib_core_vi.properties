# jakarta validation standard messages with item names
jakarta.validation.constraints.AssertFalse.message.base     = {0} phải là false. (giá trị đã nhập: {invalidValue})
jakarta.validation.constraints.AssertTrue.message.base      = {0} phải là true. (giá trị đã nhập: {invalidValue})
jakarta.validation.constraints.DecimalMax.message.base      = {0} phải nhỏ hơn ${inclusive == true ? 'hoặc bằng ' : ''}{value}. (giá trị đã nhập: {invalidValue})
jakarta.validation.constraints.DecimalMin.message.base      = {0} phải lớn hơn ${inclusive == true ? 'hoặc bằng ' : ''}{value}. (giá trị đã nhập: {invalidValue})
jakarta.validation.constraints.Digits.message.base          = Giá trị số của {0} nằm ngoài giới hạn (cần <{integer} chữ số>.<{fraction} chữ số>). (giá trị đã nhập: {invalidValue})
jakarta.validation.constraints.Email.message.base           = {0} phải là địa chỉ email hợp lệ. (giá trị đã nhập: {invalidValue})
jakarta.validation.constraints.Future.message.base          = {0} phải là một ngày trong tương lai. (giá trị đã nhập: {invalidValue})
jakarta.validation.constraints.FutureOrPresent.message.base = {0} phải là một ngày ở hiện tại hoặc tương lai. (giá trị đã nhập: {invalidValue})
jakarta.validation.constraints.Max.message.base             = {0} phải nhỏ hơn hoặc bằng {value}. (giá trị đã nhập: {invalidValue})
jakarta.validation.constraints.Min.message.base             = {0} phải lớn hơn hoặc bằng {value}. (giá trị đã nhập: {invalidValue})
jakarta.validation.constraints.Negative.message.base        = {0} phải nhỏ hơn 0. (giá trị đã nhập: {invalidValue})
jakarta.validation.constraints.NegativeOrZero.message.base  = {0} phải nhỏ hơn hoặc bằng 0. (giá trị đã nhập: {invalidValue})
jakarta.validation.constraints.NotBlank.message.base        = {0} không được để trống hoặc chỉ chứa khoảng trắng.
jakarta.validation.constraints.NotEmpty.message.base        = {0} không được để trống.
jakarta.validation.constraints.NotNull.message.base         = {0} không được là null.
jakarta.validation.constraints.Null.message.base            = {0} phải là null. (giá trị đã nhập: {invalidValue})
jakarta.validation.constraints.Past.message.base            = {0} phải là một ngày trong quá khứ. (giá trị đã nhập: {invalidValue})
jakarta.validation.constraints.PastOrPresent.message.base   = {0} phải là một ngày trong quá khứ hoặc hiện tại. (giá trị đã nhập: {invalidValue})
jakarta.validation.constraints.Pattern.message.base         = {0} phải khớp với "{regexp}". (giá trị đã nhập: {invalidValue})
jakarta.validation.constraints.Positive.message.base        = {0} phải lớn hơn 0. (giá trị đã nhập: {invalidValue})
jakarta.validation.constraints.PositiveOrZero.message.base  = {0} phải lớn hơn hoặc bằng 0. (giá trị đã nhập: {invalidValue})
jakarta.validation.constraints.Size.message.base            = Kích thước của {0} phải nằm trong khoảng {min} đến {max}. (giá trị đã nhập: {invalidValue})
