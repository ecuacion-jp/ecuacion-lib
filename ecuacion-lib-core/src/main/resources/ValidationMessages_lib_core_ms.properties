# jakarta validation standard messages, for the languages Hibernate Validator does not support
jakarta.validation.constraints.AssertFalse.message.base     = mesti bernilai false
jakarta.validation.constraints.AssertTrue.message.base      = mesti bernilai true
jakarta.validation.constraints.DecimalMax.message.base      = mesti kurang daripada ${inclusive == true ? 'atau sama dengan ' : ''}{value}
jakarta.validation.constraints.DecimalMin.message.base      = mesti lebih daripada ${inclusive == true ? 'atau sama dengan ' : ''}{value}
jakarta.validation.constraints.Digits.message.base          = nilai berangka di luar had (dijangka <{integer} digit>.<{fraction} digit>)
jakarta.validation.constraints.Email.message.base           = mesti alamat e-mel yang sah
jakarta.validation.constraints.Future.message.base          = mesti tarikh pada masa hadapan
jakarta.validation.constraints.FutureOrPresent.message.base = mesti tarikh pada masa kini atau masa hadapan
jakarta.validation.constraints.Max.message.base             = mesti kurang daripada atau sama dengan {value}
jakarta.validation.constraints.Min.message.base             = mesti lebih daripada atau sama dengan {value}
jakarta.validation.constraints.Negative.message.base        = mesti kurang daripada 0
jakarta.validation.constraints.NegativeOrZero.message.base  = mesti kurang daripada atau sama dengan 0
jakarta.validation.constraints.NotBlank.message.base        = tidak boleh kosong atau mengandungi ruang kosong sahaja
jakarta.validation.constraints.NotEmpty.message.base        = tidak boleh kosong
jakarta.validation.constraints.NotNull.message.base         = tidak boleh null
jakarta.validation.constraints.Null.message.base            = mesti null
jakarta.validation.constraints.Past.message.base            = mesti tarikh pada masa lalu
jakarta.validation.constraints.PastOrPresent.message.base   = mesti tarikh pada masa lalu atau masa kini
jakarta.validation.constraints.Pattern.message.base         = mesti sepadan dengan "{regexp}"
jakarta.validation.constraints.Positive.message.base        = mesti lebih daripada 0
jakarta.validation.constraints.PositiveOrZero.message.base  = mesti lebih daripada atau sama dengan 0
jakarta.validation.constraints.Size.message.base            = saiz mesti antara {min} dan {max}
