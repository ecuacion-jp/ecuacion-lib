# jakarta validation standard messages with item names
jakarta.validation.constraints.AssertFalse.message.base     = {0} skal være false. (input: {invalidValue})
jakarta.validation.constraints.AssertTrue.message.base      = {0} skal være true. (input: {invalidValue})
jakarta.validation.constraints.DecimalMax.message.base      = {0} skal være mindre end ${inclusive == true ? 'eller lig med ' : ''}{value}. (input: {invalidValue})
jakarta.validation.constraints.DecimalMin.message.base      = {0} skal være større end ${inclusive == true ? 'eller lig med ' : ''}{value}. (input: {invalidValue})
jakarta.validation.constraints.Digits.message.base          = Den numeriske værdi af {0} er uden for det tilladte område (<{integer} cifre>.<{fraction} cifre> forventet). (input: {invalidValue})
jakarta.validation.constraints.Email.message.base           = {0} skal være en gyldig e-mailadresse. (input: {invalidValue})
jakarta.validation.constraints.Future.message.base          = {0} skal være en fremtidig dato. (input: {invalidValue})
jakarta.validation.constraints.FutureOrPresent.message.base = {0} skal være en dato i nutiden eller fremtiden. (input: {invalidValue})
jakarta.validation.constraints.Max.message.base             = {0} skal være mindre end eller lig med {value}. (input: {invalidValue})
jakarta.validation.constraints.Min.message.base             = {0} skal være større end eller lig med {value}. (input: {invalidValue})
jakarta.validation.constraints.Negative.message.base        = {0} skal være mindre end 0. (input: {invalidValue})
jakarta.validation.constraints.NegativeOrZero.message.base  = {0} skal være mindre end eller lig med 0. (input: {invalidValue})
jakarta.validation.constraints.NotBlank.message.base        = {0} må ikke være tom eller kun bestå af mellemrum.
jakarta.validation.constraints.NotEmpty.message.base        = {0} må ikke være tom.
jakarta.validation.constraints.NotNull.message.base         = {0} må ikke være null.
jakarta.validation.constraints.Null.message.base            = {0} skal være null. (input: {invalidValue})
jakarta.validation.constraints.Past.message.base            = {0} skal være en dato i fortiden. (input: {invalidValue})
jakarta.validation.constraints.PastOrPresent.message.base   = {0} skal være en dato i fortiden eller nutiden. (input: {invalidValue})
jakarta.validation.constraints.Pattern.message.base         = {0} skal matche "{regexp}". (input: {invalidValue})
jakarta.validation.constraints.Positive.message.base        = {0} skal være større end 0. (input: {invalidValue})
jakarta.validation.constraints.PositiveOrZero.message.base  = {0} skal være større end eller lig med 0. (input: {invalidValue})
jakarta.validation.constraints.Size.message.base            = Størrelsen af {0} skal være mellem {min} og {max}. (input: {invalidValue})
