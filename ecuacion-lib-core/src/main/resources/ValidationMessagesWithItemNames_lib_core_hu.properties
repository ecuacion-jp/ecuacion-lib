# jakarta validation standard messages with item names
jakarta.validation.constraints.AssertFalse.message.base     = {0} értékének false-nak kell lennie. (bevitt érték: {invalidValue})
jakarta.validation.constraints.AssertTrue.message.base      = {0} értékének true-nak kell lennie. (bevitt érték: {invalidValue})
jakarta.validation.constraints.DecimalMax.message.base      = {0} értékének ${inclusive == true ? 'kisebbnek vagy egyenlőnek' : 'kisebbnek'} kell lennie, mint {value}. (bevitt érték: {invalidValue})
jakarta.validation.constraints.DecimalMin.message.base      = {0} értékének ${inclusive == true ? 'nagyobbnak vagy egyenlőnek' : 'nagyobbnak'} kell lennie, mint {value}. (bevitt érték: {invalidValue})
jakarta.validation.constraints.Digits.message.base          = {0} numerikus értéke a megengedett tartományon kívül esik (várt formátum: <{integer} számjegy>.<{fraction} számjegy>). (bevitt érték: {invalidValue})
jakarta.validation.constraints.Email.message.base           = {0} értékének érvényes e-mail-címnek kell lennie. (bevitt érték: {invalidValue})
jakarta.validation.constraints.Future.message.base          = {0} értékének jövőbeli dátumnak kell lennie. (bevitt érték: {invalidValue})
jakarta.validation.constraints.FutureOrPresent.message.base = {0} értékének jelenlegi vagy jövőbeli dátumnak kell lennie. (bevitt érték: {invalidValue})
jakarta.validation.constraints.Max.message.base             = {0} értékének kisebbnek vagy egyenlőnek kell lennie, mint {value}. (bevitt érték: {invalidValue})
jakarta.validation.constraints.Min.message.base             = {0} értékének nagyobbnak vagy egyenlőnek kell lennie, mint {value}. (bevitt érték: {invalidValue})
jakarta.validation.constraints.Negative.message.base        = {0} értékének kisebbnek kell lennie, mint 0. (bevitt érték: {invalidValue})
jakarta.validation.constraints.NegativeOrZero.message.base  = {0} értékének kisebbnek vagy egyenlőnek kell lennie, mint 0. (bevitt érték: {invalidValue})
jakarta.validation.constraints.NotBlank.message.base        = {0} nem lehet üres, és nem állhat csak szóközökből.
jakarta.validation.constraints.NotEmpty.message.base        = {0} nem lehet üres.
jakarta.validation.constraints.NotNull.message.base         = {0} nem lehet null.
jakarta.validation.constraints.Null.message.base            = {0} értékének nullnak kell lennie. (bevitt érték: {invalidValue})
jakarta.validation.constraints.Past.message.base            = {0} értékének múltbeli dátumnak kell lennie. (bevitt érték: {invalidValue})
jakarta.validation.constraints.PastOrPresent.message.base   = {0} értékének múltbeli vagy jelenlegi dátumnak kell lennie. (bevitt érték: {invalidValue})
jakarta.validation.constraints.Pattern.message.base         = {0} értékének illeszkednie kell a következőre: "{regexp}". (bevitt érték: {invalidValue})
jakarta.validation.constraints.Positive.message.base        = {0} értékének nagyobbnak kell lennie, mint 0. (bevitt érték: {invalidValue})
jakarta.validation.constraints.PositiveOrZero.message.base  = {0} értékének nagyobbnak vagy egyenlőnek kell lennie, mint 0. (bevitt érték: {invalidValue})
jakarta.validation.constraints.Size.message.base            = {0} méretének {min} és {max} között kell lennie. (bevitt érték: {invalidValue})
