# jakarta validation standard messages, for the languages Hibernate Validator does not support
jakarta.validation.constraints.AssertFalse.message.base     = অবশ্যই false হবে
jakarta.validation.constraints.AssertTrue.message.base      = অবশ্যই true হবে
jakarta.validation.constraints.DecimalMax.message.base      = অবশ্যই {value} এর চেয়ে কম ${inclusive == true ? 'বা সমান ' : ''}হবে
jakarta.validation.constraints.DecimalMin.message.base      = অবশ্যই {value} এর চেয়ে বেশি ${inclusive == true ? 'বা সমান ' : ''}হবে
jakarta.validation.constraints.Digits.message.base          = সংখ্যাগত মান সীমার বাইরে (<{integer} অঙ্ক>.<{fraction} অঙ্ক> প্রত্যাশিত)
jakarta.validation.constraints.Email.message.base           = অবশ্যই একটি বৈধ ইমেল ঠিকানা হবে
jakarta.validation.constraints.Future.message.base          = অবশ্যই ভবিষ্যতের তারিখ হবে
jakarta.validation.constraints.FutureOrPresent.message.base = অবশ্যই বর্তমান বা ভবিষ্যতের তারিখ হবে
jakarta.validation.constraints.Max.message.base             = অবশ্যই {value} এর চেয়ে কম বা সমান হবে
jakarta.validation.constraints.Min.message.base             = অবশ্যই {value} এর চেয়ে বেশি বা সমান হবে
jakarta.validation.constraints.Negative.message.base        = অবশ্যই 0 এর চেয়ে কম হবে
jakarta.validation.constraints.NegativeOrZero.message.base  = অবশ্যই 0 এর চেয়ে কম বা সমান হবে
jakarta.validation.constraints.NotBlank.message.base        = খালি বা শুধু ফাঁকা স্থান হতে পারবে না
jakarta.validation.constraints.NotEmpty.message.base        = খালি হতে পারবে না
jakarta.validation.constraints.NotNull.message.base         = null হতে পারবে না
jakarta.validation.constraints.Null.message.base            = অবশ্যই null হবে
jakarta.validation.constraints.Past.message.base            = অবশ্যই অতীতের তারিখ হবে
jakarta.validation.constraints.PastOrPresent.message.base   = অবশ্যই অতীত বা বর্তমানের তারিখ হবে
jakarta.validation.constraints.Pattern.message.base         = অবশ্যই "{regexp}" এর সাথে মিলবে
jakarta.validation.constraints.Positive.message.base        = অবশ্যই 0 এর চেয়ে বেশি হবে
jakarta.validation.constraints.PositiveOrZero.message.base  = অবশ্যই 0 এর চেয়ে বেশি বা সমান হবে
jakarta.validation.constraints.Size.message.base            = আকার অবশ্যই {min} থেকে {max} এর মধ্যে হবে
