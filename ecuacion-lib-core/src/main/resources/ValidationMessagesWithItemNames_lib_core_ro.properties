# jakarta validation standard messages with item names
jakarta.validation.constraints.AssertFalse.message.base     = {0} trebuie să fie false. (valoare introdusă: {invalidValue})
jakarta.validation.constraints.AssertTrue.message.base      = {0} trebuie să fie true. (valoare introdusă: {invalidValue})
jakarta.validation.constraints.DecimalMax.message.base      = {0} trebuie să fie mai mic ${inclusive == true ? 'sau egal cu' : 'decât'} {value}. (valoare introdusă: {invalidValue})
jakarta.validation.constraints.DecimalMin.message.base      = {0} trebuie să fie mai mare ${inclusive == true ? 'sau egal cu' : 'decât'} {value}. (valoare introdusă: {invalidValue})
jakarta.validation.constraints.Digits.message.base          = Valoarea numerică a {0} este în afara limitelor (se așteaptă <{integer} cifre>.<{fraction} cifre>). (valoare introdusă: {invalidValue})
jakarta.validation.constraints.Email.message.base           = {0} trebuie să fie o adresă de e-mail validă. (valoare introdusă: {invalidValue})
jakarta.validation.constraints.Future.message.base          = {0} trebuie să fie o dată din viitor. (valoare introdusă: {invalidValue})
jakarta.validation.constraints.FutureOrPresent.message.base = {0} trebuie să fie o dată din prezent sau din viitor. (valoare introdusă: {invalidValue})
jakarta.validation.constraints.Max.message.base             = {0} trebuie să fie mai mic sau egal cu {value}. (valoare introdusă: {invalidValue})
jakarta.validation.constraints.Min.message.base             = {0} trebuie să fie mai mare sau egal cu {value}. (valoare introdusă: {invalidValue})
jakarta.validation.constraints.Negative.message.base        = {0} trebuie să fie mai mic decât 0. (valoare introdusă: {invalidValue})
jakarta.validation.constraints.NegativeOrZero.message.base  = {0} trebuie să fie mai mic sau egal cu 0. (valoare introdusă: {invalidValue})
jakarta.validation.constraints.NotBlank.message.base        = {0} nu trebuie să fie gol sau să conțină doar spații.
jakarta.validation.constraints.NotEmpty.message.base        = {0} nu trebuie să fie gol.
jakarta.validation.constraints.NotNull.message.base         = {0} nu trebuie să fie null.
jakarta.validation.constraints.Null.message.base            = {0} trebuie să fie null. (valoare introdusă: {invalidValue})
jakarta.validation.constraints.Past.message.base            = {0} trebuie să fie o dată din trecut. (valoare introdusă: {invalidValue})
jakarta.validation.constraints.PastOrPresent.message.base   = {0} trebuie să fie o dată din trecut sau din prezent. (valoare introdusă: {invalidValue})
jakarta.validation.constraints.Pattern.message.base         = {0} trebuie să corespundă cu "{regexp}". (valoare introdusă: {invalidValue})
jakarta.validation.constraints.Positive.message.base        = {0} trebuie să fie mai mare decât 0. (valoare introdusă: {invalidValue})
jakarta.validation.constraints.PositiveOrZero.message.base  = {0} trebuie să fie mai mare sau egal cu 0. (valoare introdusă: {invalidValue})
jakarta.validation.constraints.Size.message.base            = Dimensiunea {0} trebuie să fie între {min} și {max}. (valoare introdusă: {invalidValue})
