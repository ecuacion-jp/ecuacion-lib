# jakarta validation standard messages, for the languages Hibernate Validator does not support
jakarta.validation.constraints.AssertFalse.message.base     = false ആയിരിക്കണം
jakarta.validation.constraints.AssertTrue.message.base      = true ആയിരിക്കണം
jakarta.validation.constraints.DecimalMax.message.base      = {value} നേക്കാൾ ${inclusive == true ? 'കുറവോ തുല്യമോ' : 'കുറവ്'} ആയിരിക്കണം
jakarta.validation.constraints.DecimalMin.message.base      = {value} നേക്കാൾ ${inclusive == true ? 'കൂടുതലോ തുല്യമോ' : 'കൂടുതൽ'} ആയിരിക്കണം
jakarta.validation.constraints.Digits.message.base          = സംഖ്യാ മൂല്യം പരിധിക്ക് പുറത്താണ് (<{integer} അക്കങ്ങൾ>.<{fraction} അക്കങ്ങൾ> പ്രതീക്ഷിക്കുന്നു)
jakarta.validation.constraints.Email.message.base           = സാധുവായ ഇമെയിൽ വിലാസം ആയിരിക്കണം
jakarta.validation.constraints.Future.message.base          = ഭാവിയിലെ തീയതി ആയിരിക്കണം
jakarta.validation.constraints.FutureOrPresent.message.base = നിലവിലെ അല്ലെങ്കിൽ ഭാവിയിലെ തീയതി ആയിരിക്കണം
jakarta.validation.constraints.Max.message.base             = {value} നേക്കാൾ കുറവോ തുല്യമോ ആയിരിക്കണം
jakarta.validation.constraints.Min.message.base             = {value} നേക്കാൾ കൂടുതലോ തുല്യമോ ആയിരിക്കണം
jakarta.validation.constraints.Negative.message.base        = 0 നേക്കാൾ കുറവ് ആയിരിക്കണം
jakarta.validation.constraints.NegativeOrZero.message.base  = 0 നേക്കാൾ കുറവോ തുല്യമോ ആയിരിക്കണം
jakarta.validation.constraints.NotBlank.message.base        = ശൂന്യമോ സ്പേസുകൾ മാത്രമോ ആയിരിക്കരുത്
jakarta.validation.constraints.NotEmpty.message.base        = ശൂന്യമായിരിക്കരുത്
jakarta.validation.constraints.NotNull.message.base         = null ആയിരിക്കരുത്
jakarta.validation.constraints.Null.message.base            = null ആയിരിക്കണം
jakarta.validation.constraints.Past.message.base            = മുൻകാല തീയതി ആയിരിക്കണം
jakarta.validation.constraints.PastOrPresent.message.base   = മുൻകാല അല്ലെങ്കിൽ നിലവിലെ തീയതി ആയിരിക്കണം
jakarta.validation.constraints.Pattern.message.base         = "{regexp}" മായി പൊരുത്തപ്പെടണം
jakarta.validation.constraints.Positive.message.base        = 0 നേക്കാൾ കൂടുതൽ ആയിരിക്കണം
jakarta.validation.constraints.PositiveOrZero.message.base  = 0 നേക്കാൾ കൂടുതലോ തുല്യമോ ആയിരിക്കണം
jakarta.validation.constraints.Size.message.base            = വലുപ്പം {min} നും {max} നും ഇടയിൽ ആയിരിക്കണം
