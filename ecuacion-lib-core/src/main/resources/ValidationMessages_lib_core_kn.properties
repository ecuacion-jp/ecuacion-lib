# jakarta validation standard messages, for the languages Hibernate Validator does not support
jakarta.validation.constraints.AssertFalse.message.base     = false ಆಗಿರಬೇಕು
jakarta.validation.constraints.AssertTrue.message.base      = true ಆಗಿರಬೇಕು
jakarta.validation.constraints.DecimalMax.message.base      = {value} ಕ್ಕಿಂತ ${inclusive == true ? 'ಕಡಿಮೆ ಅಥವಾ ಸಮನಾಗಿರಬೇಕು' : 'ಕಡಿಮೆಯಿರಬೇಕು'}
jakarta.validation.constraints.DecimalMin.message.base      = {value} ಕ್ಕಿಂತ ${inclusive == true ? 'ಹೆಚ್ಚು ಅಥವಾ ಸಮನಾಗಿರಬೇಕು' : 'ಹೆಚ್ಚಿರಬೇಕು'}
jakarta.validation.constraints.Digits.message.base          = ಸಂಖ್ಯಾ ಮೌಲ್ಯವು ಮಿತಿಯ ಹೊರಗಿದೆ (<{integer} ಅಂಕಿಗಳು>.<{fraction} ಅಂಕಿಗಳು> ನಿರೀಕ್ಷಿಸಲಾಗಿದೆ)
jakarta.validation.constraints.Email.message.base           = ಮಾನ್ಯವಾದ ಇಮೇಲ್ ವಿಳಾಸವಾಗಿರಬೇಕು
jakarta.validation.constraints.Future.message.base          = ಭವಿಷ್ಯದ ದಿನಾಂಕವಾಗಿರಬೇಕು
jakarta.validation.constraints.FutureOrPresent.message.base = ಪ್ರಸ್ತುತ ಅಥವಾ ಭವಿಷ್ಯದ ದಿನಾಂಕವಾಗಿರಬೇಕು
jakarta.validation.constraints.Max.message.base             = {value} ಕ್ಕಿಂತ ಕಡಿಮೆ ಅಥವಾ ಸಮನಾಗಿರಬೇಕು
jakarta.validation.constraints.Min.message.base             = {value} ಕ್ಕಿಂತ ಹೆಚ್ಚು ಅಥವಾ ಸಮನಾಗಿರಬೇಕು
jakarta.validation.constraints.Negative.message.base        = 0 ಕ್ಕಿಂತ ಕಡಿಮೆಯಿರಬೇಕು
jakarta.validation.constraints.NegativeOrZero.message.base  = 0 ಕ್ಕಿಂತ ಕಡಿಮೆ ಅಥವಾ ಸಮನಾಗಿರಬೇಕು
jakarta.validation.constraints.NotBlank.message.base        = ಖಾಲಿಯಾಗಿರಬಾರದು ಅಥವಾ ಕೇವಲ ಖಾಲಿ ಜಾಗಗಳನ್ನು ಹೊಂದಿರಬಾರದು
jakarta.validation.constraints.NotEmpty.message.base        = ಖಾಲಿಯಾಗಿರಬಾರದು
jakarta.validation.constraints.NotNull.message.base         = null ಆಗಿರಬಾರದು
jakarta.validation.constraints.Null.message.base            = null ಆಗಿರಬೇಕು
jakarta.validation.constraints.Past.message.base            = ಹಿಂದಿನ ದಿನಾಂಕವಾಗಿರಬೇಕು
jakarta.validation.constraints.PastOrPresent.message.base   = ಹಿಂದಿನ ಅಥವಾ ಪ್ರಸ್ತುತ ದಿನಾಂಕವಾಗಿರಬೇಕು
jakarta.validation.constraints.Pattern.message.base         = "{regexp}" ಗೆ ಹೊಂದಿಕೆಯಾಗಬೇಕು
jakarta.validation.constraints.Positive.message.base        = 0 ಕ್ಕಿಂತ ಹೆಚ್ಚಿರಬೇಕು
jakarta.validation.constraints.PositiveOrZero.message.base  = 0 ಕ್ಕಿಂತ ಹೆಚ್ಚು ಅಥವಾ ಸಮನಾಗಿರಬೇಕು
jakarta.validation.constraints.Size.message.base            = ಗಾತ್ರವು {min} ಮತ್ತು {max} ನಡುವೆ ಇರಬೇಕು
