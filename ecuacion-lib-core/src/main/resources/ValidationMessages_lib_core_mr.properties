# jakarta validation standard messages, for the languages Hibernate Validator does not support
jakarta.validation.constraints.AssertFalse.message.base     = false असणे आवश्यक आहे
jakarta.validation.constraints.AssertTrue.message.base      = true असणे आवश्यक आहे
jakarta.validation.constraints.DecimalMax.message.base      = {value} पेक्षा कमी ${inclusive == true ? 'किंवा समान ' : ''}असणे आवश्यक आहे
jakarta.validation.constraints.DecimalMin.message.base      = {value} पेक्षा जास्त ${inclusive == true ? 'किंवा समान ' : ''}असणे आवश्यक आहे
jakarta.validation.constraints.Digits.message.base          = संख्यात्मक मूल्य मर्यादेबाहेर आहे (<{integer} अंक>.<{fraction} अंक> अपेक्षित)
jakarta.validation.constraints.Email.message.base           = वैध ईमेल पत्ता असणे आवश्यक आहे
jakarta.validation.constraints.Future.message.base          = भविष्यातील तारीख असणे आवश्यक आहे
jakarta.validation.constraints.FutureOrPresent.message.base = वर्तमान किंवा भविष्यातील तारीख असणे आवश्यक आहे
jakarta.validation.constraints.Max.message.base             = {value} पेक्षा कमी किंवा समान असणे आवश्यक आहे
jakarta.validation.constraints.Min.message.base             = {value} पेक्षा जास्त किंवा समान असणे आवश्यक आहे
jakarta.validation.constraints.Negative.message.base        = 0 पेक्षा कमी असणे आवश्यक आहे
jakarta.validation.constraints.NegativeOrZero.message.base  = 0 पेक्षा कमी किंवा समान असणे आवश्यक आहे
jakarta.validation.constraints.NotBlank.message.base        = रिक्त किंवा फक्त रिकाम्या जागांचे नसावे
jakarta.validation.constraints.NotEmpty.message.base        = रिक्त नसावे
jakarta.validation.constraints.NotNull.message.base         = null नसावे
jakarta.validation.constraints.Null.message.base            = null असणे आवश्यक आहे
jakarta.validation.constraints.Past.message.base            = भूतकाळातील तारीख असणे आवश्यक आहे
jakarta.validation.constraints.PastOrPresent.message.base   = भूतकाळातील किंवा वर्तमान तारीख असणे आवश्यक आहे
jakarta.validation.constraints.Pattern.message.base         = "{regexp}" शी जुळणे आवश्यक आहे
jakarta.validation.constraints.Positive.message.base        = 0 पेक्षा जास्त असणे आवश्यक आहे
jakarta.validation.constraints.PositiveOrZero.message.base  = 0 पेक्षा जास्त किंवा समान असणे आवश्यक आहे
jakarta.validation.constraints.Size.message.base            = आकार {min} आणि {max} दरम्यान असणे आवश्यक आहे
