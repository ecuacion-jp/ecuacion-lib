# jakarta validation standard messages, for the languages Hibernate Validator does not support
jakarta.validation.constraints.AssertFalse.message.base     = false అయి ఉండాలి
jakarta.validation.constraints.AssertTrue.message.base      = true అయి ఉండాలి
jakarta.validation.constraints.DecimalMax.message.base      = {value} కంటే ${inclusive == true ? 'తక్కువ లేదా సమానంగా' : 'తక్కువగా'} ఉండాలి
jakarta.validation.constraints.DecimalMin.message.base      = {value} కంటే ${inclusive == true ? 'ఎక్కువ లేదా సమానంగా' : 'ఎక్కువగా'} ఉండాలి
jakarta.validation.constraints.Digits.message.base          = సంఖ్యా విలువ పరిధికి వెలుపల ఉంది (<{integer} అంకెలు>.<{fraction} అంకెలు> ఆశించబడింది)
jakarta.validation.constraints.Email.message.base           = చెల్లుబాటు అయ్యే ఇమెయిల్ చిరునామా అయి ఉండాలి
jakarta.validation.constraints.Future.message.base          = భవిష్యత్ తేదీ అయి ఉండాలి
jakarta.validation.constraints.FutureOrPresent.message.base = ప్రస్తుత లేదా భవిష్యత్ తేదీ అయి ఉండాలి
jakarta.validation.constraints.Max.message.base             = {value} కంటే తక్కువ లేదా సమానంగా ఉండాలి
jakarta.validation.constraints.Min.message.base             = {value} కంటే ఎక్కువ లేదా సమానంగా ఉండాలి
jakarta.validation.constraints.Negative.message.base        = 0 కంటే తక్కువగా ఉండాలి
jakarta.validation.constraints.NegativeOrZero.message.base  = 0 కంటే తక్కువ లేదా సమానంగా ఉండాలి
jakarta.validation.constraints.NotBlank.message.base        = ఖాళీగా లేదా ఖాళీ స్థలాలు మాత్రమే ఉండకూడదు
jakarta.validation.constraints.NotEmpty.message.base        = ఖాళీగా ఉండకూడదు
jakarta.validation.constraints.NotNull.message.base         = null కాకూడదు
jakarta.validation.constraints.Null.message.base            = null అయి ఉండాలి
jakarta.validation.constraints.Past.message.base            = గత తేదీ అయి ఉండాలి
jakarta.validation.constraints.PastOrPresent.message.base   = గత లేదా ప్రస్తుత తేదీ అయి ఉండాలి
jakarta.validation.constraints.Pattern.message.base         = "{regexp}" తో సరిపోలాలి
jakarta.validation.constraints.Positive.message.base        = 0 కంటే ఎక్కువగా ఉండాలి
jakarta.validation.constraints.PositiveOrZero.message.base  = 0 కంటే ఎక్కువ లేదా సమానంగా ఉండాలి
jakarta.validation.constraints.Size.message.base            = పరిమాణం {min} నుండి {max} మధ్య ఉండాలి
