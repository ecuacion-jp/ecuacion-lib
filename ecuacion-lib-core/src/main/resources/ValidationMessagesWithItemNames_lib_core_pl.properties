# jakarta validation standard messages with item names
jakarta.validation.constraints.AssertFalse.message.base     = {0} musi mieć wartość false. (wprowadzono: {invalidValue})
jakarta.validation.constraints.AssertTrue.message.base      = {0} musi mieć wartość true. (wprowadzono: {invalidValue})
jakarta.validation.constraints.DecimalMax.message.base      = {0} musi być mniejsze ${inclusive == true ? 'lub równe' : 'niż'} {value}. (wprowadzono: {invalidValue})
jakarta.validation.constraints.DecimalMin.message.base      = {0} musi być większe ${inclusive == true ? 'lub równe' : 'niż'} {value}. (wprowadzono: {invalidValue})
jakarta.validation.constraints.Digits.message.base          = Wartość liczbowa {0} jest poza zakresem (oczekiwano <{integer} cyfr>.<{fraction} cyfr>). (wprowadzono: {invalidValue})
jakarta.validation.constraints.Email.message.base           = {0} musi być poprawnym adresem e-mail. (wprowadzono: {invalidValue})
jakarta.validation.constraints.Future.message.base          = {0} musi być datą z przyszłości. (wprowadzono: {invalidValue})
jakarta.validation.constraints.FutureOrPresent.message.base = {0} musi być datą bieżącą lub z przyszłości. (wprowadzono: {invalidValue})
jakarta.validation.constraints.Max.message.base             = {0} musi być mniejsze lub równe {value}. (wprowadzono: {invalidValue})
jakarta.validation.constraints.Min.message.base             = {0} musi być większe lub równe {value}. (wprowadzono: {invalidValue})
jakarta.validation.constraints.Negative.message.base        = {0} musi być mniejsze niż 0. (wprowadzono: {invalidValue})
jakarta.validation.constraints.NegativeOrZero.message.base  = {0} musi być mniejsze lub równe 0. (wprowadzono: {invalidValue})
jakarta.validation.constraints.NotBlank.message.base        = {0} nie może być puste ani zawierać wyłącznie spacji.
jakarta.validation.constraints.NotEmpty.message.base        = {0} nie może być puste.
jakarta.validation.constraints.NotNull.message.base         = {0} nie może być null.
jakarta.validation.constraints.Null.message.base            = {0} musi być null. (wprowadzono: {invalidValue})
jakarta.validation.constraints.Past.message.base            = {0} musi być datą z przeszłości. (wprowadzono: {invalidValue})
jakarta.validation.constraints.PastOrPresent.message.base   = {0} musi być datą z przeszłości lub bieżącą. (wprowadzono: {invalidValue})
jakarta.validation.constraints.Pattern.message.base         = {0} musi pasować do "{regexp}". (wprowadzono: {invalidValue})
jakarta.validation.constraints.Positive.message.base        = {0} musi być większe niż 0. (wprowadzono: {invalidValue})
jakarta.validation.constraints.PositiveOrZero.message.base  = {0} musi być większe lub równe 0. (wprowadzono: {invalidValue})
jakarta.validation.constraints.Size.message.base            = Rozmiar {0} musi mieścić się w przedziale od {min} do {max}. (wprowadzono: {invalidValue})
