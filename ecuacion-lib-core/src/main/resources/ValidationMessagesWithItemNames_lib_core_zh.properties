# jakarta validation standard messages with item names
jakarta.validation.constraints.AssertFalse.message.base     = {0}必须为false（输入值：{invalidValue}）
jakarta.validation.constraints.AssertTrue.message.base      = {0}必须为true（输入值：{invalidValue}）
jakarta.validation.constraints.DecimalMax.message.base      = {0}必须小于${inclusive == true ? '或等于' : ''}{value}（输入值：{invalidValue}）
jakarta.validation.constraints.DecimalMin.message.base      = {0}必须大于${inclusive == true ? '或等于' : ''}{value}（输入值：{invalidValue}）
jakarta.validation.constraints.Digits.message.base          = {0}的数值超出了范围（应为<{integer}位整数>.<{fraction}位小数>）（输入值：{invalidValue}）
jakarta.validation.constraints.Email.message.base           = {0}必须是格式正确的电子邮件地址（输入值：{invalidValue}）
jakarta.validation.constraints.Future.message.base          = {0}必须是将来的日期（输入值：{invalidValue}）
jakarta.validation.constraints.FutureOrPresent.message.base = {0}必须是现在或将来的日期（输入值：{invalidValue}）
jakarta.validation.constraints.Max.message.base             = {0}必须小于或等于{value}（输入值：{invalidValue}）
jakarta.validation.constraints.Min.message.base             = {0}必须大于或等于{value}（输入值：{invalidValue}）
jakarta.validation.constraints.Negative.message.base        = {0}必须小于0（输入值：{invalidValue}）
jakarta.validation.constraints.NegativeOrZero.message.base  = {0}必须小于或等于0（输入值：{invalidValue}）
jakarta.validation.constraints.NotBlank.message.base        = {0}不得为空白
jakarta.validation.constraints.NotEmpty.message.base        = {0}不得为空
jakarta.validation.constraints.NotNull.message.base         = {0}不得为null
jakarta.validation.constraints.Null.message.base            = {0}必须为null（输入值：{invalidValue}）
jakarta.validation.constraints.Past.message.base            = {0}必须是过去的日期（输入值：{invalidValue}）
jakarta.validation.constraints.PastOrPresent.message.base   = {0}必须是过去或现在的日期（输入值：{invalidValue}）
jakarta.validation.constraints.Pattern.message.base         = {0}必须匹配"{regexp}"（输入值：{invalidValue}）
jakarta.validation.constraints.Positive.message.base        = {0}必须大于0（输入值：{invalidValue}）
jakarta.validation.constraints.PositiveOrZero.message.base  = {0}必须大于或等于0（输入值：{invalidValue}）
jakarta.validation.constraints.Size.message.base            = {0}的大小必须在{min}和{max}之间（输入值：{invalidValue}）
