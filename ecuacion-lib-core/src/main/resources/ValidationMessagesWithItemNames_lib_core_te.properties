# jakarta validation standard messages with item names
jakarta.validation.constraints.AssertFalse.message.base     = {0} false అయి ఉండాలి. (నమోదు చేసిన విలువ: {invalidValue})
jakarta.validation.constraints.AssertTrue.message.base      = {0} true అయి ఉండాలి. (నమోదు చేసిన విలువ: {invalidValue})
jakarta.validation.constraints.DecimalMax.message.base      = {0} {value} కంటే ${inclusive == true ? 'తక్కువ లేదా సమానంగా' : 'తక్కువగా'} ఉండాలి. (నమోదు చేసిన విలువ: {invalidValue})
jakarta.validation.constraints.DecimalMin.message.base      = {0} {value} కంటే ${inclusive == true ? 'ఎక్కువ లేదా సమానంగా' : 'ఎక్కువగా'} ఉండాలి. (నమోదు చేసిన విలువ: {invalidValue})
jakarta.validation.constraints.Digits.message.base          = {0} యొక్క సంఖ్యా విలువ పరిధికి వెలుపల ఉంది (<{integer} అంకెలు>.<{fraction} అంకెలు> ఆశించబడింది). (నమోదు చేసిన విలువ: {invalidValue})
jakarta.validation.constraints.Email.message.base           = {0} చెల్లుబాటు అయ్యే ఇమెయిల్ చిరునామా అయి ఉండాలి. (నమోదు చేసిన విలువ: {invalidValue})
jakarta.validation.constraints.Future.message.base          = {0} భవిష్యత్ తేదీ అయి ఉండాలి. (నమోదు చేసిన విలువ: {invalidValue})
jakarta.validation.constraints.FutureOrPresent.message.base = {0} ప్రస్తుత లేదా భవిష్యత్ తేదీ అయి ఉండాలి. (నమోదు చేసిన విలువ: {invalidValue})
jakarta.validation.constraints.Max.message.base             = {0} {value} కంటే తక్కువ లేదా సమానంగా ఉండాలి. (నమోదు చేసిన విలువ: {invalidValue})
jakarta.validation.constraints.Min.message.base             = {0} {value} కంటే ఎక్కువ లేదా సమానంగా ఉండాలి. (నమోదు చేసిన విలువ: {invalidValue})
jakarta.validation.constraints.Negative.message.base        = {0} 0 కంటే తక్కువగా ఉండాలి. (నమోదు చేసిన విలువ: {invalidValue})
jakarta.validation.constraints.NegativeOrZero.message.base  = {0} 0 కంటే తక్కువ లేదా సమానంగా ఉండాలి. (నమోదు చేసిన విలువ: {invalidValue})
jakarta.validation.constraints.NotBlank.message.base        = {0} ఖాళీగా లేదా ఖాళీ స్థలాలు మాత్రమే ఉండకూడదు.
jakarta.validation.constraints.NotEmpty.message.base        = {0} ఖాళీగా ఉండకూడదు.
jakarta.validation.constraints.NotNull.message.base         = {0} null కాకూడదు.
jakarta.validation.constraints.Null.message.base            = {0} null అయి ఉండాలి. (నమోదు చేసిన విలువ: {invalidValue})
jakarta.validation.constraints.Past.message.base            = {0} గత తేదీ అయి ఉండాలి. (నమోదు చేసిన విలువ: {invalidValue})
jakarta.validation.constraints.PastOrPresent.message.base   = {0} గత లేదా ప్రస్తుత తేదీ అయి ఉండాలి. (నమోదు చేసిన విలువ: {invalidValue})
jakarta.validation.constraints.Pattern.message.base         = {0} "{regexp}" తో సరిపోలాలి. (నమోదు చేసిన విలువ: {invalidValue})
jakarta.validation.constraints.Positive.message.base        = {0} 0 కంటే ఎక్కువగా ఉండాలి. (నమోదు చేసిన విలువ: {invalidValue})
jakarta.validation.constraints.PositiveOrZero.message.base  = {0} 0 కంటే ఎక్కువ లేదా సమానంగా ఉండాలి. (నమోదు చేసిన విలువ: {invalidValue})
jakarta.validation.constraints.Size.message.base            = {0} యొక్క పరిమాణం {min} నుండి {max} మధ్య ఉండాలి. (నమోదు చేసిన విలువ: {invalidValue})
