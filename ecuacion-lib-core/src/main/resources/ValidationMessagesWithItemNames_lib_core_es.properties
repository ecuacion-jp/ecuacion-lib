# jakarta validation standard messages with item names
jakarta.validation.constraints.AssertFalse.message.base     = {0} debe ser false. (entrada: {invalidValue})
jakarta.validation.constraints.AssertTrue.message.base      = {0} debe ser true. (entrada: {invalidValue})
jakarta.validation.constraints.DecimalMax.message.base      = {0} debe ser menor ${inclusive == true ? 'o igual que' : 'que'} {value}. (entrada: {invalidValue})
jakarta.validation.constraints.DecimalMin.message.base      = {0} debe ser mayor ${inclusive == true ? 'o igual que' : 'que'} {value}. (entrada: {invalidValue})
jakarta.validation.constraints.Digits.message.base          = El valor numérico de {0} está fuera de los límites (se esperaba <{integer} dígitos>.<{fraction} dígitos>). (entrada: {invalidValue})
jakarta.validation.constraints.Email.message.base           = {0} debe ser una dirección de correo electrónico con formato correcto. (entrada: {invalidValue})
jakarta.validation.constraints.Future.message.base          = {0} debe ser una fecha futura. (entrada: {invalidValue})
jakarta.validation.constraints.FutureOrPresent.message.base = {0} debe ser una fecha en el presente o en el futuro. (entrada: {invalidValue})
jakarta.validation.constraints.Max.message.base             = {0} debe ser menor o igual que {value}. (entrada: {invalidValue})
jakarta.validation.constraints.Min.message.base             = {0} debe ser mayor o igual que {value}. (entrada: {invalidValue})
jakarta.validation.constraints.Negative.message.base        = {0} debe ser menor que 0. (entrada: {invalidValue})
jakarta.validation.constraints.NegativeOrZero.message.base  = {0} debe ser menor o igual que 0. (entrada: {invalidValue})
jakarta.validation.constraints.NotBlank.message.base        = {0} no debe estar vacío ni contener solo espacios.
jakarta.validation.constraints.NotEmpty.message.base        = {0} no debe estar vacío.
jakarta.validation.constraints.NotNull.message.base         = {0} no debe ser null.
jakarta.validation.constraints.Null.message.base            = {0} debe ser null. (entrada: {invalidValue})
jakarta.validation.constraints.Past.message.base            = {0} debe ser una fecha pasada. (entrada: {invalidValue})
jakarta.validation.constraints.PastOrPresent.message.base   = {0} debe ser una fecha en el pasado o en el presente. (entrada: {invalidValue})
jakarta.validation.constraints.Pattern.message.base         = {0} debe coincidir con "{regexp}". (entrada: {invalidValue})
jakarta.validation.constraints.Positive.message.base        = {0} debe ser mayor que 0. (entrada: {invalidValue})
jakarta.validation.constraints.PositiveOrZero.message.base  = {0} debe ser mayor o igual que 0. (entrada: {invalidValue})
jakarta.validation.constraints.Size.message.base            = El tamaño de {0} debe estar entre {min} y {max}. (entrada: {invalidValue})
