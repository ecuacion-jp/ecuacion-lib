# jakarta validation standard messages with item names
jakarta.validation.constraints.AssertFalse.message.base     = Значение {0} должно быть false. (введено: {invalidValue})
jakarta.validation.constraints.AssertTrue.message.base      = Значение {0} должно быть true. (введено: {invalidValue})
jakarta.validation.constraints.DecimalMax.message.base      = Значение {0} должно быть меньше ${inclusive == true ? 'или равно ' : ''}{value}. (введено: {invalidValue})
jakarta.validation.constraints.DecimalMin.message.base      = Значение {0} должно быть больше ${inclusive == true ? 'или равно ' : ''}{value}. (введено: {invalidValue})
jakarta.validation.constraints.Digits.message.base          = Числовое значение {0} вне допустимого диапазона (ожидается <{integer} цифр>.<{fraction} цифр>). (введено: {invalidValue})
jakarta.validation.constraints.Email.message.base           = Значение {0} должно быть корректным адресом электронной почты. (введено: {invalidValue})
jakarta.validation.constraints.Future.message.base          = Значение {0} должно быть датой в будущем. (введено: {invalidValue})
jakarta.validation.constraints.FutureOrPresent.message.base = Значение {0} должно быть датой в настоящем или будущем. (введено: {invalidValue})
jakarta.validation.constraints.Max.message.base             = Значение {0} должно быть меньше или равно {value}. (введено: {invalidValue})
jakarta.validation.constraints.Min.message.base             = Значение {0} должно быть больше или равно {value}. (введено: {invalidValue})
jakarta.validation.constraints.Negative.message.base        = Значение {0} должно быть меньше 0. (введено: {invalidValue})
jakarta.validation.constraints.NegativeOrZero.message.base  = Значение {0} должно быть меньше или равно 0. (введено: {invalidValue})
jakarta.validation.constraints.NotBlank.message.base        = Значение {0} не должно быть пустым или состоять только из пробелов.
jakarta.validation.constraints.NotEmpty.message.base        = Значение {0} не должно быть пустым.
jakarta.validation.constraints.NotNull.message.base         = Значение {0} не должно быть null.
jakarta.validation.constraints.Null.message.base            = Значение {0} должно быть null. (введено: {invalidValue})
jakarta.validation.constraints.Past.message.base            = Значение {0} должно быть датой в прошлом. (введено: {invalidValue})
jakarta.validation.constraints.PastOrPresent.message.base   = Значение {0} должно быть датой в прошлом или настоящем. (введено: {invalidValue})
jakarta.validation.constraints.Pattern.message.base         = Значение {0} должно соответствовать "{regexp}". (введено: {invalidValue})
jakarta.validation.constraints.Positive.message.base        = Значение {0} должно быть больше 0. (введено: {invalidValue})
jakarta.validation.constraints.PositiveOrZero.message.base  = Значение {0} должно быть больше или равно 0. (введено: {invalidValue})
jakarta.validation.constraints.Size.message.base            = Размер {0} должен быть от {min} до {max}. (введено: {invalidValue})
