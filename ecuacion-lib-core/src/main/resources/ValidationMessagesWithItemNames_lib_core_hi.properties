# jakarta validation standard messages with item names
jakarta.validation.constraints.AssertFalse.message.base     = {0} false होना चाहिए। (दर्ज मान: {invalidValue})
jakarta.validation.constraints.AssertTrue.message.base      = {0} true होना चाहिए। (दर्ज मान: {invalidValue})
jakarta.validation.constraints.DecimalMax.message.base      = {0} {value} से कम ${inclusive == true ? 'या उसके बराबर ' : ''}होना चाहिए। (दर्ज मान: {invalidValue})
jakarta.validation.constraints.DecimalMin.message.base      = {0} {value} से अधिक ${inclusive == true ? 'या उसके बराबर ' : ''}होना चाहिए। (दर्ज मान: {invalidValue})
jakarta.validation.constraints.Digits.message.base          = {0} का संख्यात्मक मान सीमा से बाहर है (<{integer} अंक>.<{fraction} अंक> अपेक्षित)। (दर्ज मान: {invalidValue})
jakarta.validation.constraints.Email.message.base           = {0} एक मान्य ईमेल पता होना चाहिए। (दर्ज मान: {invalidValue})
jakarta.validation.constraints.Future.message.base          = {0} भविष्य की तिथि होनी चाहिए। (दर्ज मान: {invalidValue})
jakarta.validation.constraints.FutureOrPresent.message.base = {0} वर्तमान या भविष्य की तिथि होनी चाहिए। (दर्ज मान: {invalidValue})
jakarta.validation.constraints.Max.message.base             = {0} {value} से कम या उसके बराबर होना चाहिए। (दर्ज मान: {invalidValue})
jakarta.validation.constraints.Min.message.base             = {0} {value} से अधिक या उसके बराबर होना चाहिए। (दर्ज मान: {invalidValue})
jakarta.validation.constraints.Negative.message.base        = {0} 0 से कम होना चाहिए। (दर्ज मान: {invalidValue})
jakarta.validation.constraints.NegativeOrZero.message.base  = {0} 0 से कम या उसके बराबर होना चाहिए। (दर्ज मान: {invalidValue})
jakarta.validation.constraints.NotBlank.message.base        = {0} खाली या केवल रिक्त स्थानों वाला नहीं होना चाहिए।
jakarta.validation.constraints.NotEmpty.message.base        = {0} खाली नहीं होना चाहिए।
jakarta.validation.constraints.NotNull.message.base         = {0} null नहीं होना चाहिए।
jakarta.validation.constraints.Null.message.base            = {0} null होना चाहिए। (दर्ज मान: {invalidValue})
jakarta.validation.constraints.Past.message.base            = {0} भूतकाल की तिथि होनी चाहिए। (दर्ज मान: {invalidValue})
jakarta.validation.constraints.PastOrPresent.message.base   = {0} भूतकाल या वर्तमान की तिथि होनी चाहिए। (दर्ज मान: {invalidValue})
jakarta.validation.constraints.Pattern.message.base         = {0} "{regexp}" से मेल खाना चाहिए। (दर्ज मान: {invalidValue})
jakarta.validation.constraints.Positive.message.base        = {0} 0 से अधिक होना चाहिए। (दर्ज मान: {invalidValue})
jakarta.validation.constraints.PositiveOrZero.message.base  = {0} 0 से अधिक या उसके बराबर होना चाहिए। (दर्ज मान: {invalidValue})
jakarta.validation.constraints.Size.message.base            = {0} का आकार {min} और {max} के बीच होना चाहिए। (दर्ज मान: {invalidValue})
