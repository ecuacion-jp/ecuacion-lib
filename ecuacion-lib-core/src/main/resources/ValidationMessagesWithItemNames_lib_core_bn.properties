# jakarta validation standard messages with item names
jakarta.validation.constraints.AssertFalse.message.base     = {0} অবশ্যই false হবে। (প্রবিষ্ট মান: {invalidValue})
jakarta.validation.constraints.AssertTrue.message.base      = {0} অবশ্যই true হবে। (প্রবিষ্ট মান: {invalidValue})
jakarta.validation.constraints.DecimalMax.message.base      = {0} অবশ্যই {value} এর চেয়ে কম ${inclusive == true ? 'বা সমান ' : ''}হবে। (প্রবিষ্ট মান: {invalidValue})
jakarta.validation.constraints.DecimalMin.message.base      = {0} অবশ্যই {value} এর চেয়ে বেশি ${inclusive == true ? 'বা সমান ' : ''}হবে। (প্রবিষ্ট মান: {invalidValue})
jakarta.validation.constraints.Digits.message.base          = {0} এর সংখ্যাগত মান সীমার বাইরে (<{integer} অঙ্ক>.<{fraction} অঙ্ক> প্রত্যাশিত)। (প্রবিষ্ট মান: {invalidValue})
jakarta.validation.constraints.Email.message.base           = {0} অবশ্যই একটি বৈধ ইমেল ঠিকানা হবে। (প্রবিষ্ট মান: {invalidValue})
jakarta.validation.constraints.Future.message.base          = {0} অবশ্যই ভবিষ্যতের তারিখ হবে। (প্রবিষ্ট মান: {invalidValue})
jakarta.validation.constraints.FutureOrPresent.message.base = {0} অবশ্যই বর্তমান বা ভবিষ্যতের তারিখ হবে। (প্রবিষ্ট মান: {invalidValue})
jakarta.validation.constraints.Max.message.base             = {0} অবশ্যই {value} এর চেয়ে কম বা সমান হবে। (প্রবিষ্ট মান: {invalidValue})
jakarta.validation.constraints.Min.message.base             = {0} অবশ্যই {value} এর চেয়ে বেশি বা সমান হবে। (প্রবিষ্ট মান: {invalidValue})
jakarta.validation.constraints.Negative.message.base        = {0} অবশ্যই 0 এর চেয়ে কম হবে। (প্রবিষ্ট মান: {invalidValue})
jakarta.validation.constraints.NegativeOrZero.message.base  = {0} অবশ্যই 0 এর চেয়ে কম বা সমান হবে। (প্রবিষ্ট মান: {invalidValue})
jakarta.validation.constraints.NotBlank.message.base        = {0} খালি বা শুধু ফাঁকা স্থান হতে পারবে না।
jakarta.validation.constraints.NotEmpty.message.base        = {0} খালি হতে পারবে না।
jakarta.validation.constraints.NotNull.message.base         = {0} null হতে পারবে না।
jakarta.validation.constraints.Null.message.base            = {0} অবশ্যই null হবে। (প্রবিষ্ট মান: {invalidValue})
jakarta.validation.constraints.Past.message.base            = {0} অবশ্যই অতীতের তারিখ হবে। (প্রবিষ্ট মান: {invalidValue})
jakarta.validation.constraints.PastOrPresent.message.base   = {0} অবশ্যই অতীত বা বর্তমানের তারিখ হবে। (প্রবিষ্ট মান: {invalidValue})
jakarta.validation.constraints.Pattern.message.base         = {0} অবশ্যই "{regexp}" এর সাথে মিলবে। (প্রবিষ্ট মান: {invalidValue})
jakarta.validation.constraints.Positive.message.base        = {0} অবশ্যই 0 এর চেয়ে বেশি হবে। (প্রবিষ্ট মান: {invalidValue})
jakarta.validation.constraints.PositiveOrZero.message.base  = {0} অবশ্যই 0 এর চেয়ে বেশি বা সমান হবে। (প্রবিষ্ট মান: {invalidValue})
jakarta.validation.constraints.Size.message.base            = {0} এর আকার অবশ্যই {min} থেকে {max} এর মধ্যে হবে। (প্রবিষ্ট মান: {invalidValue})
