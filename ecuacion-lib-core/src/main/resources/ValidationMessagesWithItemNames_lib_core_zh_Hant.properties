# jakarta validation standard messages with item names
jakarta.validation.constraints.AssertFalse.message.base     = {0}必須為false（輸入值：{invalidValue}）
jakarta.validation.constraints.AssertTrue.message.base      = {0}必須為true（輸入值：{invalidValue}）
jakarta.validation.constraints.DecimalMax.message.base      = {0}必須小於${inclusive == true ? '或等於' : ''}{value}（輸入值：{invalidValue}）
jakarta.validation.constraints.DecimalMin.message.base      = {0}必須大於${inclusive == true ? '或等於' : ''}{value}（輸入值：{invalidValue}）
jakarta.validation.constraints.Digits.message.base          = {0}的數值超出範圍（應為<{integer}位整數>.<{fraction}位小數>）（輸入值：{invalidValue}）
jakarta.validation.constraints.Email.message.base           = {0}必須是格式正確的電子郵件位址（輸入值：{invalidValue}）
jakarta.validation.constraints.Future.message.base          = {0}必須是未來的日期（輸入值：{invalidValue}）
jakarta.validation.constraints.FutureOrPresent.message.base = {0}必須是現在或未來的日期（輸入值：{invalidValue}）
jakarta.validation.constraints.Max.message.base             = {0}必須小於或等於{value}（輸入值：{invalidValue}）
jakarta.validation.constraints.Min.message.base             = {0}必須大於或等於{value}（輸入值：{invalidValue}）
jakarta.validation.constraints.Negative.message.base        = {0}必須小於0（輸入值：{invalidValue}）
jakarta.validation.constraints.NegativeOrZero.message.base  = {0}必須小於或等於0（輸入值：{invalidValue}）
jakarta.validation.constraints.NotBlank.message.base        = {0}不得空白
jakarta.validation.constraints.NotEmpty.message.base        = {0}不得為空
jakarta.validation.constraints.NotNull.message.base         = {0}不得為null
jakarta.validation.constraints.Null.message.base            = {0}必須為null（輸入值：{invalidValue}）
jakarta.validation.constraints.Past.message.base            = {0}必須是過去的日期（輸入值：{invalidValue}）
jakarta.validation.constraints.PastOrPresent.message.base   = {0}必須是過去或現在的日期（輸入值：{invalidValue}）
jakarta.validation.constraints.Pattern.message.base         = {0}必須符合"{regexp}"（輸入值：{invalidValue}）
jakarta.validation.constraints.Positive.message.base        = {0}必須大於0（輸入值：{invalidValue}）
jakarta.validation.constraints.PositiveOrZero.message.base  = {0}必須大於或等於0（輸入值：{invalidValue}）
jakarta.validation.constraints.Size.message.base            = {0}的大小必須在{min}和{max}之間（輸入值：{invalidValue}）
