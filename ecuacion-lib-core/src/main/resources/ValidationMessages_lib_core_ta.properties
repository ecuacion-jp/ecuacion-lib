# jakarta validation standard messages, for the languages Hibernate Validator does not support
jakarta.validation.constraints.AssertFalse.message.base     = false ஆக இருக்க வேண்டும்
jakarta.validation.constraints.AssertTrue.message.base      = true ஆக இருக்க வேண்டும்
jakarta.validation.constraints.DecimalMax.message.base      = {value} ஐ விடக் குறைவாக ${inclusive == true ? 'அல்லது சமமாக ' : ''}இருக்க வேண்டும்
jakarta.validation.constraints.DecimalMin.message.base      = {value} ஐ விட அதிகமாக ${inclusive == true ? 'அல்லது சமமாக ' : ''}இருக்க வேண்டும்
jakarta.validation.constraints.Digits.message.base          = எண் மதிப்பு வரம்புக்கு வெளியே உள்ளது (<{integer} இலக்கங்கள்>.<{fraction} இலக்கங்கள்> எதிர்பார்க்கப்படுகிறது)
jakarta.validation.constraints.Email.message.base           = சரியான மின்னஞ்சல் முகவரியாக இருக்க வேண்டும்
jakarta.validation.constraints.Future.message.base          = எதிர்கால தேதியாக இருக்க வேண்டும்
jakarta.validation.constraints.FutureOrPresent.message.base = தற்போதைய அல்லது எதிர்கால தேதியாக இருக்க வேண்டும்
jakarta.validation.constraints.Max.message.base             = {value} ஐ விடக் குறைவாக அல்லது சமமாக இருக்க வேண்டும்
jakarta.validation.constraints.Min.message.base             = {value} ஐ விட அதிகமாக அல்லது சமமாக இருக்க வேண்டும்
jakarta.validation.constraints.Negative.message.base        = 0 ஐ விடக் குறைவாக இருக்க வேண்டும்
jakarta.validation.constraints.NegativeOrZero.message.base  = 0 ஐ விடக் குறைவாக அல்லது சமமாக இருக்க வேண்டும்
jakarta.validation.constraints.NotBlank.message.base        = காலியாகவோ இடைவெளிகள் மட்டுமாகவோ இருக்கக்கூடாது
jakarta.validation.constraints.NotEmpty.message.base        = காலியாக இருக்கக்கூடாது
jakarta.validation.constraints.NotNull.message.base         = null ஆக இருக்கக்கூடாது
jakarta.validation.constraints.Null.message.base            = null ஆக இருக்க வேண்டும்
jakarta.validation.constraints.Past.message.base            = கடந்த கால தேதியாக இருக்க வேண்டும்
jakarta.validation.constraints.PastOrPresent.message.base   = கடந்த கால அல்லது தற்போதைய தேதியாக இருக்க வேண்டும்
jakarta.validation.constraints.Pattern.message.base         = "{regexp}" உடன் பொருந்த வேண்டும்
jakarta.validation.constraints.Positive.message.base        = 0 ஐ விட அதிகமாக இருக்க வேண்டும்
jakarta.validation.constraints.PositiveOrZero.message.base  = 0 ஐ விட அதிகமாக அல்லது சமமாக இருக்க வேண்டும்
jakarta.validation.constraints.Size.message.base            = அளவு {min} முதல் {max} வரை இருக்க வேண்டும்
