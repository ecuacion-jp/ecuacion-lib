# jakarta validation standard messages with item names
jakarta.validation.constraints.AssertFalse.message.base     = {0} musí být false. (zadáno: {invalidValue})
jakarta.validation.constraints.AssertTrue.message.base      = {0} musí být true. (zadáno: {invalidValue})
jakarta.validation.constraints.DecimalMax.message.base      = {0} musí být menší ${inclusive == true ? 'nebo rovno' : 'než'} {value}. (zadáno: {invalidValue})
jakarta.validation.constraints.DecimalMin.message.base      = {0} musí být větší ${inclusive == true ? 'nebo rovno' : 'než'} {value}. (zadáno: {invalidValue})
jakarta.validation.constraints.Digits.message.base          = Číselná hodnota {0} je mimo povolený rozsah (očekáváno <{integer} číslic>.<{fraction} číslic>). (zadáno: {invalidValue})
jakarta.validation.constraints.Email.message.base           = {0} musí být platná e-mailová adresa. (zadáno: {invalidValue})
jakarta.validation.constraints.Future.message.base          = {0} musí být datum v budoucnosti. (zadáno: {invalidValue})
jakarta.validation.constraints.FutureOrPresent.message.base = {0} musí být datum v přítomnosti nebo v budoucnosti. (zadáno: {invalidValue})
jakarta.validation.constraints.Max.message.base             = {0} musí být menší nebo rovno {value}. (zadáno: {invalidValue})
jakarta.validation.constraints.Min.message.base             = {0} musí být větší nebo rovno {value}. (zadáno: {invalidValue})
jakarta.validation.constraints.Negative.message.base        = {0} musí být menší než 0. (zadáno: {invalidValue})
jakarta.validation.constraints.NegativeOrZero.message.base  = {0} musí být menší nebo rovno 0. (zadáno: {invalidValue})
jakarta.validation.constraints.NotBlank.message.base        = {0} nesmí být prázdné ani obsahovat pouze mezery.
jakarta.validation.constraints.NotEmpty.message.base        = {0} nesmí být prázdné.
jakarta.validation.constraints.NotNull.message.base         = {0} nesmí být null.
jakarta.validation.constraints.Null.message.base            = {0} musí být null. (zadáno: {invalidValue})
jakarta.validation.constraints.Past.message.base            = {0} musí být datum v minulosti. (zadáno: {invalidValue})
jakarta.validation.constraints.PastOrPresent.message.base   = {0} musí být datum v minulosti nebo v přítomnosti. (zadáno: {invalidValue})
jakarta.validation.constraints.Pattern.message.base         = {0} musí odpovídat "{regexp}". (zadáno: {invalidValue})
jakarta.validation.constraints.Positive.message.base        = {0} musí být větší než 0. (zadáno: {invalidValue})
jakarta.validation.constraints.PositiveOrZero.message.base  = {0} musí být větší nebo rovno 0. (zadáno: {invalidValue})
jakarta.validation.constraints.Size.message.base            = Velikost {0} musí být mezi {min} a {max}. (zadáno: {invalidValue})
