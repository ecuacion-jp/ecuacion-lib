# jakarta validation standard messages with item names
jakarta.validation.constraints.AssertFalse.message.base     = {0} false असणे आवश्यक आहे. (प्रविष्ट मूल्य: {invalidValue})
jakarta.validation.constraints.AssertTrue.message.base      = {0} true असणे आवश्यक आहे. (प्रविष्ट मूल्य: {invalidValue})
jakarta.validation.constraints.DecimalMax.message.base      = {0} {value} पेक्षा कमी ${inclusive == true ? 'किंवा समान ' : ''}असणे आवश्यक आहे. (प्रविष्ट मूल्य: {invalidValue})
jakarta.validation.constraints.DecimalMin.message.base      = {0} {value} पेक्षा जास्त ${inclusive == true ? 'किंवा समान ' : ''}असणे आवश्यक आहे. (प्रविष्ट मूल्य: {invalidValue})
jakarta.validation.constraints.Digits.message.base          = {0} चे संख्यात्मक मूल्य मर्यादेबाहेर आहे (<{integer} अंक>.<{fraction} अंक> अपेक्षित). (प्रविष्ट मूल्य: {invalidValue})
jakarta.validation.constraints.Email.message.base           = {0} वैध ईमेल पत्ता असणे आवश्यक आहे. (प्रविष्ट मूल्य: {invalidValue})
jakarta.validation.constraints.Future.message.base          = {0} भविष्यातील तारीख असणे आवश्यक आहे. (प्रविष्ट मूल्य: {invalidValue})
jakarta.validation.constraints.FutureOrPresent.message.base = {0} वर्तमान किंवा भविष्यातील तारीख असणे आवश्यक आहे. (प्रविष्ट मूल्य: {invalidValue})
jakarta.validation.constraints.Max.message.base             = {0} {value} पेक्षा कमी किंवा समान असणे आवश्यक आहे. (प्रविष्ट मूल्य: {invalidValue})
jakarta.validation.constraints.Min.message.base             = {0} {value} पेक्षा जास्त किंवा समान असणे आवश्यक आहे. (प्रविष्ट मूल्य: {invalidValue})
jakarta.validation.constraints.Negative.message.base        = {0} 0 पेक्षा कमी असणे आवश्यक आहे. (प्रविष्ट मूल्य: {invalidValue})
jakarta.validation.constraints.NegativeOrZero.message.base  = {0} 0 पेक्षा कमी किंवा समान असणे आवश्यक आहे. (प्रविष्ट मूल्य: {invalidValue})
jakarta.validation.constraints.NotBlank.message.base        = {0} रिक्त किंवा फक्त रिकाम्या जागांचे नसावे.
jakarta.validation.constraints.NotEmpty.message.base        = {0} रिक्त नसावे.
jakarta.validation.constraints.NotNull.message.base         = {0} null नसावे.
jakarta.validation.constraints.Null.message.base            = {0} null असणे आवश्यक आहे. (प्रविष्ट मूल्य: {invalidValue})
jakarta.validation.constraints.Past.message.base            = {0} भूतकाळातील तारीख असणे आवश्यक आहे. (प्रविष्ट मूल्य: {invalidValue})
jakarta.validation.constraints.PastOrPresent.message.base   = {0} भूतकाळातील किंवा वर्तमान तारीख असणे आवश्यक आहे. (प्रविष्ट मूल्य: {invalidValue})
jakarta.validation.constraints.Pattern.message.base         = {0} "{regexp}" शी जुळणे आवश्यक आहे. (प्रविष्ट मूल्य: {invalidValue})
jakarta.validation.constraints.Positive.message.base        = {0} 0 पेक्षा जास्त असणे आवश्यक आहे. (प्रविष्ट मूल्य: {invalidValue})
jakarta.validation.constraints.PositiveOrZero.message.base  = {0} 0 पेक्षा जास्त किंवा समान असणे आवश्यक आहे. (प्रविष्ट मूल्य: {invalidValue})
jakarta.validation.constraints.Size.message.base            = {0} चा आकार {min} आणि {max} दरम्यान असणे आवश्यक आहे. (प्रविष्ट मूल्य: {invalidValue})
