# jakarta validation standard messages with item names
jakarta.validation.constraints.AssertFalse.message.base     = {0} deve ser false. (valor informado: {invalidValue})
jakarta.validation.constraints.AssertTrue.message.base      = {0} deve ser true. (valor informado: {invalidValue})
jakarta.validation.constraints.DecimalMax.message.base      = {0} deve ser menor ${inclusive == true ? 'ou igual a' : 'que'} {value}. (valor informado: {invalidValue})
jakarta.validation.constraints.DecimalMin.message.base      = {0} deve ser maior ${inclusive == true ? 'ou igual a' : 'que'} {value}. (valor informado: {invalidValue})
jakarta.validation.constraints.Digits.message.base          = O valor numérico de {0} está fora dos limites (esperado <{integer} dígitos>.<{fraction} dígitos>). (valor informado: {invalidValue})
jakarta.validation.constraints.Email.message.base           = {0} deve ser um endereço de e-mail bem formado. (valor informado: {invalidValue})
jakarta.validation.constraints.Future.message.base          = {0} deve ser uma data futura. (valor informado: {invalidValue})
jakarta.validation.constraints.FutureOrPresent.message.base = {0} deve ser uma data no presente ou no futuro. (valor informado: {invalidValue})
jakarta.validation.constraints.Max.message.base             = {0} deve ser menor ou igual a {value}. (valor informado: {invalidValue})
jakarta.validation.constraints.Min.message.base             = {0} deve ser maior ou igual a {value}. (valor informado: {invalidValue})
jakarta.validation.constraints.Negative.message.base        = {0} deve ser menor que 0. (valor informado: {invalidValue})
jakarta.validation.constraints.NegativeOrZero.message.base  = {0} deve ser menor ou igual a 0. (valor informado: {invalidValue})
jakarta.validation.constraints.NotBlank.message.base        = {0} não deve estar vazio nem conter apenas espaços.
jakarta.validation.constraints.NotEmpty.message.base        = {0} não deve estar vazio.
jakarta.validation.constraints.NotNull.message.base         = {0} não deve ser null.
jakarta.validation.constraints.Null.message.base            = {0} deve ser null. (valor informado: {invalidValue})
jakarta.validation.constraints.Past.message.base            = {0} deve ser uma data passada. (valor informado: {invalidValue})
jakarta.validation.constraints.PastOrPresent.message.base   = {0} deve ser uma data no passado ou no presente. (valor informado: {invalidValue})
jakarta.validation.constraints.Pattern.message.base         = {0} deve corresponder a "{regexp}". (valor informado: {invalidValue})
jakarta.validation.constraints.Positive.message.base        = {0} deve ser maior que 0. (valor informado: {invalidValue})
jakarta.validation.constraints.PositiveOrZero.message.base  = {0} deve ser maior ou igual a 0. (valor informado: {invalidValue})
