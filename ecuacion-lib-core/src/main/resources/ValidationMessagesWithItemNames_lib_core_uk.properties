# jakarta validation standard messages with item names
jakarta.validation.constraints.AssertFalse.message.base     = Значення {0} має бути false. (введено: {invalidValue})
jakarta.validation.constraints.AssertTrue.message.base      = Значення {0} має бути true. (введено: {invalidValue})
jakarta.validation.constraints.DecimalMax.message.base      = Значення {0} має бути менше ${inclusive == true ? 'або дорівнювати ' : ''}{value}. (введено: {invalidValue})
jakarta.validation.constraints.DecimalMin.message.base      = Значення {0} має бути більше ${inclusive == true ? 'або дорівнювати ' : ''}{value}. (введено: {invalidValue})
jakarta.validation.constraints.Digits.message.base          = Числове значення {0} поза допустимим діапазоном (очікується <{integer} цифр>.<{fraction} цифр>). (введено: {invalidValue})
jakarta.validation.constraints.Email.message.base           = Значення {0} має бути коректною адресою електронної пошти. (введено: {invalidValue})
jakarta.validation.constraints.Future.message.base          = Значення {0} має бути датою в майбутньому. (введено: {invalidValue})
jakarta.validation.constraints.FutureOrPresent.message.base = Значення {0} має бути датою в теперішньому або майбутньому. (введено: {invalidValue})
jakarta.validation.constraints.Max.message.base             = Значення {0} має бути менше або дорівнювати {value}. (введено: {invalidValue})
jakarta.validation.constraints.Min.message.base             = Значення {0} має бути більше або дорівнювати {value}. (введено: {invalidValue})
jakarta.validation.constraints.Negative.message.base        = Значення {0} має бути менше 0. (введено: {invalidValue})
jakarta.validation.constraints.NegativeOrZero.message.base  = Значення {0} має бути менше або дорівнювати 0. (введено: {invalidValue})
jakarta.validation.constraints.NotBlank.message.base        = Значення {0} не має бути порожнім або складатися лише з пробілів.
jakarta.validation.constraints.NotEmpty.message.base        = Значення {0} не має бути порожнім.
jakarta.validation.constraints.NotNull.message.base         = Значення {0} не має бути null.
jakarta.validation.constraints.Null.message.base            = Значення {0} має бути null. (введено: {invalidValue})
jakarta.validation.constraints.Past.message.base            = Значення {0} має бути датою в минулому. (введено: {invalidValue})
jakarta.validation.constraints.PastOrPresent.message.base   = Значення {0} має бути датою в минулому або теперішньому. (введено: {invalidValue})
jakarta.validation.constraints.Pattern.message.base         = Значення {0} має відповідати "{regexp}". (введено: {invalidValue})
jakarta.validation.constraints.Positive.message.base        = Значення {0} має бути більше 0. (введено: {invalidValue})
jakarta.validation.constraints.PositiveOrZero.message.base  = Значення {0} має бути більше або дорівнювати 0. (введено: {invalidValue})
jakarta.validation.constraints.Size.message.base            = Розмір {0} має бути від {min} до {max}. (введено: {invalidValue})
