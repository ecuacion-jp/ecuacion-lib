# jakarta validation standard messages with item names
jakarta.validation.constraints.AssertFalse.message.base     = {0}은(는) false여야 합니다. (입력값: {invalidValue})
jakarta.validation.constraints.AssertTrue.message.base      = {0}은(는) true여야 합니다. (입력값: {invalidValue})
jakarta.validation.constraints.DecimalMax.message.base      = {0}은(는) {value} ${inclusive == true ? '이하' : '미만'}이어야 합니다. (입력값: {invalidValue})
jakarta.validation.constraints.DecimalMin.message.base      = {0}은(는) {value} ${inclusive == true ? '이상' : '초과'}이어야 합니다. (입력값: {invalidValue})
jakarta.validation.constraints.Digits.message.base          = {0}의 숫자 값이 허용 범위를 벗어났습니다(<{integer}자리>.<{fraction}자리> 예상). (입력값: {invalidValue})
jakarta.validation.constraints.Email.message.base           = {0}은(는) 올바른 형식의 이메일 주소여야 합니다. (입력값: {invalidValue})
jakarta.validation.constraints.Future.message.base          = {0}은(는) 미래 날짜여야 합니다. (입력값: {invalidValue})
jakarta.validation.constraints.FutureOrPresent.message.base = {0}은(는) 현재 또는 미래 날짜여야 합니다. (입력값: {invalidValue})
jakarta.validation.constraints.Max.message.base             = {0}은(는) {value} 이하이어야 합니다. (입력값: {invalidValue})
jakarta.validation.constraints.Min.message.base             = {0}은(는) {value} 이상이어야 합니다. (입력값: {invalidValue})
jakarta.validation.constraints.Negative.message.base        = {0}은(는) 0보다 작아야 합니다. (입력값: {invalidValue})
jakarta.validation.constraints.NegativeOrZero.message.base  = {0}은(는) 0 이하이어야 합니다. (입력값: {invalidValue})
jakarta.validation.constraints.NotBlank.message.base        = {0}은(는) 비어 있거나 공백만 있으면 안 됩니다.
jakarta.validation.constraints.NotEmpty.message.base        = {0}은(는) 비어 있으면 안 됩니다.
jakarta.validation.constraints.NotNull.message.base         = {0}은(는) null이면 안 됩니다.
jakarta.validation.constraints.Null.message.base            = {0}은(는) null이어야 합니다. (입력값: {invalidValue})
jakarta.validation.constraints.Past.message.base            = {0}은(는) 과거 날짜여야 합니다. (입력값: {invalidValue})
jakarta.validation.constraints.PastOrPresent.message.base   = {0}은(는) 과거 또는 현재 날짜여야 합니다. (입력값: {invalidValue})
jakarta.validation.constraints.Pattern.message.base         = {0}은(는) "{regexp}"와(과) 일치해야 합니다. (입력값: {invalidValue})
jakarta.validation.constraints.Positive.message.base        = {0}은(는) 0보다 커야 합니다. (입력값: {invalidValue})
jakarta.validation.constraints.PositiveOrZero.message.base  = {0}은(는) 0 이상이어야 합니다. (입력값: {invalidValue})
jakarta.validation.constraints.Size.message.base            = {0}의 크기는 {min}에서 {max} 사이여야 합니다. (입력값: {invalidValue})
