# jakarta validation standard messages with item names
jakarta.validation.constraints.AssertFalse.message.base     = {0} mesti bernilai false. (nilai yang dimasukkan: {invalidValue})
jakarta.validation.constraints.AssertTrue.message.base      = {0} mesti bernilai true. (nilai yang dimasukkan: {invalidValue})
jakarta.validation.constraints.DecimalMax.message.base      = {0} mesti kurang daripada ${inclusive == true ? 'atau sama dengan ' : ''}{value}. (nilai yang dimasukkan: {invalidValue})
jakarta.validation.constraints.DecimalMin.message.base      = {0} mesti lebih daripada ${inclusive == true ? 'atau sama dengan ' : ''}{value}. (nilai yang dimasukkan: {invalidValue})
jakarta.validation.constraints.Digits.message.base          = Nilai berangka {0} di luar had (dijangka <{integer} digit>.<{fraction} digit>). (nilai yang dimasukkan: {invalidValue})
