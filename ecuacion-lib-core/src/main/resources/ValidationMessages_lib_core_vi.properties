# jakarta validation standard messages, for the languages Hibernate Validator does not support
jakarta.validation.constraints.AssertFalse.message.base     = phải là false
jakarta.validation.constraints.AssertTrue.message.base      = phải là true
jakarta.validation.constraints.DecimalMax.message.base      = phải nhỏ hơn ${inclusive == true ? 'hoặc bằng ' : ''}{value}
jakarta.validation.constraints.DecimalMin.message.base      = phải lớn hơn ${inclusive == true ? 'hoặc bằng ' : ''}{value}
jakarta.validation.constraints.Digits.message.base          = giá trị số nằm ngoài giới hạn (cần <{integer} chữ số>.<{fraction} chữ số>)
jakarta.validation.constraints.Email.message.base           = phải là địa chỉ email hợp lệ
jakarta.validation.constraints.Future.message.base          = phải là một ngày trong tương lai
jakarta.validation.constraints.FutureOrPresent.message.base = phải là một ngày ở hiện tại hoặc tương lai
jakarta.validation.constraints.Max.message.base             = phải nhỏ hơn hoặc bằng {value}
jakarta.validation.constraints.Min.message.base             = phải lớn hơn hoặc bằng {value}
jakarta.validation.constraints.Negative.message.base        = phải nhỏ hơn 0
jakarta.validation.constraints.NegativeOrZero.message.base  = phải nhỏ hơn hoặc bằng 0
jakarta.validation.constraints.NotBlank.message.base        = không được để trống hoặc chỉ chứa khoảng trắng
jakarta.validation.constraints.NotEmpty.message.base        = không được để trống
jakarta.validation.constraints.NotNull.message.base         = không được là null
jakarta.validation.constraints.Null.message.base            = phải là null
jakarta.validation.constraints.Past.message.base            = phải là một ngày trong quá khứ
jakarta.validation.constraints.PastOrPresent.message.base   = phải là một ngày trong quá khứ hoặc hiện tại
jakarta.validation.constraints.Pattern.message.base         = phải khớp với "{regexp}"
jakarta.validation.constraints.Positive.message.base        = phải lớn hơn 0
jakarta.validation.constraints.PositiveOrZero.message.base  = phải lớn hơn hoặc bằng 0
jakarta.validation.constraints.Size.message.base            = kích thước phải nằm trong khoảng {min} đến {max}
