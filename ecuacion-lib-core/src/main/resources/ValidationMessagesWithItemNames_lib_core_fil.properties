# jakarta validation standard messages with item names
jakarta.validation.constraints.AssertFalse.message.base     = Dapat false ang {0}. (inilagay: {invalidValue})
jakarta.validation.constraints.AssertTrue.message.base      = Dapat true ang {0}. (inilagay: {invalidValue})
jakarta.validation.constraints.DecimalMax.message.base      = Dapat mas mababa ${inclusive == true ? 'o katumbas ng' : 'sa'} {value} ang {0}. (inilagay: {invalidValue})
jakarta.validation.constraints.DecimalMin.message.base      = Dapat mas mataas ${inclusive == true ? 'o katumbas ng' : 'sa'} {value} ang {0}. (inilagay: {invalidValue})
jakarta.validation.constraints.Digits.message.base          = Lampas sa hangganan ang numerong halaga ng {0} (inaasahang <{integer} digit>.<{fraction} digit>). (inilagay: {invalidValue})
jakarta.validation.constraints.Email.message.base           = Dapat isang wastong email address ang {0}. (inilagay: {invalidValue})
jakarta.validation.constraints.Future.message.base          = Dapat petsa sa hinaharap ang {0}. (inilagay: {invalidValue})
jakarta.validation.constraints.FutureOrPresent.message.base = Dapat petsa sa kasalukuyan o hinaharap ang {0}. (inilagay: {invalidValue})
jakarta.validation.constraints.Max.message.base             = Dapat mas mababa o katumbas ng {value} ang {0}. (inilagay: {invalidValue})
jakarta.validation.constraints.Min.message.base             = Dapat mas mataas o katumbas ng {value} ang {0}. (inilagay: {invalidValue})
jakarta.validation.constraints.Negative.message.base        = Dapat mas mababa sa 0 ang {0}. (inilagay: {invalidValue})
jakarta.validation.constraints.NegativeOrZero.message.base  = Dapat mas mababa o katumbas ng 0 ang {0}. (inilagay: {invalidValue})
jakarta.validation.constraints.NotBlank.message.base        = Hindi dapat walang laman o puro espasyo ang {0}.
jakarta.validation.constraints.NotEmpty.message.base        = Hindi dapat walang laman ang {0}.
jakarta.validation.constraints.NotNull.message.base         = Hindi dapat null ang {0}.
jakarta.validation.constraints.Null.message.base            = Dapat null ang {0}. (inilagay: {invalidValue})
jakarta.validation.constraints.Past.message.base            = Dapat petsa sa nakaraan ang {0}. (inilagay: {invalidValue})
jakarta.validation.constraints.PastOrPresent.message.base   = Dapat petsa sa nakaraan o kasalukuyan ang {0}. (inilagay: {invalidValue})
jakarta.validation.constraints.Pattern.message.base         = Dapat tumugma sa "{regexp}" ang {0}. (inilagay: {invalidValue})
jakarta.validation.constraints.Positive.message.base        = Dapat mas mataas sa 0 ang {0}. (inilagay: {invalidValue})
jakarta.validation.constraints.PositiveOrZero.message.base  = Dapat mas mataas o katumbas ng 0 ang {0}. (inilagay: {invalidValue})
jakarta.validation.constraints.Size.message.base            = Dapat nasa pagitan ng {min} at {max} ang laki ng {0}. (inilagay: {invalidValue})
