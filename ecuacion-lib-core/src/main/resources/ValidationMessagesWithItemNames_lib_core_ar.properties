# jakarta validation standard messages with item names
jakarta.validation.constraints.AssertFalse.message.base     = يجب أن يكون {0} false. (القيمة المدخلة: \u2068{invalidValue}\u2069)
jakarta.validation.constraints.AssertTrue.message.base      = يجب أن يكون {0} true. (القيمة المدخلة: \u2068{invalidValue}\u2069)
jakarta.validation.constraints.DecimalMax.message.base      = يجب أن يكون {0} أقل من ${inclusive == true ? 'أو يساوي ' : ''}{value}. (القيمة المدخلة: \u2068{invalidValue}\u2069)
jakarta.validation.constraints.DecimalMin.message.base      = يجب أن يكون {0} أكبر من ${inclusive == true ? 'أو يساوي ' : ''}{value}. (القيمة المدخلة: \u2068{invalidValue}\u2069)
jakarta.validation.constraints.Digits.message.base          = القيمة الرقمية لـ {0} خارج الحدود (المتوقع <{integer} أرقام>.<{fraction} أرقام>). (القيمة المدخلة: \u2068{invalidValue}\u2069)
jakarta.validation.constraints.Email.message.base           = يجب أن يكون {0} عنوان بريد إلكتروني صحيح الصيغة. (القيمة المدخلة: \u2068{invalidValue}\u2069)
jakarta.validation.constraints.Future.message.base          = يجب أن يكون {0} تاريخًا في المستقبل. (القيمة المدخلة: \u2068{invalidValue}\u2069)
jakarta.validation.constraints.FutureOrPresent.message.base = يجب أن يكون {0} تاريخًا في الحاضر أو المستقبل. (القيمة المدخلة: \u2068{invalidValue}\u2069)
jakarta.validation.constraints.Max.message.base             = يجب أن يكون {0} أقل من أو يساوي {value}. (القيمة المدخلة: \u2068{invalidValue}\u2069)
jakarta.validation.constraints.Min.message.base             = يجب أن يكون {0} أكبر من أو يساوي {value}. (القيمة المدخلة: \u2068{invalidValue}\u2069)
jakarta.validation.constraints.Negative.message.base        = يجب أن يكون {0} أقل من 0. (القيمة المدخلة: \u2068{invalidValue}\u2069)
jakarta.validation.constraints.NegativeOrZero.message.base  = يجب أن يكون {0} أقل من أو يساوي 0. (القيمة المدخلة: \u2068{invalidValue}\u2069)
jakarta.validation.constraints.NotBlank.message.base        = يجب ألا يكون {0} فارغًا أو مكونًا من مسافات فقط.
jakarta.validation.constraints.NotEmpty.message.base        = يجب ألا يكون {0} فارغًا.
jakarta.validation.constraints.NotNull.message.base         = يجب ألا يكون {0} null.
jakarta.validation.constraints.Null.message.base            = يجب أن يكون {0} null. (القيمة المدخلة: \u2068{invalidValue}\u2069)
jakarta.validation.constraints.Past.message.base            = يجب أن يكون {0} تاريخًا في الماضي. (القيمة المدخلة: \u2068{invalidValue}\u2069)
jakarta.validation.constraints.PastOrPresent.message.base   = يجب أن يكون {0} تاريخًا في الماضي أو الحاضر. (القيمة المدخلة: \u2068{invalidValue}\u2069)
jakarta.validation.constraints.Pattern.message.base         = يجب أن يطابق {0} \u2066"{regexp}"\u2069. (القيمة المدخلة: \u2068{invalidValue}\u2069)
jakarta.validation.constraints.Positive.message.base        = يجب أن يكون {0} أكبر من 0. (القيمة المدخلة: \u2068{invalidValue}\u2069)
jakarta.validation.constraints.PositiveOrZero.message.base  = يجب أن يكون {0} أكبر من أو يساوي 0. (القيمة المدخلة: \u2068{invalidValue}\u2069)
jakarta.validation.constraints.Size.message.base            = يجب أن يكون حجم {0} بين {min} و{max}. (القيمة المدخلة: \u2068{invalidValue}\u2069)
