# jakarta validation standard messages with item names
jakarta.validation.constraints.AssertFalse.message.base     = {0} doit être false. (saisie : {invalidValue})
jakarta.validation.constraints.AssertTrue.message.base      = {0} doit être true. (saisie : {invalidValue})
jakarta.validation.constraints.DecimalMax.message.base      = {0} doit être inférieur ${inclusive == true ? 'ou égal à' : 'à'} {value}. (saisie : {invalidValue})
jakarta.validation.constraints.DecimalMin.message.base      = {0} doit être supérieur ${inclusive == true ? 'ou égal à' : 'à'} {value}. (saisie : {invalidValue})
jakarta.validation.constraints.Digits.message.base          = La valeur numérique de {0} est hors limites (<{integer} chiffres>.<{fraction} chiffres> attendus). (saisie : {invalidValue})
jakarta.validation.constraints.Email.message.base           = {0} doit être une adresse e-mail bien formée. (saisie : {invalidValue})
jakarta.validation.constraints.Future.message.base          = {0} doit être une date dans le futur. (saisie : {invalidValue})
jakarta.validation.constraints.FutureOrPresent.message.base = {0} doit être une date dans le présent ou dans le futur. (saisie : {invalidValue})
jakarta.validation.constraints.Max.message.base             = {0} doit être inférieur ou égal à {value}. (saisie : {invalidValue})
jakarta.validation.constraints.Min.message.base             = {0} doit être supérieur ou égal à {value}. (saisie : {invalidValue})
jakarta.validation.constraints.Negative.message.base        = {0} doit être inférieur à 0. (saisie : {invalidValue})
jakarta.validation.constraints.NegativeOrZero.message.base  = {0} doit être inférieur ou égal à 0. (saisie : {invalidValue})
jakarta.validation.constraints.NotBlank.message.base        = {0} ne doit pas être vide ni composé uniquement d’espaces.
jakarta.validation.constraints.NotEmpty.message.base        = {0} ne doit pas être vide.
jakarta.validation.constraints.NotNull.message.base         = {0} ne doit pas être null.
jakarta.validation.constraints.Null.message.base            = {0} doit être null. (saisie : {invalidValue})
jakarta.validation.constraints.Past.message.base            = {0} doit être une date dans le passé. (saisie : {invalidValue})
jakarta.validation.constraints.PastOrPresent.message.base   = {0} doit être une date dans le passé ou dans le présent. (saisie : {invalidValue})
jakarta.validation.constraints.Pattern.message.base         = {0} doit correspondre à "{regexp}". (saisie : {invalidValue})
jakarta.validation.constraints.Positive.message.base        = {0} doit être supérieur à 0. (saisie : {invalidValue})
jakarta.validation.constraints.PositiveOrZero.message.base  = {0} doit être supérieur ou égal à 0. (saisie : {invalidValue})
jakarta.validation.constraints.Size.message.base            = La taille de {0} doit être comprise entre {min} et {max}. (saisie : {invalidValue})
