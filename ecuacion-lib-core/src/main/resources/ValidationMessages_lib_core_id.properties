# jakarta validation standard messages, for the languages Hibernate Validator does not support
jakarta.validation.constraints.AssertFalse.message.base     = harus bernilai false
jakarta.validation.constraints.AssertTrue.message.base      = harus bernilai true
jakarta.validation.constraints.DecimalMax.message.base      = harus kurang dari ${inclusive == true ? 'atau sama dengan ' : ''}{value}
jakarta.validation.constraints.DecimalMin.message.base      = harus lebih dari ${inclusive == true ? 'atau sama dengan ' : ''}{value}
jakarta.validation.constraints.Digits.message.base          = nilai numerik di luar batas (diharapkan <{integer} digit>.<{fraction} digit>)
jakarta.validation.constraints.Email.message.base           = harus berupa alamat email yang valid
jakarta.validation.constraints.Future.message.base          = harus berupa tanggal di masa depan
jakarta.validation.constraints.FutureOrPresent.message.base = harus berupa tanggal saat ini atau di masa depan
jakarta.validation.constraints.Max.message.base             = harus kurang dari atau sama dengan {value}
jakarta.validation.constraints.Min.message.base             = harus lebih dari atau sama dengan {value}
jakarta.validation.constraints.Negative.message.base        = harus kurang dari 0
jakarta.validation.constraints.NegativeOrZero.message.base  = harus kurang dari atau sama dengan 0
jakarta.validation.constraints.NotBlank.message.base        = tidak boleh kosong atau hanya berisi spasi
jakarta.validation.constraints.NotEmpty.message.base        = tidak boleh kosong
jakarta.validation.constraints.NotNull.message.base         = tidak boleh null
jakarta.validation.constraints.Null.message.base            = harus null
jakarta.validation.constraints.Past.message.base            = harus berupa tanggal di masa lalu
jakarta.validation.constraints.PastOrPresent.message.base   = harus berupa tanggal di masa lalu atau saat ini
jakarta.validation.constraints.Pattern.message.base         = harus cocok dengan "{regexp}"
jakarta.validation.constraints.Positive.message.base        = harus lebih dari 0
jakarta.validation.constraints.PositiveOrZero.message.base  = harus lebih dari atau sama dengan 0
jakarta.validation.constraints.Size.message.base            = ukuran harus antara {min} dan {max}
