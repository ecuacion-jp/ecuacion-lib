# jakarta validation standard messages, for the languages Hibernate Validator does not support
jakarta.validation.constraints.AssertFalse.message.base     = false होना चाहिए
jakarta.validation.constraints.AssertTrue.message.base      = true होना चाहिए
jakarta.validation.constraints.DecimalMax.message.base      = {value} से कम ${inclusive == true ? 'या उसके बराबर ' : ''}होना चाहिए
jakarta.validation.constraints.DecimalMin.message.base      = {value} से अधिक ${inclusive == true ? 'या उसके बराबर ' : ''}होना चाहिए
jakarta.validation.constraints.Digits.message.base          = संख्यात्मक मान सीमा से बाहर है (<{integer} अंक>.<{fraction} अंक> अपेक्षित)
jakarta.validation.constraints.Email.message.base           = एक मान्य ईमेल पता होना चाहिए
jakarta.validation.constraints.Future.message.base          = भविष्य की तिथि होनी चाहिए
jakarta.validation.constraints.FutureOrPresent.message.base = वर्तमान या भविष्य की तिथि होनी चाहिए
jakarta.validation.constraints.Max.message.base             = {value} से कम या उसके बराबर होना चाहिए
jakarta.validation.constraints.Min.message.base             = {value} से अधिक या उसके बराबर होना चाहिए
jakarta.validation.constraints.Negative.message.base        = 0 से कम होना चाहिए
jakarta.validation.constraints.NegativeOrZero.message.base  = 0 से कम या उसके बराबर होना चाहिए
jakarta.validation.constraints.NotBlank.message.base        = खाली या केवल रिक्त स्थानों वाला नहीं होना चाहिए
jakarta.validation.constraints.NotEmpty.message.base        = खाली नहीं होना चाहिए
jakarta.validation.constraints.NotNull.message.base         = null नहीं होना चाहिए
jakarta.validation.constraints.Null.message.base            = null होना चाहिए
jakarta.validation.constraints.Past.message.base            = भूतकाल की तिथि होनी चाहिए
jakarta.validation.constraints.PastOrPresent.message.base   = भूतकाल या वर्तमान की तिथि होनी चाहिए
jakarta.validation.constraints.Pattern.message.base         = "{regexp}" से मेल खाना चाहिए
jakarta.validation.constraints.Positive.message.base        = 0 से अधिक होना चाहिए
jakarta.validation.constraints.PositiveOrZero.message.base  = 0 से अधिक या उसके बराबर होना चाहिए
jakarta.validation.constraints.Size.message.base            = आकार {min} और {max} के बीच होना चाहिए
