# jakarta validation standard messages with item names
jakarta.validation.constraints.AssertFalse.message.base     = {0} ต้องเป็น false (ค่าที่ป้อน: {invalidValue})
jakarta.validation.constraints.AssertTrue.message.base      = {0} ต้องเป็น true (ค่าที่ป้อน: {invalidValue})
jakarta.validation.constraints.DecimalMax.message.base      = {0} ต้องน้อยกว่า${inclusive == true ? 'หรือเท่ากับ' : ''} {value} (ค่าที่ป้อน: {invalidValue})
jakarta.validation.constraints.DecimalMin.message.base      = {0} ต้องมากกว่า${inclusive == true ? 'หรือเท่ากับ' : ''} {value} (ค่าที่ป้อน: {invalidValue})
jakarta.validation.constraints.Digits.message.base          = ค่าตัวเลขของ {0} อยู่นอกขอบเขต (ต้องเป็น <{integer} หลัก>.<{fraction} หลัก>) (ค่าที่ป้อน: {invalidValue})
jakarta.validation.constraints.Email.message.base           = {0} ต้องเป็นที่อยู่อีเมลที่ถูกต้อง (ค่าที่ป้อน: {invalidValue})
jakarta.validation.constraints.Future.message.base          = {0} ต้องเป็นวันที่ในอนาคต (ค่าที่ป้อน: {invalidValue})
jakarta.validation.constraints.FutureOrPresent.message.base = {0} ต้องเป็นวันที่ในปัจจุบันหรืออนาคต (ค่าที่ป้อน: {invalidValue})
jakarta.validation.constraints.Max.message.base             = {0} ต้องน้อยกว่าหรือเท่ากับ {value} (ค่าที่ป้อน: {invalidValue})
jakarta.validation.constraints.Min.message.base             = {0} ต้องมากกว่าหรือเท่ากับ {value} (ค่าที่ป้อน: {invalidValue})
jakarta.validation.constraints.Negative.message.base        = {0} ต้องน้อยกว่า 0 (ค่าที่ป้อน: {invalidValue})
jakarta.validation.constraints.NegativeOrZero.message.base  = {0} ต้องน้อยกว่าหรือเท่ากับ 0 (ค่าที่ป้อน: {invalidValue})
jakarta.validation.constraints.NotBlank.message.base        = {0} ต้องไม่ว่างหรือมีเพียงช่องว่าง
jakarta.validation.constraints.NotEmpty.message.base        = {0} ต้องไม่ว่าง
jakarta.validation.constraints.NotNull.message.base         = {0} ต้องไม่เป็น null
jakarta.validation.constraints.Null.message.base            = {0} ต้องเป็น null (ค่าที่ป้อน: {invalidValue})
jakarta.validation.constraints.Past.message.base            = {0} ต้องเป็นวันที่ในอดีต (ค่าที่ป้อน: {invalidValue})
jakarta.validation.constraints.PastOrPresent.message.base   = {0} ต้องเป็นวันที่ในอดีตหรือปัจจุบัน (ค่าที่ป้อน: {invalidValue})
jakarta.validation.constraints.Pattern.message.base         = {0} ต้องตรงกับ "{regexp}" (ค่าที่ป้อน: {invalidValue})
jakarta.validation.constraints.Positive.message.base        = {0} ต้องมากกว่า 0 (ค่าที่ป้อน: {invalidValue})
jakarta.validation.constraints.PositiveOrZero.message.base  = {0} ต้องมากกว่าหรือเท่ากับ 0 (ค่าที่ป้อน: {invalidValue})
jakarta.validation.constraints.Size.message.base            = ขนาดของ {0} ต้องอยู่ระหว่าง {min} ถึง {max} (ค่าที่ป้อน: {invalidValue})
