# jakarta validation standard messages, for the languages Hibernate Validator does not support
jakarta.validation.constraints.AssertFalse.message.base     = false હોવું જોઈએ
jakarta.validation.constraints.AssertTrue.message.base      = true હોવું જોઈએ
jakarta.validation.constraints.DecimalMax.message.base      = {value} કરતાં ઓછું ${inclusive == true ? 'અથવા સમાન ' : ''}હોવું જોઈએ
jakarta.validation.constraints.DecimalMin.message.base      = {value} કરતાં વધુ ${inclusive == true ? 'અથવા સમાન ' : ''}હોવું જોઈએ
jakarta.validation.constraints.Digits.message.base          = સંખ્યાત્મક મૂલ્ય મર્યાદાની બહાર છે (<{integer} અંકો>.<{fraction} અંકો> અપેક્ષિત)
jakarta.validation.constraints.Email.message.base           = માન્ય ઇમેઇલ સરનામું હોવું જોઈએ
jakarta.validation.constraints.Future.message.base          = ભવિષ્યની તારીખ હોવી જોઈએ
jakarta.validation.constraints.FutureOrPresent.message.base = વર્તમાન અથવા ભવિષ્યની તારીખ હોવી જોઈએ
jakarta.validation.constraints.Max.message.base             = {value} કરતાં ઓછું અથવા સમાન હોવું જોઈએ
jakarta.validation.constraints.Min.message.base             = {value} કરતાં વધુ અથવા સમાન હોવું જોઈએ
jakarta.validation.constraints.Negative.message.base        = 0 કરતાં ઓછું હોવું જોઈએ
jakarta.validation.constraints.NegativeOrZero.message.base  = 0 કરતાં ઓછું અથવા સમાન હોવું જોઈએ
jakarta.validation.constraints.NotBlank.message.base        = ખાલી અથવા ફક્ત ખાલી જગ્યાઓવાળું ન હોવું જોઈએ
jakarta.validation.constraints.NotEmpty.message.base        = ખાલી ન હોવું જોઈએ
jakarta.validation.constraints.NotNull.message.base         = null ન હોવું જોઈએ
jakarta.validation.constraints.Null.message.base            = null હોવું જોઈએ
jakarta.validation.constraints.Past.message.base            = ભૂતકાળની તારીખ હોવી જોઈએ
jakarta.validation.constraints.PastOrPresent.message.base   = ભૂતકાળની અથવા વર્તમાન તારીખ હોવી જોઈએ
jakarta.validation.constraints.Pattern.message.base         = "{regexp}" સાથે મેળ ખાવું જોઈએ
jakarta.validation.constraints.Positive.message.base        = 0 કરતાં વધુ હોવું જોઈએ
jakarta.validation.constraints.PositiveOrZero.message.base  = 0 કરતાં વધુ અથવા સમાન હોવું જોઈએ
jakarta.validation.constraints.Size.message.base            = કદ {min} અને {max} ની વચ્ચે હોવું જોઈએ
