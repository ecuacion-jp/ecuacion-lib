# jakarta validation standard messages, for the languages Hibernate Validator does not support
jakarta.validation.constraints.AssertFalse.message.base     = ต้องเป็น false
jakarta.validation.constraints.AssertTrue.message.base      = ต้องเป็น true
jakarta.validation.constraints.DecimalMax.message.base      = ต้องน้อยกว่า${inclusive == true ? 'หรือเท่ากับ' : ''} {value}
jakarta.validation.constraints.DecimalMin.message.base      = ต้องมากกว่า${inclusive == true ? 'หรือเท่ากับ' : ''} {value}
jakarta.validation.constraints.Digits.message.base          = ค่าตัวเลขอยู่นอกขอบเขต (ต้องเป็น <{integer} หลัก>.<{fraction} หลัก>)
jakarta.validation.constraints.Email.message.base           = ต้องเป็นที่อยู่อีเมลที่ถูกต้อง
jakarta.validation.constraints.Future.message.base          = ต้องเป็นวันที่ในอนาคต
jakarta.validation.constraints.FutureOrPresent.message.base = ต้องเป็นวันที่ในปัจจุบันหรืออนาคต
jakarta.validation.constraints.Max.message.base             = ต้องน้อยกว่าหรือเท่ากับ {value}
jakarta.validation.constraints.Min.message.base             = ต้องมากกว่าหรือเท่ากับ {value}
jakarta.validation.constraints.Negative.message.base        = ต้องน้อยกว่า 0
jakarta.validation.constraints.NegativeOrZero.message.base  = ต้องน้อยกว่าหรือเท่ากับ 0
jakarta.validation.constraints.NotBlank.message.base        = ต้องไม่ว่างหรือมีเพียงช่องว่าง
jakarta.validation.constraints.NotEmpty.message.base        = ต้องไม่ว่าง
jakarta.validation.constraints.NotNull.message.base         = ต้องไม่เป็น null
jakarta.validation.constraints.Null.message.base            = ต้องเป็น null
jakarta.validation.constraints.Past.message.base            = ต้องเป็นวันที่ในอดีต
jakarta.validation.constraints.PastOrPresent.message.base   = ต้องเป็นวันที่ในอดีตหรือปัจจุบัน
jakarta.validation.constraints.Pattern.message.base         = ต้องตรงกับ "{regexp}"
jakarta.validation.constraints.Positive.message.base        = ต้องมากกว่า 0
jakarta.validation.constraints.PositiveOrZero.message.base  = ต้องมากกว่าหรือเท่ากับ 0
jakarta.validation.constraints.Size.message.base            = ขนาดต้องอยู่ระหว่าง {min} ถึง {max}
