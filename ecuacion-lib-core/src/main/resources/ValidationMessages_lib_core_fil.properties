# jakarta validation standard messages, for the languages Hibernate Validator does not support
jakarta.validation.constraints.AssertFalse.message.base     = dapat false
jakarta.validation.constraints.AssertTrue.message.base      = dapat true
jakarta.validation.constraints.DecimalMax.message.base      = dapat mas mababa ${inclusive == true ? 'o katumbas ng' : 'sa'} {value}
jakarta.validation.constraints.DecimalMin.message.base      = dapat mas mataas ${inclusive == true ? 'o katumbas ng' : 'sa'} {value}
jakarta.validation.constraints.Digits.message.base          = lampas sa hangganan ang numerong halaga (inaasahang <{integer} digit>.<{fraction} digit>)
jakarta.validation.constraints.Email.message.base           = dapat isang wastong email address
jakarta.validation.constraints.Future.message.base          = dapat petsa sa hinaharap
jakarta.validation.constraints.FutureOrPresent.message.base = dapat petsa sa kasalukuyan o hinaharap
jakarta.validation.constraints.Max.message.base             = dapat mas mababa o katumbas ng {value}
jakarta.validation.constraints.Min.message.base             = dapat mas mataas o katumbas ng {value}
jakarta.validation.constraints.Negative.message.base        = dapat mas mababa sa 0
jakarta.validation.constraints.NegativeOrZero.message.base  = dapat mas mababa o katumbas ng 0
jakarta.validation.constraints.NotBlank.message.base        = hindi dapat walang laman o puro espasyo
jakarta.validation.constraints.NotEmpty.message.base        = hindi dapat walang laman
jakarta.validation.constraints.NotNull.message.base         = hindi dapat null
jakarta.validation.constraints.Null.message.base            = dapat null
jakarta.validation.constraints.Past.message.base            = dapat petsa sa nakaraan
jakarta.validation.constraints.PastOrPresent.message.base   = dapat petsa sa nakaraan o kasalukuyan
jakarta.validation.constraints.Pattern.message.base         = dapat tumugma sa "{regexp}"
jakarta.validation.constraints.Positive.message.base        = dapat mas mataas sa 0
jakarta.validation.constraints.PositiveOrZero.message.base  = dapat mas mataas o katumbas ng 0
jakarta.validation.constraints.Size.message.base            = dapat nasa pagitan ng {min} at {max} ang laki
