# jakarta validation standard messages with item names
jakarta.validation.constraints.AssertFalse.message.base     = {0} false ആയിരിക്കണം. (നൽകിയ മൂല്യം: {invalidValue})
jakarta.validation.constraints.AssertTrue.message.base      = {0} true ആയിരിക്കണം. (നൽകിയ മൂല്യം: {invalidValue})
jakarta.validation.constraints.DecimalMax.message.base      = {0} {value} നേക്കാൾ ${inclusive == true ? 'കുറവോ തുല്യമോ' : 'കുറവ്'} ആയിരിക്കണം. (നൽകിയ മൂല്യം: {invalidValue})
jakarta.validation.constraints.DecimalMin.message.base      = {0} {value} നേക്കാൾ ${inclusive == true ? 'കൂടുതലോ തുല്യമോ' : 'കൂടുതൽ'} ആയിരിക്കണം. (നൽകിയ മൂല്യം: {invalidValue})
jakarta.validation.constraints.Digits.message.base          = {0} ന്റെ സംഖ്യാ മൂല്യം പരിധിക്ക് പുറത്താണ് (<{integer} അക്കങ്ങൾ>.<{fraction} അക്കങ്ങൾ> പ്രതീക്ഷിക്കുന്നു). (നൽകിയ മൂല്യം: {invalidValue})
jakarta.validation.constraints.Email.message.base           = {0} സാധുവായ ഇമെയിൽ വിലാസം ആയിരിക്കണം. (നൽകിയ മൂല്യം: {invalidValue})
jakarta.validation.constraints.Future.message.base          = {0} ഭാവിയിലെ തീയതി ആയിരിക്കണം. (നൽകിയ മൂല്യം: {invalidValue})
jakarta.validation.constraints.FutureOrPresent.message.base = {0} നിലവിലെ അല്ലെങ്കിൽ ഭാവിയിലെ തീയതി ആയിരിക്കണം. (നൽകിയ മൂല്യം: {invalidValue})
jakarta.validation.constraints.Max.message.base             = {0} {value} നേക്കാൾ കുറവോ തുല്യമോ ആയിരിക്കണം. (നൽകിയ മൂല്യം: {invalidValue})
jakarta.validation.constraints.Min.message.base             = {0} {value} നേക്കാൾ കൂടുതലോ തുല്യമോ ആയിരിക്കണം. (നൽകിയ മൂല്യം: {invalidValue})
jakarta.validation.constraints.Negative.message.base        = {0} 0 നേക്കാൾ കുറവ് ആയിരിക്കണം. (നൽകിയ മൂല്യം: {invalidValue})
jakarta.validation.constraints.NegativeOrZero.message.base  = {0} 0 നേക്കാൾ കുറവോ തുല്യമോ ആയിരിക്കണം. (നൽകിയ മൂല്യം: {invalidValue})
jakarta.validation.constraints.NotBlank.message.base        = {0} ശൂന്യമോ സ്പേസുകൾ മാത്രമോ ആയിരിക്കരുത്.
jakarta.validation.constraints.NotEmpty.message.base        = {0} ശൂന്യമായിരിക്കരുത്.
jakarta.validation.constraints.NotNull.message.base         = {0} null ആയിരിക്കരുത്.
jakarta.validation.constraints.Null.message.base            = {0} null ആയിരിക്കണം. (നൽകിയ മൂല്യം: {invalidValue})
jakarta.validation.constraints.Past.message.base            = {0} മുൻകാല തീയതി ആയിരിക്കണം. (നൽകിയ മൂല്യം: {invalidValue})
jakarta.validation.constraints.PastOrPresent.message.base   = {0} മുൻകാല അല്ലെങ്കിൽ നിലവിലെ തീയതി ആയിരിക്കണം. (നൽകിയ മൂല്യം: {invalidValue})
jakarta.validation.constraints.Pattern.message.base         = {0} "{regexp}" മായി പൊരുത്തപ്പെടണം. (നൽകിയ മൂല്യം: {invalidValue})
jakarta.validation.constraints.Positive.message.base        = {0} 0 നേക്കാൾ കൂടുതൽ ആയിരിക്കണം. (നൽകിയ മൂല്യം: {invalidValue})
jakarta.validation.constraints.PositiveOrZero.message.base  = {0} 0 നേക്കാൾ കൂടുതലോ തുല്യമോ ആയിരിക്കണം. (നൽകിയ മൂല്യം: {invalidValue})
jakarta.validation.constraints.Size.message.base            = {0} ന്റെ വലുപ്പം {min} നും {max} നും ഇടയിൽ ആയിരിക്കണം. (നൽകിയ മൂല്യം: {invalidValue})
