# jakarta validation standard messages with item names
jakarta.validation.constraints.AssertFalse.message.base     = {0} باید false باشد. (مقدار ورودی: \u2068{invalidValue}\u2069)
jakarta.validation.constraints.AssertTrue.message.base      = {0} باید true باشد. (مقدار ورودی: \u2068{invalidValue}\u2069)
jakarta.validation.constraints.DecimalMax.message.base      = {0} باید ${inclusive == true ? 'کوچک\u200Cتر یا مساوی' : 'کوچک\u200Cتر از'} {value} باشد. (مقدار ورودی: \u2068{invalidValue}\u2069)
jakarta.validation.constraints.DecimalMin.message.base      = {0} باید ${inclusive == true ? 'بزرگ\u200Cتر یا مساوی' : 'بزرگ\u200Cتر از'} {value} باشد. (مقدار ورودی: \u2068{invalidValue}\u2069)
jakarta.validation.constraints.Digits.message.base          = مقدار عددی {0} خارج از محدوده است (<{integer} رقم>.<{fraction} رقم> مورد انتظار است). (مقدار ورودی: \u2068{invalidValue}\u2069)
jakarta.validation.constraints.Email.message.base           = {0} باید یک نشانی ایمیل با قالب درست باشد. (مقدار ورودی: \u2068{invalidValue}\u2069)
jakarta.validation.constraints.Future.message.base          = {0} باید تاریخی در آینده باشد. (مقدار ورودی: \u2068{invalidValue}\u2069)
jakarta.validation.constraints.FutureOrPresent.message.base = {0} باید تاریخی در حال یا آینده باشد. (مقدار ورودی: \u2068{invalidValue}\u2069)
jakarta.validation.constraints.Max.message.base             = {0} باید کوچک\u200Cتر یا مساوی {value} باشد. (مقدار ورودی: \u2068{invalidValue}\u2069)
jakarta.validation.constraints.Min.message.base             = {0} باید بزرگ\u200Cتر یا مساوی {value} باشد. (مقدار ورودی: \u2068{invalidValue}\u2069)
jakarta.validation.constraints.Negative.message.base        = {0} باید کوچک\u200Cتر از 0 باشد. (مقدار ورودی: \u2068{invalidValue}\u2069)
jakarta.validation.constraints.NegativeOrZero.message.base  = {0} باید کوچک\u200Cتر یا مساوی 0 باشد. (مقدار ورودی: \u2068{invalidValue}\u2069)
jakarta.validation.constraints.NotBlank.message.base        = {0} نباید خالی یا فقط شامل فاصله باشد.
jakarta.validation.constraints.NotEmpty.message.base        = {0} نباید خالی باشد.
jakarta.validation.constraints.NotNull.message.base         = {0} نباید null باشد.
jakarta.validation.constraints.Null.message.base            = {0} باید null باشد. (مقدار ورودی: \u2068{invalidValue}\u2069)
jakarta.validation.constraints.Past.message.base            = {0} باید تاریخی در گذشته باشد. (مقدار ورودی: \u2068{invalidValue}\u2069)
jakarta.validation.constraints.PastOrPresent.message.base   = {0} باید تاریخی در گذشته یا حال باشد. (مقدار ورودی: \u2068{invalidValue}\u2069)
jakarta.validation.constraints.Pattern.message.base         = {0} باید با \u2066"{regexp}"\u2069 مطابقت داشته باشد. (مقدار ورودی: \u2068{invalidValue}\u2069)
jakarta.validation.constraints.Positive.message.base        = {0} باید بزرگ\u200Cتر از 0 باشد. (مقدار ورودی: \u2068{invalidValue}\u2069)
jakarta.validation.constraints.PositiveOrZero.message.base  = {0} باید بزرگ\u200Cتر یا مساوی 0 باشد. (مقدار ورودی: \u2068{invalidValue}\u2069)
jakarta.validation.constraints.Size.message.base            = اندازه {0} باید بین {min} و {max} باشد. (مقدار ورودی: \u2068{invalidValue}\u2069)
