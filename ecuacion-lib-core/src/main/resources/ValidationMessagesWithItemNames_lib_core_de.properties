# jakarta validation standard messages with item names
jakarta.validation.constraints.AssertFalse.message.base     = {0} muss false sein. (Eingabe: {invalidValue})
jakarta.validation.constraints.AssertTrue.message.base      = {0} muss true sein. (Eingabe: {invalidValue})
jakarta.validation.constraints.DecimalMax.message.base      = {0} muss kleiner ${inclusive == true ? 'oder gleich' : 'als'} {value} sein. (Eingabe: {invalidValue})
jakarta.validation.constraints.DecimalMin.message.base      = {0} muss größer ${inclusive == true ? 'oder gleich' : 'als'} {value} sein. (Eingabe: {invalidValue})
jakarta.validation.constraints.Digits.message.base          = Der numerische Wert von {0} liegt außerhalb des gültigen Bereichs (<{integer} Ziffern>.<{fraction} Ziffern> erwartet). (Eingabe: {invalidValue})
jakarta.validation.constraints.Email.message.base           = {0} muss eine gültige E-Mail-Adresse sein. (Eingabe: {invalidValue})
jakarta.validation.constraints.Future.message.base          = {0} muss ein Datum in der Zukunft sein. (Eingabe: {invalidValue})
jakarta.validation.constraints.FutureOrPresent.message.base = {0} muss ein Datum in der Gegenwart oder in der Zukunft sein. (Eingabe: {invalidValue})
jakarta.validation.constraints.Max.message.base             = {0} muss kleiner oder gleich {value} sein. (Eingabe: {invalidValue})
jakarta.validation.constraints.Min.message.base             = {0} muss größer oder gleich {value} sein. (Eingabe: {invalidValue})
jakarta.validation.constraints.Negative.message.base        = {0} muss kleiner als 0 sein. (Eingabe: {invalidValue})
jakarta.validation.constraints.NegativeOrZero.message.base  = {0} muss kleiner oder gleich 0 sein. (Eingabe: {invalidValue})
jakarta.validation.constraints.NotBlank.message.base        = {0} darf nicht leer sein und nicht nur aus Leerzeichen bestehen.
jakarta.validation.constraints.NotEmpty.message.base        = {0} darf nicht leer sein.
jakarta.validation.constraints.NotNull.message.base         = {0} darf nicht null sein.
jakarta.validation.constraints.Null.message.base            = {0} muss null sein. (Eingabe: {invalidValue})
jakarta.validation.constraints.Past.message.base            = {0} muss ein Datum in der Vergangenheit sein. (Eingabe: {invalidValue})
jakarta.validation.constraints.PastOrPresent.message.base   = {0} muss ein Datum in der Vergangenheit oder in der Gegenwart sein. (Eingabe: {invalidValue})
jakarta.validation.constraints.Pattern.message.base         = {0} muss "{regexp}" entsprechen. (Eingabe: {invalidValue})
jakarta.validation.constraints.Positive.message.base        = {0} muss größer als 0 sein. (Eingabe: {invalidValue})
jakarta.validation.constraints.PositiveOrZero.message.base  = {0} muss größer oder gleich 0 sein. (Eingabe: {invalidValue})
jakarta.validation.constraints.Size.message.base            = Die Größe von {0} muss zwischen {min} und {max} liegen. (Eingabe: {invalidValue})
