jp.ecuacion.lib.validation.constraints.AnyEmpty.message.base                   = {0} પૈકી કોઈ એક ખાલી હોવું જોઈએ
jp.ecuacion.lib.validation.constraints.AnyNotEmpty.message.base                = {0} પૈકી કોઈ એક ખાલી ન હોવું જોઈએ
jp.ecuacion.lib.validation.constraints.AllEmptyOrAllNotEmpty.message.base      = {0} બધા ખાલી હોવા જોઈએ અથવા એક પણ ખાલી ન હોવું જોઈએ
