# field validators
jp.ecuacion.lib.validation.constraints.SizeString.message.base             = કદ {min} અને {max} ની વચ્ચે હોવું જોઈએ
jp.ecuacion.lib.validation.constraints.BooleanString.message.base          = બુલિયન મૂલ્ય દર્શાવતી સ્ટ્રિંગ હોવી જોઈએ ("true", "false", "on", "off", "yes", "no", "t", "f", "y", "n", "○", "×")
jp.ecuacion.lib.validation.constraints.IntegerString.message.base          = વાજબી મર્યાદામાં પૂર્ણાંક હોવો જોઈએ
jp.ecuacion.lib.validation.constraints.LongString.message.base             = વાજબી મર્યાદામાં પૂર્ણાંક હોવો જોઈએ
jp.ecuacion.lib.validation.constraints.EnumElement.message.base            = enum {enumClass} નું તત્વ હોવું જોઈએ
jp.ecuacion.lib.validation.constraints.PatternWithDescription.message.base = "{description}" સાથે મેળ ખાવું જોઈએ
jp.ecuacion.lib.validation.constraints.ElementsNotEmpty.message.base       = ખાલી ન હોવું જોઈએ
jp.ecuacion.lib.validation.constraints.FileExists.message.base             = અસ્તિત્વમાં રહેલી સામાન્ય ફાઇલનો પાથ હોવો જોઈએ
jp.ecuacion.lib.validation.constraints.DirExists.message.base              = અસ્તિત્વમાં રહેલી ડિરેક્ટરીનો પાથ હોવો જોઈએ
jp.ecuacion.lib.validation.constraints.PathExists.message.base             = અસ્તિત્વમાં રહેલી ફાઇલ અથવા ડિરેક્ટરીનો પાથ હોવો જોઈએ
jp.ecuacion.lib.validation.constraints.FileExtension.message.base          = ફાઇલ એક્સટેન્શન "{extension}" હોવું જોઈએ

