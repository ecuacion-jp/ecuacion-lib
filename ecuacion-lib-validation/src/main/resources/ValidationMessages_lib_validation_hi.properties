# field validators
jp.ecuacion.lib.validation.constraints.SizeString.message.base             = आकार {min} और {max} के बीच होना चाहिए
jp.ecuacion.lib.validation.constraints.BooleanString.message.base          = बूलियन मान व्यक्त करने वाली स्ट्रिंग होनी चाहिए ("true", "false", "on", "off", "yes", "no", "t", "f", "y", "n", "○", "×")
jp.ecuacion.lib.validation.constraints.IntegerString.message.base          = उचित सीमा में पूर्णांक होना चाहिए
jp.ecuacion.lib.validation.constraints.LongString.message.base             = उचित सीमा में पूर्णांक होना चाहिए
jp.ecuacion.lib.validation.constraints.EnumElement.message.base            = enum {enumClass} का एक तत्व होना चाहिए
jp.ecuacion.lib.validation.constraints.PatternWithDescription.message.base = "{description}" से मेल खाना चाहिए
jp.ecuacion.lib.validation.constraints.ElementsNotEmpty.message.base       = खाली नहीं होना चाहिए
jp.ecuacion.lib.validation.constraints.FileExists.message.base             = किसी मौजूदा सामान्य फ़ाइल का पथ होना चाहिए
jp.ecuacion.lib.validation.constraints.DirExists.message.base              = किसी मौजूदा निर्देशिका का पथ होना चाहिए
jp.ecuacion.lib.validation.constraints.PathExists.message.base             = किसी मौजूदा फ़ाइल या निर्देशिका का पथ होना चाहिए
jp.ecuacion.lib.validation.constraints.FileExtension.message.base          = फ़ाइल एक्सटेंशन "{extension}" होना चाहिए

