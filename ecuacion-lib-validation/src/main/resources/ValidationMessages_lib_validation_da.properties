# field validators
jp.ecuacion.lib.validation.constraints.SizeString.message.base             = størrelsen skal være mellem {min} og {max}
jp.ecuacion.lib.validation.constraints.BooleanString.message.base          = skal være en streng, der udtrykker en boolesk værdi ("true", "false", "on", "off", "yes", "no", "t", "f", "y", "n", "○", "×")
jp.ecuacion.lib.validation.constraints.IntegerString.message.base          = skal være et heltal inden for et rimeligt interval
jp.ecuacion.lib.validation.constraints.LongString.message.base             = skal være et heltal inden for et rimeligt interval
jp.ecuacion.lib.validation.constraints.EnumElement.message.base            = skal være et element i enummet {enumClass}
jp.ecuacion.lib.validation.constraints.PatternWithDescription.message.base = skal matche "{description}"
jp.ecuacion.lib.validation.constraints.ElementsNotEmpty.message.base       = må ikke være tom
jp.ecuacion.lib.validation.constraints.FileExists.message.base             = skal være stien til en eksisterende almindelig fil
jp.ecuacion.lib.validation.constraints.DirExists.message.base              = skal være stien til en eksisterende mappe
jp.ecuacion.lib.validation.constraints.PathExists.message.base             = skal være stien til en eksisterende fil eller mappe
jp.ecuacion.lib.validation.constraints.FileExtension.message.base          = skal have filtypenavnet "{extension}"

# class validators
jp.ecuacion.lib.validation.constraints.AnyNull.message.base                    = et af felterne {0} skal være null
jp.ecuacion.lib.validation.constraints.AnyNotNull.message.base                 = et af felterne {0} må ikke være null
jp.ecuacion.lib.validation.constraints.AllNullOrAllNotNull.message.base        = alle felterne {0} skal være null eller ikke null
jp.ecuacion.lib.validation.constraints.AllOrNoneNull.message.base              = alle felterne {0} skal være null eller ikke null
jp.ecuacion.lib.validation.constraints.AnyEmpty.message.base                   = et af felterne {0} skal være tomt
jp.ecuacion.lib.validation.constraints.AnyNotEmpty.message.base                = et af felterne {0} må ikke være tomt
jp.ecuacion.lib.validation.constraints.AllEmptyOrAllNotEmpty.message.base      = alle felterne {0} skal være tomme eller ikke tomme
jp.ecuacion.lib.validation.constraints.AllOrNoneEmpty.message.base             = alle felterne {0} skal være tomme eller ikke tomme
jp.ecuacion.lib.validation.constraints.GreaterThan.message.base                = skal være større end værdien af {baselinePropertyPathItemName}
jp.ecuacion.lib.validation.constraints.GreaterThanOrEqualTo.message.base       = skal være større end eller lig med værdien af {baselinePropertyPathItemName}
jp.ecuacion.lib.validation.constraints.LessThan.message.base                   = skal være mindre end værdien af {baselinePropertyPathItemName}
jp.ecuacion.lib.validation.constraints.LessThanOrEqualTo.message.base          = skal være mindre end eller lig med værdien af {baselinePropertyPathItemName}
jp.ecuacion.lib.validation.constraints.NullWhen.message.base                   = skal være null, når {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotNullWhen.message.base                = må ikke være null, når {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.EmptyWhen.message.base                  = skal være tom, når {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotEmptyWhen.message.base               = må ikke være tom, når {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.TrueWhen.message.base                   = skal være true, når {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.FalseWhen.message.base                  = skal være false, når {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.StringWhen.message.base                 = skal være en bestemt værdi, når {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotStringWhen.message.base              = må ikke være en bestemt værdi, når {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.PatternWhen.message.base                = skal matche mønsteret, når {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotPatternWhen.message.base             = må ikke matche mønsteret, når {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.ValueOfPropertyPathWhen.message.base    = skal være værdien af et bestemt felt, når {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotValueOfPropertyPathWhen.message.base = må ikke være værdien af et bestemt felt, når {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
