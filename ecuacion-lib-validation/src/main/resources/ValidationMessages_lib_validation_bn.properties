# field validators
jp.ecuacion.lib.validation.constraints.SizeString.message.base             = আকার অবশ্যই {min} থেকে {max} এর মধ্যে হবে
jp.ecuacion.lib.validation.constraints.BooleanString.message.base          = অবশ্যই বুলিয়ান মান প্রকাশকারী স্ট্রিং হবে ("true", "false", "on", "off", "yes", "no", "t", "f", "y", "n", "○", "×")
jp.ecuacion.lib.validation.constraints.IntegerString.message.base          = অবশ্যই যুক্তিসঙ্গত সীমার মধ্যে পূর্ণসংখ্যা হবে
jp.ecuacion.lib.validation.constraints.LongString.message.base             = অবশ্যই যুক্তিসঙ্গত সীমার মধ্যে পূর্ণসংখ্যা হবে
jp.ecuacion.lib.validation.constraints.EnumElement.message.base            = অবশ্যই enum {enumClass} এর একটি উপাদান হবে
jp.ecuacion.lib.validation.constraints.PatternWithDescription.message.base = অবশ্যই "{description}" এর সাথে মিলবে
jp.ecuacion.lib.validation.constraints.ElementsNotEmpty.message.base       = খালি হতে পারবে না
jp.ecuacion.lib.validation.constraints.FileExists.message.base             = অবশ্যই একটি বিদ্যমান সাধারণ ফাইলের পাথ হবে
jp.ecuacion.lib.validation.constraints.DirExists.message.base              = অবশ্যই একটি বিদ্যমান ডিরেক্টরির পাথ হবে
jp.ecuacion.lib.validation.constraints.PathExists.message.base             = অবশ্যই একটি বিদ্যমান ফাইল বা ডিরেক্টরির পাথ হবে
jp.ecuacion.lib.validation.constraints.FileExtension.message.base          = ফাইল এক্সটেনশন অবশ্যই "{extension}" হবে

# class validators
jp.ecuacion.lib.validation.constraints.AnyNull.message.base                    = {0} এর মধ্যে যেকোনো একটি অবশ্যই null হবে
jp.ecuacion.lib.validation.constraints.AnyNotNull.message.base                 = {0} এর মধ্যে যেকোনো একটি null হতে পারবে না
jp.ecuacion.lib.validation.constraints.AllNullOrAllNotNull.message.base        = {0} এর সবগুলো অবশ্যই null হবে অথবা কোনোটিই null হবে না
jp.ecuacion.lib.validation.constraints.AllOrNoneNull.message.base              = {0} এর সবগুলো অবশ্যই null হবে অথবা কোনোটিই null হবে না
jp.ecuacion.lib.validation.constraints.AnyEmpty.message.base                   = {0} এর মধ্যে যেকোনো একটি অবশ্যই খালি হবে
jp.ecuacion.lib.validation.constraints.AnyNotEmpty.message.base                = {0} এর মধ্যে যেকোনো একটি খালি হতে পারবে না
jp.ecuacion.lib.validation.constraints.AllEmptyOrAllNotEmpty.message.base      = {0} এর সবগুলো অবশ্যই খালি হবে অথবা কোনোটিই খালি হবে না
jp.ecuacion.lib.validation.constraints.AllOrNoneEmpty.message.base             = {0} এর সবগুলো অবশ্যই খালি হবে অথবা কোনোটিই খালি হবে না
jp.ecuacion.lib.validation.constraints.GreaterThan.message.base                = অবশ্যই {baselinePropertyPathItemName} এর মানের চেয়ে বেশি হবে
jp.ecuacion.lib.validation.constraints.GreaterThanOrEqualTo.message.base       = অবশ্যই {baselinePropertyPathItemName} এর মানের চেয়ে বেশি বা সমান হবে
jp.ecuacion.lib.validation.constraints.LessThan.message.base                   = অবশ্যই {baselinePropertyPathItemName} এর মানের চেয়ে কম হবে
jp.ecuacion.lib.validation.constraints.LessThanOrEqualTo.message.base          = অবশ্যই {baselinePropertyPathItemName} এর মানের চেয়ে কম বা সমান হবে
jp.ecuacion.lib.validation.constraints.NullWhen.message.base                   = যদি {conditionDescription}, তবে অবশ্যই null হবে{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotNullWhen.message.base                = যদি {conditionDescription}, তবে null হতে পারবে না{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.EmptyWhen.message.base                  = যদি {conditionDescription}, তবে অবশ্যই খালি হবে{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotEmptyWhen.message.base               = যদি {conditionDescription}, তবে খালি হতে পারবে না{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.TrueWhen.message.base                   = যদি {conditionDescription}, তবে অবশ্যই true হবে{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.FalseWhen.message.base                  = যদি {conditionDescription}, তবে অবশ্যই false হবে{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.StringWhen.message.base                 = যদি {conditionDescription}, তবে অবশ্যই একটি নির্দিষ্ট মান হবে{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotStringWhen.message.base              = যদি {conditionDescription}, তবে একটি নির্দিষ্ট মান হতে পারবে না{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.PatternWhen.message.base                = যদি {conditionDescription}, তবে অবশ্যই প্যাটার্নের সাথে মিলবে{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotPatternWhen.message.base             = যদি {conditionDescription}, তবে প্যাটার্নের সাথে মিলতে পারবে না{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.ValueOfPropertyPathWhen.message.base    = যদি {conditionDescription}, তবে অবশ্যই একটি নির্দিষ্ট ফিল্ডের মান হবে{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotValueOfPropertyPathWhen.message.base = যদি {conditionDescription}, তবে একটি নির্দিষ্ট ফিল্ডের মান হতে পারবে না{validatesWhenConditionNotSatisfiedDescription}
