# field validators
jp.ecuacion.lib.validation.constraints.SizeString.message.base             = veľkosť musí byť medzi {min} a {max}
jp.ecuacion.lib.validation.constraints.BooleanString.message.base          = musí byť reťazec vyjadrujúci logickú hodnotu ("true", "false", "on", "off", "yes", "no", "t", "f", "y", "n", "○", "×")
jp.ecuacion.lib.validation.constraints.IntegerString.message.base          = musí byť celé číslo v rozumnom rozsahu
jp.ecuacion.lib.validation.constraints.LongString.message.base             = musí byť celé číslo v rozumnom rozsahu
jp.ecuacion.lib.validation.constraints.EnumElement.message.base            = musí byť prvkom vymenovania {enumClass}
jp.ecuacion.lib.validation.constraints.PatternWithDescription.message.base = musí zodpovedať "{description}"
jp.ecuacion.lib.validation.constraints.ElementsNotEmpty.message.base       = nesmie byť prázdne
jp.ecuacion.lib.validation.constraints.FileExists.message.base             = musí byť cesta k existujúcemu bežnému súboru
jp.ecuacion.lib.validation.constraints.DirExists.message.base              = musí byť cesta k existujúcemu adresáru
jp.ecuacion.lib.validation.constraints.PathExists.message.base             = musí byť cesta k existujúcemu súboru alebo adresáru
jp.ecuacion.lib.validation.constraints.FileExtension.message.base          = musí mať príponu súboru "{extension}"

