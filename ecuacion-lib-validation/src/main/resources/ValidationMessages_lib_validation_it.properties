# field validators
jp.ecuacion.lib.validation.constraints.SizeString.message.base             = la dimensione deve essere compresa tra {min} e {max}
jp.ecuacion.lib.validation.constraints.BooleanString.message.base          = deve essere una stringa che esprime un valore booleano ("true", "false", "on", "off", "yes", "no", "t", "f", "y", "n", "○", "×")
jp.ecuacion.lib.validation.constraints.IntegerString.message.base          = deve essere un numero intero in un intervallo ragionevole
jp.ecuacion.lib.validation.constraints.LongString.message.base             = deve essere un numero intero in un intervallo ragionevole
jp.ecuacion.lib.validation.constraints.EnumElement.message.base            = deve essere un elemento dell’enum {enumClass}
jp.ecuacion.lib.validation.constraints.PatternWithDescription.message.base = deve corrispondere a "{description}"
jp.ecuacion.lib.validation.constraints.ElementsNotEmpty.message.base       = non deve essere vuoto
jp.ecuacion.lib.validation.constraints.FileExists.message.base             = deve essere il percorso di un file regolare esistente
jp.ecuacion.lib.validation.constraints.DirExists.message.base              = deve essere il percorso di una directory esistente
jp.ecuacion.lib.validation.constraints.PathExists.message.base             = deve essere il percorso di un file o di una directory esistente
jp.ecuacion.lib.validation.constraints.FileExtension.message.base          = deve avere l’estensione di file "{extension}"

