# field validators
jp.ecuacion.lib.validation.constraints.SizeString.message.base             = dimensiunea trebuie să fie între {min} și {max}
jp.ecuacion.lib.validation.constraints.BooleanString.message.base          = trebuie să fie un șir care exprimă o valoare booleană ("true", "false", "on", "off", "yes", "no", "t", "f", "y", "n", "○", "×")
jp.ecuacion.lib.validation.constraints.IntegerString.message.base          = trebuie să fie un număr întreg într-un interval rezonabil
jp.ecuacion.lib.validation.constraints.LongString.message.base             = trebuie să fie un număr întreg într-un interval rezonabil
jp.ecuacion.lib.validation.constraints.EnumElement.message.base            = trebuie să fie un element al enum-ului {enumClass}
jp.ecuacion.lib.validation.constraints.PatternWithDescription.message.base = trebuie să corespundă cu "{description}"
jp.ecuacion.lib.validation.constraints.ElementsNotEmpty.message.base       = nu trebuie să fie gol
jp.ecuacion.lib.validation.constraints.FileExists.message.base             = trebuie să fie calea unui fișier obișnuit existent
jp.ecuacion.lib.validation.constraints.DirExists.message.base              = trebuie să fie calea unui director existent
jp.ecuacion.lib.validation.constraints.PathExists.message.base             = trebuie să fie calea unui fișier sau director existent
jp.ecuacion.lib.validation.constraints.FileExtension.message.base          = trebuie să aibă extensia de fișier "{extension}"

