# field validators
jp.ecuacion.lib.validation.constraints.SizeString.message.base             = يجب أن يكون حجم {0} بين {min} و{max}. (القيمة المدخلة: \u2068{invalidValue}\u2069)
jp.ecuacion.lib.validation.constraints.BooleanString.message.base          = يجب أن يكون {0} سلسلة نصية تعبّر عن قيمة منطقية (\u2066"true", "false", "on", "off", "yes", "no", "t", "f", "y", "n", "○", "×"\u2069). (القيمة المدخلة: \u2068{invalidValue}\u2069)
jp.ecuacion.lib.validation.constraints.IntegerString.message.base          = يجب أن يكون {0} عددًا صحيحًا ضمن نطاق معقول. (القيمة المدخلة: \u2068{invalidValue}\u2069)
jp.ecuacion.lib.validation.constraints.LongString.message.base             = يجب أن يكون {0} عددًا صحيحًا ضمن نطاق معقول. (القيمة المدخلة: \u2068{invalidValue}\u2069)
jp.ecuacion.lib.validation.constraints.EnumElement.message.base            = يجب أن يكون {0} عنصرًا من التعداد \u2066{enumClass}\u2069. (القيمة المدخلة: \u2068{invalidValue}\u2069)
jp.ecuacion.lib.validation.constraints.PatternWithDescription.message.base = يجب أن يطابق {0} \u2068"{description}"\u2069. (القيمة المدخلة: \u2068{invalidValue}\u2069)
jp.ecuacion.lib.validation.constraints.ElementsNotEmpty.message.base       = يجب ألا يكون {0} فارغًا.
jp.ecuacion.lib.validation.constraints.FileExists.message.base             = يجب أن يكون {0} مسار ملف عادي موجود. (القيمة المدخلة: \u2068{invalidValue}\u2069)
jp.ecuacion.lib.validation.constraints.DirExists.message.base              = يجب أن يكون {0} مسار مجلد موجود. (القيمة المدخلة: \u2068{invalidValue}\u2069)
jp.ecuacion.lib.validation.constraints.PathExists.message.base             = يجب أن يكون {0} مسار ملف أو مجلد موجود. (القيمة المدخلة: \u2068{invalidValue}\u2069)
jp.ecuacion.lib.validation.constraints.FileExtension.message.base          = يجب أن يكون امتداد ملف {0} \u2066"{extension}"\u2069. (القيمة المدخلة: \u2068{invalidValue}\u2069)

