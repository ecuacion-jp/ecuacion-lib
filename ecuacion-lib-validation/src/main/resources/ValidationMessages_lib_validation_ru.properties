# field validators
jp.ecuacion.lib.validation.constraints.SizeString.message.base             = размер должен быть от {min} до {max}
jp.ecuacion.lib.validation.constraints.BooleanString.message.base          = должно быть строкой, выражающей логическое значение ("true", "false", "on", "off", "yes", "no", "t", "f", "y", "n", "○", "×")
jp.ecuacion.lib.validation.constraints.IntegerString.message.base          = должно быть целым числом в разумном диапазоне
jp.ecuacion.lib.validation.constraints.LongString.message.base             = должно быть целым числом в разумном диапазоне
jp.ecuacion.lib.validation.constraints.EnumElement.message.base            = должно быть элементом перечисления {enumClass}
jp.ecuacion.lib.validation.constraints.PatternWithDescription.message.base = должно соответствовать "{description}"
jp.ecuacion.lib.validation.constraints.ElementsNotEmpty.message.base       = не должно быть пустым
jp.ecuacion.lib.validation.constraints.FileExists.message.base             = должно быть путём к существующему обычному файлу
jp.ecuacion.lib.validation.constraints.DirExists.message.base              = должно быть путём к существующему каталогу
jp.ecuacion.lib.validation.constraints.PathExists.message.base             = должно быть путём к существующему файлу или каталогу
jp.ecuacion.lib.validation.constraints.FileExtension.message.base          = должно иметь расширение файла "{extension}"

# class validators
jp.ecuacion.lib.validation.constraints.AnyNull.message.base                    = одно из полей {0} должно быть null
jp.ecuacion.lib.validation.constraints.AnyNotNull.message.base                 = одно из полей {0} не должно быть null
jp.ecuacion.lib.validation.constraints.AllNullOrAllNotNull.message.base        = все поля {0} должны быть либо null, либо не null
jp.ecuacion.lib.validation.constraints.AllOrNoneNull.message.base              = все поля {0} должны быть либо null, либо не null
jp.ecuacion.lib.validation.constraints.AnyEmpty.message.base                   = одно из полей {0} должно быть пустым
jp.ecuacion.lib.validation.constraints.AnyNotEmpty.message.base                = одно из полей {0} не должно быть пустым
jp.ecuacion.lib.validation.constraints.AllEmptyOrAllNotEmpty.message.base      = все поля {0} должны быть либо пустыми, либо непустыми
jp.ecuacion.lib.validation.constraints.AllOrNoneEmpty.message.base             = все поля {0} должны быть либо пустыми, либо непустыми
jp.ecuacion.lib.validation.constraints.GreaterThan.message.base                = должно быть больше значения {baselinePropertyPathItemName}
jp.ecuacion.lib.validation.constraints.GreaterThanOrEqualTo.message.base       = должно быть больше или равно значению {baselinePropertyPathItemName}
jp.ecuacion.lib.validation.constraints.LessThan.message.base                   = должно быть меньше значения {baselinePropertyPathItemName}
jp.ecuacion.lib.validation.constraints.LessThanOrEqualTo.message.base          = должно быть меньше или равно значению {baselinePropertyPathItemName}
