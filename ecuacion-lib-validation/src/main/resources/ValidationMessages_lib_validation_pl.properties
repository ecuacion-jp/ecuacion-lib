# field validators
jp.ecuacion.lib.validation.constraints.SizeString.message.base             = rozmiar musi mieścić się w przedziale od {min} do {max}
jp.ecuacion.lib.validation.constraints.BooleanString.message.base          = musi być ciągiem wyrażającym wartość logiczną ("true", "false", "on", "off", "yes", "no", "t", "f", "y", "n", "○", "×")
jp.ecuacion.lib.validation.constraints.IntegerString.message.base          = musi być liczbą całkowitą z rozsądnego zakresu
jp.ecuacion.lib.validation.constraints.LongString.message.base             = musi być liczbą całkowitą z rozsądnego zakresu
jp.ecuacion.lib.validation.constraints.EnumElement.message.base            = musi być elementem typu wyliczeniowego {enumClass}
jp.ecuacion.lib.validation.constraints.PatternWithDescription.message.base = musi pasować do "{description}"
jp.ecuacion.lib.validation.constraints.ElementsNotEmpty.message.base       = nie może być puste
jp.ecuacion.lib.validation.constraints.FileExists.message.base             = musi być ścieżką do istniejącego zwykłego pliku
jp.ecuacion.lib.validation.constraints.DirExists.message.base              = musi być ścieżką do istniejącego katalogu
jp.ecuacion.lib.validation.constraints.PathExists.message.base             = musi być ścieżką do istniejącego pliku lub katalogu
jp.ecuacion.lib.validation.constraints.FileExtension.message.base          = musi mieć rozszerzenie pliku "{extension}"

# class validators
jp.ecuacion.lib.validation.constraints.AnyNull.message.base                    = jedno z pól {0} musi być null
jp.ecuacion.lib.validation.constraints.AnyNotNull.message.base                 = jedno z pól {0} nie może być null
jp.ecuacion.lib.validation.constraints.AllNullOrAllNotNull.message.base        = wszystkie pola {0} muszą być null albo wszystkie różne od null
jp.ecuacion.lib.validation.constraints.AllOrNoneNull.message.base              = wszystkie pola {0} muszą być null albo wszystkie różne od null
jp.ecuacion.lib.validation.constraints.AnyEmpty.message.base                   = jedno z pól {0} musi być puste
jp.ecuacion.lib.validation.constraints.AnyNotEmpty.message.base                = jedno z pól {0} nie może być puste
jp.ecuacion.lib.validation.constraints.AllEmptyOrAllNotEmpty.message.base      = wszystkie pola {0} muszą być puste albo wszystkie niepuste
jp.ecuacion.lib.validation.constraints.AllOrNoneEmpty.message.base             = wszystkie pola {0} muszą być puste albo wszystkie niepuste
jp.ecuacion.lib.validation.constraints.GreaterThan.message.base                = musi być większe niż wartość {baselinePropertyPathItemName}
jp.ecuacion.lib.validation.constraints.GreaterThanOrEqualTo.message.base       = musi być większe lub równe wartości {baselinePropertyPathItemName}
jp.ecuacion.lib.validation.constraints.LessThan.message.base                   = musi być mniejsze niż wartość {baselinePropertyPathItemName}
jp.ecuacion.lib.validation.constraints.LessThanOrEqualTo.message.base          = musi być mniejsze lub równe wartości {baselinePropertyPathItemName}
jp.ecuacion.lib.validation.constraints.NullWhen.message.base                   = musi być null, gdy {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotNullWhen.message.base                = nie może być null, gdy {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.EmptyWhen.message.base                  = musi być puste, gdy {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotEmptyWhen.message.base               = nie może być puste, gdy {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.TrueWhen.message.base                   = musi mieć wartość true, gdy {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.FalseWhen.message.base                  = musi mieć wartość false, gdy {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.StringWhen.message.base                 = musi mieć określoną wartość, gdy {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotStringWhen.message.base              = nie może mieć określonej wartości, gdy {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.PatternWhen.message.base                = musi pasować do wzorca, gdy {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotPatternWhen.message.base             = nie może pasować do wzorca, gdy {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.ValueOfPropertyPathWhen.message.base    = musi mieć wartość określonego pola, gdy {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotValueOfPropertyPathWhen.message.base = nie może mieć wartości określonego pola, gdy {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
