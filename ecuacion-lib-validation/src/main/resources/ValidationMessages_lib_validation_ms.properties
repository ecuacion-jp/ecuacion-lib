# field validators
jp.ecuacion.lib.validation.constraints.SizeString.message.base             = saiz mesti antara {min} dan {max}
jp.ecuacion.lib.validation.constraints.BooleanString.message.base          = mesti rentetan yang menyatakan nilai boolean ("true", "false", "on", "off", "yes", "no", "t", "f", "y", "n", "○", "×")
jp.ecuacion.lib.validation.constraints.IntegerString.message.base          = mesti integer dalam julat yang munasabah
jp.ecuacion.lib.validation.constraints.LongString.message.base             = mesti integer dalam julat yang munasabah
jp.ecuacion.lib.validation.constraints.EnumElement.message.base            = mesti elemen enum {enumClass}
jp.ecuacion.lib.validation.constraints.PatternWithDescription.message.base = mesti sepadan dengan "{description}"
jp.ecuacion.lib.validation.constraints.ElementsNotEmpty.message.base       = tidak boleh kosong
jp.ecuacion.lib.validation.constraints.FileExists.message.base             = mesti laluan ke fail biasa yang wujud
jp.ecuacion.lib.validation.constraints.DirExists.message.base              = mesti laluan ke direktori yang wujud
jp.ecuacion.lib.validation.constraints.PathExists.message.base             = mesti laluan ke fail atau direktori yang wujud
jp.ecuacion.lib.validation.constraints.FileExtension.message.base          = mesti mempunyai sambungan fail "{extension}"

