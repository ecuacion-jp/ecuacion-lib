# field validators
jp.ecuacion.lib.validation.constraints.SizeString.message.base             = ಗಾತ್ರವು {min} ಮತ್ತು {max} ನಡುವೆ ಇರಬೇಕು
jp.ecuacion.lib.validation.constraints.BooleanString.message.base          = ಬೂಲಿಯನ್ ಮೌಲ್ಯವನ್ನು ಸೂಚಿಸುವ ಸ್ಟ್ರಿಂಗ್ ಆಗಿರಬೇಕು ("true", "false", "on", "off", "yes", "no", "t", "f", "y", "n", "○", "×")
jp.ecuacion.lib.validation.constraints.IntegerString.message.base          = ಸಮಂಜಸ ವ್ಯಾಪ್ತಿಯಲ್ಲಿರುವ ಪೂರ್ಣಾಂಕವಾಗಿರಬೇಕು
jp.ecuacion.lib.validation.constraints.LongString.message.base             = ಸಮಂಜಸ ವ್ಯಾಪ್ತಿಯಲ್ಲಿರುವ ಪೂರ್ಣಾಂಕವಾಗಿರಬೇಕು
jp.ecuacion.lib.validation.constraints.EnumElement.message.base            = enum {enumClass} ನ ಅಂಶವಾಗಿರಬೇಕು
jp.ecuacion.lib.validation.constraints.PatternWithDescription.message.base = "{description}" ಗೆ ಹೊಂದಿಕೆಯಾಗಬೇಕು
jp.ecuacion.lib.validation.constraints.ElementsNotEmpty.message.base       = ಖಾಲಿಯಾಗಿರಬಾರದು
jp.ecuacion.lib.validation.constraints.FileExists.message.base             = ಅಸ್ತಿತ್ವದಲ್ಲಿರುವ ಸಾಮಾನ್ಯ ಕಡತದ ಪಥವಾಗಿರಬೇಕು
jp.ecuacion.lib.validation.constraints.DirExists.message.base              = ಅಸ್ತಿತ್ವದಲ್ಲಿರುವ ಕೋಶದ ಪಥವಾಗಿರಬೇಕು
jp.ecuacion.lib.validation.constraints.PathExists.message.base             = ಅಸ್ತಿತ್ವದಲ್ಲಿರುವ ಕಡತ ಅಥವಾ ಕೋಶದ ಪಥವಾಗಿರಬೇಕು
jp.ecuacion.lib.validation.constraints.FileExtension.message.base          = ಕಡತದ ವಿಸ್ತರಣೆ "{extension}" ಆಗಿರಬೇಕು

