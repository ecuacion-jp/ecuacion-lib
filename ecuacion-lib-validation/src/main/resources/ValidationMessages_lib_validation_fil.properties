# field validators
jp.ecuacion.lib.validation.constraints.SizeString.message.base             = dapat nasa pagitan ng {min} at {max} ang laki
jp.ecuacion.lib.validation.constraints.BooleanString.message.base          = dapat string na nagsasaad ng boolean na halaga ("true", "false", "on", "off", "yes", "no", "t", "f", "y", "n", "○", "×")
jp.ecuacion.lib.validation.constraints.IntegerString.message.base          = dapat integer na nasa makatwirang saklaw
jp.ecuacion.lib.validation.constraints.LongString.message.base             = dapat integer na nasa makatwirang saklaw
jp.ecuacion.lib.validation.constraints.EnumElement.message.base            = dapat elemento ng enum na {enumClass}
jp.ecuacion.lib.validation.constraints.PatternWithDescription.message.base = dapat tumugma sa "{description}"
jp.ecuacion.lib.validation.constraints.ElementsNotEmpty.message.base       = hindi dapat walang laman
jp.ecuacion.lib.validation.constraints.FileExists.message.base             = dapat path ng isang umiiral na regular na file
jp.ecuacion.lib.validation.constraints.DirExists.message.base              = dapat path ng isang umiiral na direktoryo
jp.ecuacion.lib.validation.constraints.PathExists.message.base             = dapat path ng isang umiiral na file o direktoryo
jp.ecuacion.lib.validation.constraints.FileExtension.message.base          = dapat may file extension na "{extension}"

# class validators
jp.ecuacion.lib.validation.constraints.AnyNull.message.base                    = dapat null ang isa sa {0}
jp.ecuacion.lib.validation.constraints.AnyNotNull.message.base                 = hindi dapat null ang isa sa {0}
jp.ecuacion.lib.validation.constraints.AllNullOrAllNotNull.message.base        = dapat lahat null o lahat hindi null ang {0}
jp.ecuacion.lib.validation.constraints.AllOrNoneNull.message.base              = dapat lahat null o lahat hindi null ang {0}
jp.ecuacion.lib.validation.constraints.AnyEmpty.message.base                   = dapat walang laman ang isa sa {0}
jp.ecuacion.lib.validation.constraints.AnyNotEmpty.message.base                = hindi dapat walang laman ang isa sa {0}
jp.ecuacion.lib.validation.constraints.AllEmptyOrAllNotEmpty.message.base      = dapat lahat walang laman o lahat may laman ang {0}
jp.ecuacion.lib.validation.constraints.AllOrNoneEmpty.message.base             = dapat lahat walang laman o lahat may laman ang {0}
jp.ecuacion.lib.validation.constraints.GreaterThan.message.base                = dapat mas mataas sa halaga ng {baselinePropertyPathItemName}
jp.ecuacion.lib.validation.constraints.GreaterThanOrEqualTo.message.base       = dapat mas mataas o katumbas ng halaga ng {baselinePropertyPathItemName}
jp.ecuacion.lib.validation.constraints.LessThan.message.base                   = dapat mas mababa sa halaga ng {baselinePropertyPathItemName}
jp.ecuacion.lib.validation.constraints.LessThanOrEqualTo.message.base          = dapat mas mababa o katumbas ng halaga ng {baselinePropertyPathItemName}
jp.ecuacion.lib.validation.constraints.NullWhen.message.base                   = dapat null kapag {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotNullWhen.message.base                = hindi dapat null kapag {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.EmptyWhen.message.base                  = dapat walang laman kapag {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotEmptyWhen.message.base               = hindi dapat walang laman kapag {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.TrueWhen.message.base                   = dapat true kapag {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.FalseWhen.message.base                  = dapat false kapag {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.StringWhen.message.base                 = dapat isang tiyak na halaga kapag {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotStringWhen.message.base              = hindi dapat isang tiyak na halaga kapag {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.PatternWhen.message.base                = dapat tumugma sa pattern kapag {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotPatternWhen.message.base             = hindi dapat tumugma sa pattern kapag {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.ValueOfPropertyPathWhen.message.base    = dapat halaga ng isang tiyak na field kapag {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotValueOfPropertyPathWhen.message.base = hindi dapat halaga ng isang tiyak na field kapag {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
