# field validators
jp.ecuacion.lib.validation.constraints.SizeString.message.base             = आकार {min} आणि {max} दरम्यान असणे आवश्यक आहे
jp.ecuacion.lib.validation.constraints.BooleanString.message.base          = बूलियन मूल्य व्यक्त करणारी स्ट्रिंग असणे आवश्यक आहे ("true", "false", "on", "off", "yes", "no", "t", "f", "y", "n", "○", "×")
jp.ecuacion.lib.validation.constraints.IntegerString.message.base          = वाजवी मर्यादेतील पूर्णांक असणे आवश्यक आहे
jp.ecuacion.lib.validation.constraints.LongString.message.base             = वाजवी मर्यादेतील पूर्णांक असणे आवश्यक आहे
jp.ecuacion.lib.validation.constraints.EnumElement.message.base            = enum {enumClass} चा घटक असणे आवश्यक आहे
jp.ecuacion.lib.validation.constraints.PatternWithDescription.message.base = "{description}" शी जुळणे आवश्यक आहे
jp.ecuacion.lib.validation.constraints.ElementsNotEmpty.message.base       = रिक्त नसावे
jp.ecuacion.lib.validation.constraints.FileExists.message.base             = विद्यमान सामान्य फाइलचा मार्ग असणे आवश्यक आहे
jp.ecuacion.lib.validation.constraints.DirExists.message.base              = विद्यमान निर्देशिकेचा मार्ग असणे आवश्यक आहे
jp.ecuacion.lib.validation.constraints.PathExists.message.base             = विद्यमान फाइल किंवा निर्देशिकेचा मार्ग असणे आवश्यक आहे
jp.ecuacion.lib.validation.constraints.FileExtension.message.base          = फाइल विस्तार "{extension}" असणे आवश्यक आहे

# class validators
jp.ecuacion.lib.validation.constraints.AnyNull.message.base                    = {0} पैकी कोणतेही एक null असणे आवश्यक आहे
jp.ecuacion.lib.validation.constraints.AnyNotNull.message.base                 = {0} पैकी कोणतेही एक null नसावे
jp.ecuacion.lib.validation.constraints.AllNullOrAllNotNull.message.base        = {0} सर्व null असणे किंवा एकही null नसणे आवश्यक आहे
jp.ecuacion.lib.validation.constraints.AllOrNoneNull.message.base              = {0} सर्व null असणे किंवा एकही null नसणे आवश्यक आहे
jp.ecuacion.lib.validation.constraints.AnyEmpty.message.base                   = {0} पैकी कोणतेही एक रिक्त असणे आवश्यक आहे
jp.ecuacion.lib.validation.constraints.AnyNotEmpty.message.base                = {0} पैकी कोणतेही एक रिक्त नसावे
jp.ecuacion.lib.validation.constraints.AllEmptyOrAllNotEmpty.message.base      = {0} सर्व रिक्त असणे किंवा एकही रिक्त नसणे आवश्यक आहे
jp.ecuacion.lib.validation.constraints.AllOrNoneEmpty.message.base             = {0} सर्व रिक्त असणे किंवा एकही रिक्त नसणे आवश्यक आहे
jp.ecuacion.lib.validation.constraints.GreaterThan.message.base                = {baselinePropertyPathItemName} च्या मूल्यापेक्षा जास्त असणे आवश्यक आहे
jp.ecuacion.lib.validation.constraints.GreaterThanOrEqualTo.message.base       = {baselinePropertyPathItemName} च्या मूल्यापेक्षा जास्त किंवा समान असणे आवश्यक आहे
jp.ecuacion.lib.validation.constraints.LessThan.message.base                   = {baselinePropertyPathItemName} च्या मूल्यापेक्षा कमी असणे आवश्यक आहे
jp.ecuacion.lib.validation.constraints.LessThanOrEqualTo.message.base          = {baselinePropertyPathItemName} च्या मूल्यापेक्षा कमी किंवा समान असणे आवश्यक आहे
jp.ecuacion.lib.validation.constraints.NullWhen.message.base                   = जर {conditionDescription}, तर null असणे आवश्यक आहे{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotNullWhen.message.base                = जर {conditionDescription}, तर null नसावे{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.EmptyWhen.message.base                  = जर {conditionDescription}, तर रिक्त असणे आवश्यक आहे{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotEmptyWhen.message.base               = जर {conditionDescription}, तर रिक्त नसावे{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.TrueWhen.message.base                   = जर {conditionDescription}, तर true असणे आवश्यक आहे{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.FalseWhen.message.base                  = जर {conditionDescription}, तर false असणे आवश्यक आहे{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.StringWhen.message.base                 = जर {conditionDescription}, तर विशिष्ट मूल्य असणे आवश्यक आहे{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotStringWhen.message.base              = जर {conditionDescription}, तर विशिष्ट मूल्य नसावे{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.PatternWhen.message.base                = जर {conditionDescription}, तर नमुन्याशी जुळणे आवश्यक आहे{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotPatternWhen.message.base             = जर {conditionDescription}, तर नमुन्याशी जुळू नये{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.ValueOfPropertyPathWhen.message.base    = जर {conditionDescription}, तर विशिष्ट फील्डचे मूल्य असणे आवश्यक आहे{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotValueOfPropertyPathWhen.message.base = जर {conditionDescription}, तर विशिष्ट फील्डचे मूल्य नसावे{validatesWhenConditionNotSatisfiedDescription}
