# field validators
jp.ecuacion.lib.validation.constraints.SizeString.message.base             = la taille doit être comprise entre {min} et {max}
jp.ecuacion.lib.validation.constraints.BooleanString.message.base          = doit être une chaîne exprimant une valeur booléenne ("true", "false", "on", "off", "yes", "no", "t", "f", "y", "n", "○", "×")
jp.ecuacion.lib.validation.constraints.IntegerString.message.base          = doit être un entier dans une plage raisonnable
jp.ecuacion.lib.validation.constraints.LongString.message.base             = doit être un entier dans une plage raisonnable
jp.ecuacion.lib.validation.constraints.EnumElement.message.base            = doit être un élément de l’énumération {enumClass}
jp.ecuacion.lib.validation.constraints.PatternWithDescription.message.base = doit correspondre à "{description}"
jp.ecuacion.lib.validation.constraints.ElementsNotEmpty.message.base       = ne doit pas être vide
jp.ecuacion.lib.validation.constraints.FileExists.message.base             = doit être le chemin d’un fichier ordinaire existant
jp.ecuacion.lib.validation.constraints.DirExists.message.base              = doit être le chemin d’un répertoire existant
jp.ecuacion.lib.validation.constraints.PathExists.message.base             = doit être le chemin d’un fichier ou d’un répertoire existant
jp.ecuacion.lib.validation.constraints.FileExtension.message.base          = doit avoir l’extension de fichier "{extension}"

