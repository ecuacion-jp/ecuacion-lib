# field validators
jp.ecuacion.lib.validation.constraints.SizeString.message.base             = పరిమాణం {min} నుండి {max} మధ్య ఉండాలి
jp.ecuacion.lib.validation.constraints.BooleanString.message.base          = బూలియన్ విలువను సూచించే స్ట్రింగ్ అయి ఉండాలి ("true", "false", "on", "off", "yes", "no", "t", "f", "y", "n", "○", "×")
jp.ecuacion.lib.validation.constraints.IntegerString.message.base          = సహేతుకమైన పరిధిలో పూర్ణాంకం అయి ఉండాలి
jp.ecuacion.lib.validation.constraints.LongString.message.base             = సహేతుకమైన పరిధిలో పూర్ణాంకం అయి ఉండాలి
jp.ecuacion.lib.validation.constraints.EnumElement.message.base            = enum {enumClass} యొక్క మూలకం అయి ఉండాలి
jp.ecuacion.lib.validation.constraints.PatternWithDescription.message.base = "{description}" తో సరిపోలాలి
jp.ecuacion.lib.validation.constraints.ElementsNotEmpty.message.base       = ఖాళీగా ఉండకూడదు
jp.ecuacion.lib.validation.constraints.FileExists.message.base             = ఉన్న సాధారణ ఫైల్ యొక్క పాత్ అయి ఉండాలి
jp.ecuacion.lib.validation.constraints.DirExists.message.base              = ఉన్న డైరెక్టరీ యొక్క పాత్ అయి ఉండాలి
jp.ecuacion.lib.validation.constraints.PathExists.message.base             = ఉన్న ఫైల్ లేదా డైరెక్టరీ యొక్క పాత్ అయి ఉండాలి
jp.ecuacion.lib.validation.constraints.FileExtension.message.base          = ఫైల్ పొడిగింపు "{extension}" అయి ఉండాలి

# class validators
jp.ecuacion.lib.validation.constraints.AnyNull.message.base                    = {0} లో ఏదో ఒకటి null అయి ఉండాలి
jp.ecuacion.lib.validation.constraints.AnyNotNull.message.base                 = {0} లో ఏదో ఒకటి null కాకూడదు
jp.ecuacion.lib.validation.constraints.AllNullOrAllNotNull.message.base        = {0} అన్నీ null అయి ఉండాలి లేదా ఏవీ null కాకూడదు
jp.ecuacion.lib.validation.constraints.AllOrNoneNull.message.base              = {0} అన్నీ null అయి ఉండాలి లేదా ఏవీ null కాకూడదు
jp.ecuacion.lib.validation.constraints.AnyEmpty.message.base                   = {0} లో ఏదో ఒకటి ఖాళీగా ఉండాలి
jp.ecuacion.lib.validation.constraints.AnyNotEmpty.message.base                = {0} లో ఏదో ఒకటి ఖాళీగా ఉండకూడదు
jp.ecuacion.lib.validation.constraints.AllEmptyOrAllNotEmpty.message.base      = {0} అన్నీ ఖాళీగా ఉండాలి లేదా ఏవీ ఖాళీగా ఉండకూడదు
jp.ecuacion.lib.validation.constraints.AllOrNoneEmpty.message.base             = {0} అన్నీ ఖాళీగా ఉండాలి లేదా ఏవీ ఖాళీగా ఉండకూడదు
jp.ecuacion.lib.validation.constraints.GreaterThan.message.base                = {baselinePropertyPathItemName} యొక్క విలువ కంటే ఎక్కువగా ఉండాలి
jp.ecuacion.lib.validation.constraints.GreaterThanOrEqualTo.message.base       = {baselinePropertyPathItemName} యొక్క విలువ కంటే ఎక్కువ లేదా సమానంగా ఉండాలి
jp.ecuacion.lib.validation.constraints.LessThan.message.base                   = {baselinePropertyPathItemName} యొక్క విలువ కంటే తక్కువగా ఉండాలి
jp.ecuacion.lib.validation.constraints.LessThanOrEqualTo.message.base          = {baselinePropertyPathItemName} యొక్క విలువ కంటే తక్కువ లేదా సమానంగా ఉండాలి
