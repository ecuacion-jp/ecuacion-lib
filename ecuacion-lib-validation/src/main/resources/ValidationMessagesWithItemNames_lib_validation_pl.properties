# field validators
jp.ecuacion.lib.validation.constraints.SizeString.message.base             = Rozmiar {0} musi mieścić się w przedziale od {min} do {max}. (wprowadzono: {invalidValue})
jp.ecuacion.lib.validation.constraints.BooleanString.message.base          = {0} musi być ciągiem wyrażającym wartość logiczną ("true", "false", "on", "off", "yes", "no", "t", "f", "y", "n", "○", "×"). (wprowadzono: {invalidValue})
jp.ecuacion.lib.validation.constraints.IntegerString.message.base          = {0} musi być liczbą całkowitą z rozsądnego zakresu. (wprowadzono: {invalidValue})
jp.ecuacion.lib.validation.constraints.LongString.message.base             = {0} musi być liczbą całkowitą z rozsądnego zakresu. (wprowadzono: {invalidValue})
jp.ecuacion.lib.validation.constraints.EnumElement.message.base            = {0} musi być elementem typu wyliczeniowego {enumClass}. (wprowadzono: {invalidValue})
jp.ecuacion.lib.validation.constraints.PatternWithDescription.message.base = {0} musi pasować do "{description}". (wprowadzono: {invalidValue})
jp.ecuacion.lib.validation.constraints.ElementsNotEmpty.message.base       = {0} nie może być puste.
jp.ecuacion.lib.validation.constraints.FileExists.message.base             = {0} musi być ścieżką do istniejącego zwykłego pliku. (wprowadzono: {invalidValue})
jp.ecuacion.lib.validation.constraints.DirExists.message.base              = {0} musi być ścieżką do istniejącego katalogu. (wprowadzono: {invalidValue})
jp.ecuacion.lib.validation.constraints.PathExists.message.base             = {0} musi być ścieżką do istniejącego pliku lub katalogu. (wprowadzono: {invalidValue})
jp.ecuacion.lib.validation.constraints.FileExtension.message.base          = {0} musi mieć rozszerzenie pliku "{extension}". (wprowadzono: {invalidValue})

