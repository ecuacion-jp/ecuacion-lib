# field validators
jp.ecuacion.lib.validation.constraints.SizeString.message.base             = Größe muss zwischen {min} und {max} liegen
jp.ecuacion.lib.validation.constraints.BooleanString.message.base          = muss eine Zeichenkette sein, die einen Wahrheitswert ausdrückt ("true", "false", "on", "off", "yes", "no", "t", "f", "y", "n", "○", "×")
jp.ecuacion.lib.validation.constraints.IntegerString.message.base          = muss eine ganze Zahl in einem üblichen Bereich sein
jp.ecuacion.lib.validation.constraints.LongString.message.base             = muss eine ganze Zahl in einem üblichen Bereich sein
jp.ecuacion.lib.validation.constraints.EnumElement.message.base            = muss ein Element des Enums {enumClass} sein
jp.ecuacion.lib.validation.constraints.PatternWithDescription.message.base = muss "{description}" entsprechen
jp.ecuacion.lib.validation.constraints.ElementsNotEmpty.message.base       = darf nicht leer sein
jp.ecuacion.lib.validation.constraints.FileExists.message.base             = muss der Pfad einer vorhandenen regulären Datei sein
jp.ecuacion.lib.validation.constraints.DirExists.message.base              = muss der Pfad eines vorhandenen Verzeichnisses sein
jp.ecuacion.lib.validation.constraints.PathExists.message.base             = muss der Pfad einer vorhandenen Datei oder eines vorhandenen Verzeichnisses sein
jp.ecuacion.lib.validation.constraints.FileExtension.message.base          = muss die Dateierweiterung "{extension}" haben

# class validators
jp.ecuacion.lib.validation.constraints.AnyNull.message.base                    = eines von {0} muss null sein
jp.ecuacion.lib.validation.constraints.AnyNotNull.message.base                 = eines von {0} darf nicht null sein
jp.ecuacion.lib.validation.constraints.AllNullOrAllNotNull.message.base        = alle von {0} müssen null oder nicht null sein
jp.ecuacion.lib.validation.constraints.AllOrNoneNull.message.base              = alle von {0} müssen null oder nicht null sein
jp.ecuacion.lib.validation.constraints.AnyEmpty.message.base                   = eines von {0} muss leer sein
jp.ecuacion.lib.validation.constraints.AnyNotEmpty.message.base                = eines von {0} darf nicht leer sein
jp.ecuacion.lib.validation.constraints.AllEmptyOrAllNotEmpty.message.base      = alle von {0} müssen leer oder nicht leer sein
jp.ecuacion.lib.validation.constraints.AllOrNoneEmpty.message.base             = alle von {0} müssen leer oder nicht leer sein
jp.ecuacion.lib.validation.constraints.GreaterThan.message.base                = muss größer als der Wert von {baselinePropertyPathItemName} sein
jp.ecuacion.lib.validation.constraints.GreaterThanOrEqualTo.message.base       = muss größer oder gleich dem Wert von {baselinePropertyPathItemName} sein
jp.ecuacion.lib.validation.constraints.LessThan.message.base                   = muss kleiner als der Wert von {baselinePropertyPathItemName} sein
jp.ecuacion.lib.validation.constraints.LessThanOrEqualTo.message.base          = muss kleiner oder gleich dem Wert von {baselinePropertyPathItemName} sein
jp.ecuacion.lib.validation.constraints.NullWhen.message.base                   = muss null sein, wenn {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotNullWhen.message.base                = darf nicht null sein, wenn {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.EmptyWhen.message.base                  = muss leer sein, wenn {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotEmptyWhen.message.base               = darf nicht leer sein, wenn {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.TrueWhen.message.base                   = muss true sein, wenn {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.FalseWhen.message.base                  = muss false sein, wenn {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.StringWhen.message.base                 = muss ein bestimmter Wert sein, wenn {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotStringWhen.message.base              = darf kein bestimmter Wert sein, wenn {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.PatternWhen.message.base                = muss dem Muster entsprechen, wenn {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotPatternWhen.message.base             = darf dem Muster nicht entsprechen, wenn {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.ValueOfPropertyPathWhen.message.base    = muss der Wert eines bestimmten Feldes sein, wenn {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotValueOfPropertyPathWhen.message.base = darf nicht der Wert eines bestimmten Feldes sein, wenn {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
