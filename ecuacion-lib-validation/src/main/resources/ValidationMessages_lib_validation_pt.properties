# field validators
jp.ecuacion.lib.validation.constraints.SizeString.message.base             = o tamanho deve estar entre {min} e {max}
jp.ecuacion.lib.validation.constraints.BooleanString.message.base          = deve ser uma cadeia que expresse um valor booleano ("true", "false", "on", "off", "yes", "no", "t", "f", "y", "n", "○", "×")
jp.ecuacion.lib.validation.constraints.IntegerString.message.base          = deve ser um número inteiro dentro de um intervalo razoável
jp.ecuacion.lib.validation.constraints.LongString.message.base             = deve ser um número inteiro dentro de um intervalo razoável
jp.ecuacion.lib.validation.constraints.EnumElement.message.base            = deve ser um elemento do enum {enumClass}
jp.ecuacion.lib.validation.constraints.PatternWithDescription.message.base = deve corresponder a "{description}"
jp.ecuacion.lib.validation.constraints.ElementsNotEmpty.message.base       = não deve estar vazio
jp.ecuacion.lib.validation.constraints.FileExists.message.base             = deve ser o caminho de um arquivo regular existente
jp.ecuacion.lib.validation.constraints.DirExists.message.base              = deve ser o caminho de um diretório existente
jp.ecuacion.lib.validation.constraints.PathExists.message.base             = deve ser o caminho de um arquivo ou diretório existente
jp.ecuacion.lib.validation.constraints.FileExtension.message.base          = deve ter a extensão de arquivo "{extension}"

