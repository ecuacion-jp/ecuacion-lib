# field validators
jp.ecuacion.lib.validation.constraints.SizeString.message.base             = el tamaño debe estar entre {min} y {max}
jp.ecuacion.lib.validation.constraints.BooleanString.message.base          = debe ser una cadena que exprese un valor booleano ("true", "false", "on", "off", "yes", "no", "t", "f", "y", "n", "○", "×")
jp.ecuacion.lib.validation.constraints.IntegerString.message.base          = debe ser un número entero dentro de un rango razonable
jp.ecuacion.lib.validation.constraints.LongString.message.base             = debe ser un número entero dentro de un rango razonable
jp.ecuacion.lib.validation.constraints.EnumElement.message.base            = debe ser un elemento del enum {enumClass}
jp.ecuacion.lib.validation.constraints.PatternWithDescription.message.base = debe coincidir con "{description}"
jp.ecuacion.lib.validation.constraints.ElementsNotEmpty.message.base       = no debe estar vacío
jp.ecuacion.lib.validation.constraints.FileExists.message.base             = debe ser la ruta de un archivo normal existente
jp.ecuacion.lib.validation.constraints.DirExists.message.base              = debe ser la ruta de un directorio existente
jp.ecuacion.lib.validation.constraints.PathExists.message.base             = debe ser la ruta de un archivo o directorio existente
jp.ecuacion.lib.validation.constraints.FileExtension.message.base          = debe tener la extensión de archivo "{extension}"

# class validators
jp.ecuacion.lib.validation.constraints.AnyNull.message.base                    = alguno de {0} debe ser null
jp.ecuacion.lib.validation.constraints.AnyNotNull.message.base                 = alguno de {0} no debe ser null
jp.ecuacion.lib.validation.constraints.AllNullOrAllNotNull.message.base        = todos los campos {0} deben ser null o no null
jp.ecuacion.lib.validation.constraints.AllOrNoneNull.message.base              = todos los campos {0} deben ser null o no null
jp.ecuacion.lib.validation.constraints.AnyEmpty.message.base                   = alguno de {0} debe estar vacío
jp.ecuacion.lib.validation.constraints.AnyNotEmpty.message.base                = alguno de {0} no debe estar vacío
jp.ecuacion.lib.validation.constraints.AllEmptyOrAllNotEmpty.message.base      = todos los campos {0} deben estar vacíos o no vacíos
jp.ecuacion.lib.validation.constraints.AllOrNoneEmpty.message.base             = todos los campos {0} deben estar vacíos o no vacíos
jp.ecuacion.lib.validation.constraints.GreaterThan.message.base                = debe ser mayor que el valor de {baselinePropertyPathItemName}
jp.ecuacion.lib.validation.constraints.GreaterThanOrEqualTo.message.base       = debe ser mayor o igual que el valor de {baselinePropertyPathItemName}
jp.ecuacion.lib.validation.constraints.LessThan.message.base                   = debe ser menor que el valor de {baselinePropertyPathItemName}
jp.ecuacion.lib.validation.constraints.LessThanOrEqualTo.message.base          = debe ser menor o igual que el valor de {baselinePropertyPathItemName}
jp.ecuacion.lib.validation.constraints.NullWhen.message.base                   = debe ser null cuando {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotNullWhen.message.base                = no debe ser null cuando {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.EmptyWhen.message.base                  = debe estar vacío cuando {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotEmptyWhen.message.base               = no debe estar vacío cuando {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.TrueWhen.message.base                   = debe ser true cuando {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.FalseWhen.message.base                  = debe ser false cuando {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.StringWhen.message.base                 = debe ser un valor específico cuando {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotStringWhen.message.base              = no debe ser un valor específico cuando {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.PatternWhen.message.base                = debe coincidir con el patrón cuando {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotPatternWhen.message.base             = no debe coincidir con el patrón cuando {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.ValueOfPropertyPathWhen.message.base    = debe ser el valor de un campo específico cuando {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotValueOfPropertyPathWhen.message.base = no debe ser el valor de un campo específico cuando {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
