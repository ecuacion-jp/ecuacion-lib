# field validators
jp.ecuacion.lib.validation.constraints.SizeString.message.base             = വലുപ്പം {min} നും {max} നും ഇടയിൽ ആയിരിക്കണം
jp.ecuacion.lib.validation.constraints.BooleanString.message.base          = ബൂളിയൻ മൂല്യം സൂചിപ്പിക്കുന്ന സ്ട്രിംഗ് ആയിരിക്കണം ("true", "false", "on", "off", "yes", "no", "t", "f", "y", "n", "○", "×")
jp.ecuacion.lib.validation.constraints.IntegerString.message.base          = ന്യായമായ പരിധിയിലുള്ള പൂർണ്ണസംഖ്യ ആയിരിക്കണം
jp.ecuacion.lib.validation.constraints.LongString.message.base             = ന്യായമായ പരിധിയിലുള്ള പൂർണ്ണസംഖ്യ ആയിരിക്കണം
jp.ecuacion.lib.validation.constraints.EnumElement.message.base            = enum {enumClass} ന്റെ ഘടകം ആയിരിക്കണം
jp.ecuacion.lib.validation.constraints.PatternWithDescription.message.base = "{description}" മായി പൊരുത്തപ്പെടണം
jp.ecuacion.lib.validation.constraints.ElementsNotEmpty.message.base       = ശൂന്യമായിരിക്കരുത്
jp.ecuacion.lib.validation.constraints.FileExists.message.base             = നിലവിലുള്ള സാധാരണ ഫയലിന്റെ പാത്ത് ആയിരിക്കണം
jp.ecuacion.lib.validation.constraints.DirExists.message.base              = നിലവിലുള്ള ഡയറക്ടറിയുടെ പാത്ത് ആയിരിക്കണം
jp.ecuacion.lib.validation.constraints.PathExists.message.base             = നിലവിലുള്ള ഫയലിന്റെയോ ഡയറക്ടറിയുടെയോ പാത്ത് ആയിരിക്കണം
jp.ecuacion.lib.validation.constraints.FileExtension.message.base          = ഫയൽ എക്സ്റ്റൻഷൻ "{extension}" ആയിരിക്കണം

# class validators
jp.ecuacion.lib.validation.constraints.AnyNull.message.base                    = {0} എന്നിവയിൽ ഏതെങ്കിലും ഒന്ന് null ആയിരിക്കണം
jp.ecuacion.lib.validation.constraints.AnyNotNull.message.base                 = {0} എന്നിവയിൽ ഏതെങ്കിലും ഒന്ന് null ആയിരിക്കരുത്
jp.ecuacion.lib.validation.constraints.AllNullOrAllNotNull.message.base        = {0} എല്ലാം null ആയിരിക്കണം അല്ലെങ്കിൽ ഒന്നും null ആയിരിക്കരുത്
jp.ecuacion.lib.validation.constraints.AllOrNoneNull.message.base              = {0} എല്ലാം null ആയിരിക്കണം അല്ലെങ്കിൽ ഒന്നും null ആയിരിക്കരുത്
jp.ecuacion.lib.validation.constraints.AnyEmpty.message.base                   = {0} എന്നിവയിൽ ഏതെങ്കിലും ഒന്ന് ശൂന്യമായിരിക്കണം
jp.ecuacion.lib.validation.constraints.AnyNotEmpty.message.base                = {0} എന്നിവയിൽ ഏതെങ്കിലും ഒന്ന് ശൂന്യമായിരിക്കരുത്
jp.ecuacion.lib.validation.constraints.AllEmptyOrAllNotEmpty.message.base      = {0} എല്ലാം ശൂന്യമായിരിക്കണം അല്ലെങ്കിൽ ഒന്നും ശൂന്യമായിരിക്കരുത്
jp.ecuacion.lib.validation.constraints.AllOrNoneEmpty.message.base             = {0} എല്ലാം ശൂന്യമായിരിക്കണം അല്ലെങ്കിൽ ഒന്നും ശൂന്യമായിരിക്കരുത്
jp.ecuacion.lib.validation.constraints.GreaterThan.message.base                = {baselinePropertyPathItemName} ന്റെ മൂല്യത്തേക്കാൾ കൂടുതൽ ആയിരിക്കണം
jp.ecuacion.lib.validation.constraints.GreaterThanOrEqualTo.message.base       = {baselinePropertyPathItemName} ന്റെ മൂല്യത്തേക്കാൾ കൂടുതലോ തുല്യമോ ആയിരിക്കണം
jp.ecuacion.lib.validation.constraints.LessThan.message.base                   = {baselinePropertyPathItemName} ന്റെ മൂല്യത്തേക്കാൾ കുറവ് ആയിരിക്കണം
jp.ecuacion.lib.validation.constraints.LessThanOrEqualTo.message.base          = {baselinePropertyPathItemName} ന്റെ മൂല്യത്തേക്കാൾ കുറവോ തുല്യമോ ആയിരിക്കണം
jp.ecuacion.lib.validation.constraints.NullWhen.message.base                   = {conditionDescription} സാഹചര്യത്തിൽ, null ആയിരിക്കണം{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotNullWhen.message.base                = {conditionDescription} സാഹചര്യത്തിൽ, null ആയിരിക്കരുത്{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.EmptyWhen.message.base                  = {conditionDescription} സാഹചര്യത്തിൽ, ശൂന്യമായിരിക്കണം{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotEmptyWhen.message.base               = {conditionDescription} സാഹചര്യത്തിൽ, ശൂന്യമായിരിക്കരുത്{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.TrueWhen.message.base                   = {conditionDescription} സാഹചര്യത്തിൽ, true ആയിരിക്കണം{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.FalseWhen.message.base                  = {conditionDescription} സാഹചര്യത്തിൽ, false ആയിരിക്കണം{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.StringWhen.message.base                 = {conditionDescription} സാഹചര്യത്തിൽ, ഒരു നിർദ്ദിഷ്ട മൂല്യം ആയിരിക്കണം{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotStringWhen.message.base              = {conditionDescription} സാഹചര്യത്തിൽ, ഒരു നിർദ്ദിഷ്ട മൂല്യം ആയിരിക്കരുത്{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.PatternWhen.message.base                = {conditionDescription} സാഹചര്യത്തിൽ, പാറ്റേണുമായി പൊരുത്തപ്പെടണം{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotPatternWhen.message.base             = {conditionDescription} സാഹചര്യത്തിൽ, പാറ്റേണുമായി പൊരുത്തപ്പെടരുത്{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.ValueOfPropertyPathWhen.message.base    = {conditionDescription} സാഹചര്യത്തിൽ, ഒരു നിർദ്ദിഷ്ട ഫീൽഡിന്റെ മൂല്യം ആയിരിക്കണം{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotValueOfPropertyPathWhen.message.base = {conditionDescription} സാഹചര്യത്തിൽ, ഒരു നിർദ്ദിഷ്ട ഫീൽഡിന്റെ മൂല്യം ആയിരിക്കരുത്{validatesWhenConditionNotSatisfiedDescription}
