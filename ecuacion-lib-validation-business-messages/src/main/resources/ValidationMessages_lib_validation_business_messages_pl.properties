# Business-friendly English messages for Jakarta Validation standard constraints.
# These override the neutral HV-standard messages provided by ecuacion-lib-core.
jakarta.validation.constraints.AssertFalse.message.default     = musi być wyłączone
jakarta.validation.constraints.AssertTrue.message.default      = musi być włączone
jakarta.validation.constraints.DecimalMax.message.default      = musi wynosić ${inclusive == true ? 'co najwyżej' : 'mniej niż'} {value}
jakarta.validation.constraints.DecimalMin.message.default      = musi wynosić ${inclusive == true ? 'co najmniej' : 'więcej niż'} {value}
jakarta.validation.constraints.Digits.message.default          = może mieć co najwyżej {integer} cyfr części całkowitej i {fraction} cyfr po przecinku
jakarta.validation.constraints.Email.message.default           = musi być prawidłowym adresem e-mail
jakarta.validation.constraints.Future.message.default          = musi być późniejsze niż dzisiaj
jakarta.validation.constraints.FutureOrPresent.message.default = musi być dzisiaj lub później
jakarta.validation.constraints.Max.message.default             = musi wynosić {value} lub mniej
jakarta.validation.constraints.Min.message.default             = musi wynosić {value} lub więcej
jakarta.validation.constraints.Negative.message.default        = musi być liczbą ujemną
jakarta.validation.constraints.NegativeOrZero.message.default  = musi wynosić 0 lub być ujemne
jakarta.validation.constraints.NotBlank.message.default        = nie może zawierać wyłącznie spacji
jakarta.validation.constraints.NotEmpty.message.default        = jest wymagane
jakarta.validation.constraints.NotNull.message.default         = jest wymagane
jakarta.validation.constraints.Null.message.default            = nie może być wypełnione
jakarta.validation.constraints.Past.message.default            = musi być wcześniejsze niż dzisiaj
jakarta.validation.constraints.PastOrPresent.message.default   = musi być dzisiaj lub wcześniej
jakarta.validation.constraints.Pattern.message.default         = musi mieć prawidłowy format
jakarta.validation.constraints.Positive.message.default        = musi być liczbą dodatnią
jakarta.validation.constraints.PositiveOrZero.message.default  = musi wynosić 0 lub być dodatnie
jakarta.validation.constraints.Size.message.default            = musi mieć od {min} do {max} znaków

