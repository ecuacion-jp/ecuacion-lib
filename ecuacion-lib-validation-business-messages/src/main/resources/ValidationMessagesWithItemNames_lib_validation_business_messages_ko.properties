jakarta.validation.constraints.NotNull.message.default         = {0}은(는) 필수 입력 항목입니다
jakarta.validation.constraints.Null.message.default            = {0}은(는) 입력하지 마세요 (입력값: {invalidValue})
jakarta.validation.constraints.Past.message.default            = {0}은(는) 오늘 이전의 날짜를 입력해 주세요 (입력값: {invalidValue})
jakarta.validation.constraints.PastOrPresent.message.default   = {0}은(는) 오늘 또는 그 이전의 날짜를 입력해 주세요 (입력값: {invalidValue})
jakarta.validation.constraints.Pattern.message.default         = {0}은(는) 올바른 형식으로 입력해 주세요 (입력값: {invalidValue})
jakarta.validation.constraints.Positive.message.default        = {0}은(는) 양수를 입력해 주세요 (입력값: {invalidValue})
jakarta.validation.constraints.PositiveOrZero.message.default  = {0}은(는) 0 또는 양수를 입력해 주세요 (입력값: {invalidValue})
jakarta.validation.constraints.Size.message.default            = {0}은(는) {min}자 이상 {max}자 이하로 입력해 주세요 (입력값: {invalidValue})

