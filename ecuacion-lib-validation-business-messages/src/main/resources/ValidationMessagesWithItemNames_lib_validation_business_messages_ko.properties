jakarta.validation.constraints.DecimalMax.message.default      = {0}은(는) {value} ${inclusive == true ? '이하' : '미만'}의 값을 입력해 주세요 (입력값: {invalidValue})
jakarta.validation.constraints.DecimalMin.message.default      = {0}은(는) {value} ${inclusive == true ? '이상' : '초과'}의 값을 입력해 주세요 (입력값: {invalidValue})
jakarta.validation.constraints.Digits.message.default          = {0}은(는) 정수 {integer}자리, 소수 {fraction}자리 이내로 입력해 주세요 (입력값: {invalidValue})
jakarta.validation.constraints.Email.message.default           = {0}은(는) 올바른 이메일 주소를 입력해 주세요 (입력값: {invalidValue})
jakarta.validation.constraints.Future.message.default          = {0}은(는) 오늘 이후의 날짜를 입력해 주세요 (입력값: {invalidValue})
jakarta.validation.constraints.FutureOrPresent.message.default = {0}은(는) 오늘 또는 그 이후의 날짜를 입력해 주세요 (입력값: {invalidValue})
jakarta.validation.constraints.Max.message.default             = {0}은(는) {value} 이하의 값을 입력해 주세요 (입력값: {invalidValue})
jakarta.validation.constraints.Min.message.default             = {0}은(는) {value} 이상의 값을 입력해 주세요 (입력값: {invalidValue})
jakarta.validation.constraints.Negative.message.default        = {0}은(는) 음수를 입력해 주세요 (입력값: {invalidValue})
jakarta.validation.constraints.NegativeOrZero.message.default  = {0}은(는) 0 또는 음수를 입력해 주세요 (입력값: {invalidValue})
