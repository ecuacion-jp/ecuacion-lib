jp.ecuacion.lib.validation.constraints.AllEmptyOrAllNotEmpty.message.default      = todos los campos {0} deben rellenarse o dejarse en blanco
jp.ecuacion.lib.validation.constraints.AllOrNoneEmpty.message.default             = todos los campos {0} deben rellenarse o dejarse en blanco
jp.ecuacion.lib.validation.constraints.GreaterThan.message.default                = debe ser mayor que {baselinePropertyPathItemName}
jp.ecuacion.lib.validation.constraints.GreaterThanOrEqualTo.message.default       = debe ser mayor o igual que {baselinePropertyPathItemName}
jp.ecuacion.lib.validation.constraints.LessThan.message.default                   = debe ser menor que {baselinePropertyPathItemName}
jp.ecuacion.lib.validation.constraints.LessThanOrEqualTo.message.default          = debe ser menor o igual que {baselinePropertyPathItemName}
