jp.ecuacion.lib.validation.constraints.TrueWhen.message.default                   = debe estar activado cuando {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.FalseWhen.message.default                  = debe estar desactivado cuando {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.StringWhen.message.default                 = debe ser el valor especificado cuando {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotStringWhen.message.default              = no debe ser el valor especificado cuando {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.PatternWhen.message.default                = debe tener el formato especificado cuando {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotPatternWhen.message.default             = no debe tener el formato especificado cuando {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.ValueOfPropertyPathWhen.message.default    = debe coincidir con el valor de otro campo cuando {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotValueOfPropertyPathWhen.message.default = no debe coincidir con el valor de otro campo cuando {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
