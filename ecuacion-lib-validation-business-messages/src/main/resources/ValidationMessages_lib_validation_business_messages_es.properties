jp.ecuacion.lib.validation.constraints.AllNullOrAllNotNull.message.default        = todos los campos {0} deben introducirse o dejarse vacíos
jp.ecuacion.lib.validation.constraints.AllOrNoneNull.message.default              = todos los campos {0} deben introducirse o dejarse vacíos
jp.ecuacion.lib.validation.constraints.AnyEmpty.message.default                   = alguno de {0} debe estar en blanco
