# Business-friendly English messages for Jakarta Validation standard constraints.
# These override the neutral HV-standard messages provided by ecuacion-lib-core.
jakarta.validation.constraints.AssertFalse.message.default     = debe estar desactivado
jakarta.validation.constraints.AssertTrue.message.default      = debe estar activado
jakarta.validation.constraints.DecimalMax.message.default      = debe ser ${inclusive == true ? 'como máximo' : 'menor que'} {value}
jakarta.validation.constraints.DecimalMin.message.default      = debe ser ${inclusive == true ? 'como mínimo' : 'mayor que'} {value}
jakarta.validation.constraints.Digits.message.default          = debe tener como máximo {integer} dígitos enteros y {fraction} decimales
jakarta.validation.constraints.Email.message.default           = debe ser una dirección de correo electrónico válida
jakarta.validation.constraints.Future.message.default          = debe ser posterior a hoy
jakarta.validation.constraints.FutureOrPresent.message.default = debe ser hoy o posterior
jakarta.validation.constraints.Max.message.default             = debe ser {value} o menos
jakarta.validation.constraints.Min.message.default             = debe ser {value} o más
jakarta.validation.constraints.Negative.message.default        = debe ser un número negativo
jakarta.validation.constraints.NegativeOrZero.message.default  = debe ser 0 o negativo
jakarta.validation.constraints.NotBlank.message.default        = no debe contener solo espacios
jakarta.validation.constraints.NotEmpty.message.default        = es obligatorio
jakarta.validation.constraints.NotNull.message.default         = es obligatorio
jakarta.validation.constraints.Null.message.default            = no debe introducirse
jakarta.validation.constraints.Past.message.default            = debe ser anterior a hoy
jakarta.validation.constraints.PastOrPresent.message.default   = debe ser hoy o anterior
jakarta.validation.constraints.Pattern.message.default         = debe tener el formato correcto
jakarta.validation.constraints.Positive.message.default        = debe ser un número positivo
jakarta.validation.constraints.PositiveOrZero.message.default  = debe ser 0 o positivo
jakarta.validation.constraints.Size.message.default            = debe tener entre {min} y {max} caracteres

# Business-friendly English messages for ecuacion-lib-validation field constraints.
jp.ecuacion.lib.validation.constraints.SizeString.message.default             = debe tener entre {min} y {max} caracteres
jp.ecuacion.lib.validation.constraints.BooleanString.message.default          = debe ser "true" o "false"
jp.ecuacion.lib.validation.constraints.IntegerString.message.default          = debe ser un número entero
jp.ecuacion.lib.validation.constraints.LongString.message.default             = debe ser un número entero
jp.ecuacion.lib.validation.constraints.EnumElement.message.default            = debe ser una opción válida
jp.ecuacion.lib.validation.constraints.PatternWithDescription.message.default = debe coincidir con "{description}"
jp.ecuacion.lib.validation.constraints.ElementsNotEmpty.message.default       = debe contener al menos un elemento
jp.ecuacion.lib.validation.constraints.FileExists.message.default             = debe ser un archivo existente
jp.ecuacion.lib.validation.constraints.DirExists.message.default              = debe ser una carpeta existente
jp.ecuacion.lib.validation.constraints.PathExists.message.default             = debe ser un archivo o una carpeta existente
jp.ecuacion.lib.validation.constraints.FileExtension.message.default          = debe ser un archivo "{extension}"

