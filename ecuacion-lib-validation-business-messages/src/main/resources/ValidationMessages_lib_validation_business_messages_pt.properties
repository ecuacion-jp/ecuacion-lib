jp.ecuacion.lib.validation.constraints.IntegerString.message.default          = deve ser um número inteiro
jp.ecuacion.lib.validation.constraints.LongString.message.default             = deve ser um número inteiro
jp.ecuacion.lib.validation.constraints.EnumElement.message.default            = deve ser uma opção válida
jp.ecuacion.lib.validation.constraints.PatternWithDescription.message.default = deve corresponder a "{description}"
jp.ecuacion.lib.validation.constraints.ElementsNotEmpty.message.default       = deve conter pelo menos um item
jp.ecuacion.lib.validation.constraints.FileExists.message.default             = deve ser um arquivo existente
jp.ecuacion.lib.validation.constraints.DirExists.message.default              = deve ser uma pasta existente
