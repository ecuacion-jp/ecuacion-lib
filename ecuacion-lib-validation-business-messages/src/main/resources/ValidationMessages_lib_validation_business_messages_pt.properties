# Business-friendly English messages for Jakarta Validation standard constraints.
# These override the neutral HV-standard messages provided by ecuacion-lib-core.
jakarta.validation.constraints.AssertFalse.message.default     = deve estar desativado
jakarta.validation.constraints.AssertTrue.message.default      = deve estar ativado
jakarta.validation.constraints.DecimalMax.message.default      = deve ser ${inclusive == true ? 'no máximo' : 'menor que'} {value}
jakarta.validation.constraints.DecimalMin.message.default      = deve ser ${inclusive == true ? 'no mínimo' : 'maior que'} {value}
jakarta.validation.constraints.Digits.message.default          = deve ter no máximo {integer} dígitos inteiros e {fraction} casas decimais
jakarta.validation.constraints.Email.message.default           = deve ser um endereço de e-mail válido
jakarta.validation.constraints.Future.message.default          = deve ser posterior a hoje
jakarta.validation.constraints.FutureOrPresent.message.default = deve ser hoje ou posterior
jakarta.validation.constraints.Max.message.default             = deve ser {value} ou menos
jakarta.validation.constraints.Min.message.default             = deve ser {value} ou mais
jakarta.validation.constraints.Negative.message.default        = deve ser um número negativo
jakarta.validation.constraints.NegativeOrZero.message.default  = deve ser 0 ou negativo
jakarta.validation.constraints.NotBlank.message.default        = não deve conter apenas espaços
jakarta.validation.constraints.NotEmpty.message.default        = é obrigatório
jakarta.validation.constraints.NotNull.message.default         = é obrigatório
jakarta.validation.constraints.Null.message.default            = não deve ser informado
jakarta.validation.constraints.Past.message.default            = deve ser anterior a hoje
jakarta.validation.constraints.PastOrPresent.message.default   = deve ser hoje ou anterior
jakarta.validation.constraints.Pattern.message.default         = deve estar no formato correto
jakarta.validation.constraints.Positive.message.default        = deve ser um número positivo
jakarta.validation.constraints.PositiveOrZero.message.default  = deve ser 0 ou positivo
jakarta.validation.constraints.Size.message.default            = deve ter entre {min} e {max} caracteres

