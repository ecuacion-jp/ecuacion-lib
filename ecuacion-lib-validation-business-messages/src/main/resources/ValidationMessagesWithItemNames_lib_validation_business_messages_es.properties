# Business-friendly English messages with item names for Jakarta Validation standard constraints
# These override the neutral HV-standard messages provided by ecuacion-lib-core
jakarta.validation.constraints.AssertFalse.message.default     = {0} debe estar desactivado (entrada: {invalidValue})
jakarta.validation.constraints.AssertTrue.message.default      = {0} debe estar activado (entrada: {invalidValue})
jakarta.validation.constraints.DecimalMax.message.default      = {0} debe ser ${inclusive == true ? 'como máximo' : 'menor que'} {value} (entrada: {invalidValue})
jakarta.validation.constraints.DecimalMin.message.default      = {0} debe ser ${inclusive == true ? 'como mínimo' : 'mayor que'} {value} (entrada: {invalidValue})
jakarta.validation.constraints.Digits.message.default          = {0} debe tener como máximo {integer} dígitos enteros y {fraction} decimales (entrada: {invalidValue})
jakarta.validation.constraints.Email.message.default           = {0} debe ser una dirección de correo electrónico válida (entrada: {invalidValue})
jakarta.validation.constraints.Future.message.default          = {0} debe ser posterior a hoy (entrada: {invalidValue})
jakarta.validation.constraints.FutureOrPresent.message.default = {0} debe ser hoy o posterior (entrada: {invalidValue})
jakarta.validation.constraints.Max.message.default             = {0} debe ser {value} o menos (entrada: {invalidValue})
jakarta.validation.constraints.Min.message.default             = {0} debe ser {value} o más (entrada: {invalidValue})
jakarta.validation.constraints.Negative.message.default        = {0} debe ser un número negativo (entrada: {invalidValue})
jakarta.validation.constraints.NegativeOrZero.message.default  = {0} debe ser 0 o negativo (entrada: {invalidValue})
jakarta.validation.constraints.NotBlank.message.default        = {0} no debe contener solo espacios
jakarta.validation.constraints.NotEmpty.message.default        = {0} es obligatorio
jakarta.validation.constraints.NotNull.message.default         = {0} es obligatorio
jakarta.validation.constraints.Null.message.default            = {0} no debe introducirse (entrada: {invalidValue})
jakarta.validation.constraints.Past.message.default            = {0} debe ser anterior a hoy (entrada: {invalidValue})
jakarta.validation.constraints.PastOrPresent.message.default   = {0} debe ser hoy o anterior (entrada: {invalidValue})
jakarta.validation.constraints.Pattern.message.default         = {0} debe tener el formato correcto (entrada: {invalidValue})
jakarta.validation.constraints.Positive.message.default        = {0} debe ser un número positivo (entrada: {invalidValue})
jakarta.validation.constraints.PositiveOrZero.message.default  = {0} debe ser 0 o positivo (entrada: {invalidValue})
jakarta.validation.constraints.Size.message.default            = {0} debe tener entre {min} y {max} caracteres (entrada: {invalidValue})

