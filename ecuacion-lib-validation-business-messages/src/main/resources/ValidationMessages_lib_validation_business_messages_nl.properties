# Business-friendly English messages for Jakarta Validation standard constraints.
# These override the neutral HV-standard messages provided by ecuacion-lib-core.
jakarta.validation.constraints.AssertFalse.message.default     = moet uitgeschakeld zijn
jakarta.validation.constraints.AssertTrue.message.default      = moet ingeschakeld zijn
jakarta.validation.constraints.DecimalMax.message.default      = moet ${inclusive == true ? 'maximaal' : 'kleiner dan'} {value} zijn
jakarta.validation.constraints.DecimalMin.message.default      = moet ${inclusive == true ? 'minimaal' : 'groter dan'} {value} zijn
jakarta.validation.constraints.Digits.message.default          = mag maximaal {integer} cijfers voor en {fraction} cijfers na de komma hebben
jakarta.validation.constraints.Email.message.default           = moet een geldig e-mailadres zijn
jakarta.validation.constraints.Future.message.default          = moet na vandaag liggen
jakarta.validation.constraints.FutureOrPresent.message.default = moet vandaag of later zijn
jakarta.validation.constraints.Max.message.default             = moet {value} of minder zijn
jakarta.validation.constraints.Min.message.default             = moet {value} of meer zijn
jakarta.validation.constraints.Negative.message.default        = moet een negatief getal zijn
jakarta.validation.constraints.NegativeOrZero.message.default  = moet 0 of negatief zijn
jakarta.validation.constraints.NotBlank.message.default        = mag niet alleen uit spaties bestaan
jakarta.validation.constraints.NotEmpty.message.default        = is verplicht
jakarta.validation.constraints.NotNull.message.default         = is verplicht
jakarta.validation.constraints.Null.message.default            = mag niet worden ingevuld
jakarta.validation.constraints.Past.message.default            = moet vóór vandaag liggen
jakarta.validation.constraints.PastOrPresent.message.default   = moet vandaag of eerder zijn
jakarta.validation.constraints.Pattern.message.default         = moet de juiste indeling hebben
jakarta.validation.constraints.Positive.message.default        = moet een positief getal zijn
jakarta.validation.constraints.PositiveOrZero.message.default  = moet 0 of positief zijn
jakarta.validation.constraints.Size.message.default            = moet tussen {min} en {max} tekens lang zijn

