jakarta.validation.constraints.AssertTrue.message.default      = {0} muss eingeschaltet sein (Eingabe: {invalidValue})
jakarta.validation.constraints.DecimalMax.message.default      = {0} muss ${inclusive == true ? 'höchstens' : 'kleiner als'} {value} sein (Eingabe: {invalidValue})
jakarta.validation.constraints.DecimalMin.message.default      = {0} muss ${inclusive == true ? 'mindestens' : 'größer als'} {value} sein (Eingabe: {invalidValue})
jakarta.validation.constraints.Digits.message.default          = {0} darf höchstens {integer} Vorkommastellen und {fraction} Nachkommastellen haben (Eingabe: {invalidValue})
jakarta.validation.constraints.Email.message.default           = {0} muss eine gültige E-Mail-Adresse sein (Eingabe: {invalidValue})
jakarta.validation.constraints.Future.message.default          = {0} muss nach dem heutigen Tag liegen (Eingabe: {invalidValue})
jakarta.validation.constraints.FutureOrPresent.message.default = {0} muss heute oder später sein (Eingabe: {invalidValue})
jakarta.validation.constraints.Max.message.default             = {0} muss {value} oder weniger sein (Eingabe: {invalidValue})
jakarta.validation.constraints.Min.message.default             = {0} muss {value} oder mehr sein (Eingabe: {invalidValue})
jakarta.validation.constraints.Negative.message.default        = {0} muss eine negative Zahl sein (Eingabe: {invalidValue})
jakarta.validation.constraints.NegativeOrZero.message.default  = {0} muss 0 oder negativ sein (Eingabe: {invalidValue})
jakarta.validation.constraints.NotBlank.message.default        = {0} darf nicht nur aus Leerzeichen bestehen
jakarta.validation.constraints.NotEmpty.message.default        = {0} ist ein Pflichtfeld
jakarta.validation.constraints.NotNull.message.default         = {0} ist ein Pflichtfeld
jakarta.validation.constraints.Null.message.default            = {0} darf nicht eingegeben werden (Eingabe: {invalidValue})
jakarta.validation.constraints.Past.message.default            = {0} muss vor dem heutigen Tag liegen (Eingabe: {invalidValue})
jakarta.validation.constraints.PastOrPresent.message.default   = {0} muss heute oder früher sein (Eingabe: {invalidValue})
jakarta.validation.constraints.Pattern.message.default         = {0} muss im richtigen Format sein (Eingabe: {invalidValue})
jakarta.validation.constraints.Positive.message.default        = {0} muss eine positive Zahl sein (Eingabe: {invalidValue})
jakarta.validation.constraints.PositiveOrZero.message.default  = {0} muss 0 oder positiv sein (Eingabe: {invalidValue})
jakarta.validation.constraints.Size.message.default            = {0} muss zwischen {min} und {max} Zeichen lang sein (Eingabe: {invalidValue})

