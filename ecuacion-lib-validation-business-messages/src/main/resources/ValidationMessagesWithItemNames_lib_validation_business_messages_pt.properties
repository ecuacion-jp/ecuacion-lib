jakarta.validation.constraints.NegativeOrZero.message.default  = {0} deve ser 0 ou negativo (valor informado: {invalidValue})
jakarta.validation.constraints.NotBlank.message.default        = {0} não deve conter apenas espaços
jakarta.validation.constraints.NotEmpty.message.default        = {0} é obrigatório
jakarta.validation.constraints.NotNull.message.default         = {0} é obrigatório
jakarta.validation.constraints.Null.message.default            = {0} não deve ser informado (valor informado: {invalidValue})
jakarta.validation.constraints.Past.message.default            = {0} deve ser anterior a hoje (valor informado: {invalidValue})
jakarta.validation.constraints.PastOrPresent.message.default   = {0} deve ser hoje ou anterior (valor informado: {invalidValue})
jakarta.validation.constraints.Pattern.message.default         = {0} deve estar no formato correto (valor informado: {invalidValue})
jakarta.validation.constraints.Positive.message.default        = {0} deve ser um número positivo (valor informado: {invalidValue})
jakarta.validation.constraints.PositiveOrZero.message.default  = {0} deve ser 0 ou positivo (valor informado: {invalidValue})
jakarta.validation.constraints.Size.message.default            = {0} deve ter entre {min} e {max} caracteres (valor informado: {invalidValue})

