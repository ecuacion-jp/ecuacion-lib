jakarta.validation.constraints.Future.message.default          = phải sau ngày hôm nay
jakarta.validation.constraints.FutureOrPresent.message.default = phải là hôm nay hoặc sau đó
jakarta.validation.constraints.Max.message.default             = phải bằng {value} hoặc nhỏ hơn
jakarta.validation.constraints.Min.message.default             = phải bằng {value} hoặc lớn hơn
jakarta.validation.constraints.Negative.message.default        = phải là số âm
jakarta.validation.constraints.NegativeOrZero.message.default  = phải là 0 hoặc số âm
jakarta.validation.constraints.NotBlank.message.default        = không được chỉ chứa khoảng trắng
jakarta.validation.constraints.NotEmpty.message.default        = là bắt buộc
jakarta.validation.constraints.NotNull.message.default         = là bắt buộc
jakarta.validation.constraints.Null.message.default            = không được nhập
jakarta.validation.constraints.Past.message.default            = phải trước ngày hôm nay
jakarta.validation.constraints.PastOrPresent.message.default   = phải là hôm nay hoặc trước đó
jakarta.validation.constraints.Pattern.message.default         = phải đúng định dạng
jakarta.validation.constraints.Positive.message.default        = phải là số dương
jakarta.validation.constraints.PositiveOrZero.message.default  = phải là 0 hoặc số dương
jakarta.validation.constraints.Size.message.default            = phải có từ {min} đến {max} ký tự

