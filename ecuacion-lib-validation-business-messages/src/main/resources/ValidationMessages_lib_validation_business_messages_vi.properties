# Business-friendly English messages for Jakarta Validation standard constraints.
# These override the neutral HV-standard messages provided by ecuacion-lib-core.
jakarta.validation.constraints.AssertFalse.message.default     = phải được tắt
jakarta.validation.constraints.AssertTrue.message.default      = phải được bật
jakarta.validation.constraints.DecimalMax.message.default      = phải ${inclusive == true ? 'tối đa là' : 'nhỏ hơn'} {value}
jakarta.validation.constraints.DecimalMin.message.default      = phải ${inclusive == true ? 'tối thiểu là' : 'lớn hơn'} {value}
jakarta.validation.constraints.Digits.message.default          = tối đa {integer} chữ số phần nguyên và {fraction} chữ số thập phân
