# Business-friendly English messages for Jakarta Validation standard constraints.
# These override the neutral HV-standard messages provided by ecuacion-lib-core.
jakarta.validation.constraints.AssertFalse.message.default     = muss ausgeschaltet sein
jakarta.validation.constraints.AssertTrue.message.default      = muss eingeschaltet sein
jakarta.validation.constraints.DecimalMax.message.default      = muss ${inclusive == true ? 'höchstens' : 'kleiner als'} {value} sein
jakarta.validation.constraints.DecimalMin.message.default      = muss ${inclusive == true ? 'mindestens' : 'größer als'} {value} sein
jakarta.validation.constraints.Digits.message.default          = darf höchstens {integer} Vorkommastellen und {fraction} Nachkommastellen haben
jakarta.validation.constraints.Email.message.default           = muss eine gültige E-Mail-Adresse sein
jakarta.validation.constraints.Future.message.default          = muss nach dem heutigen Tag liegen
jakarta.validation.constraints.FutureOrPresent.message.default = muss heute oder später sein
jakarta.validation.constraints.Max.message.default             = muss {value} oder weniger sein
jakarta.validation.constraints.Min.message.default             = muss {value} oder mehr sein
jakarta.validation.constraints.Negative.message.default        = muss eine negative Zahl sein
jakarta.validation.constraints.NegativeOrZero.message.default  = muss 0 oder negativ sein
jakarta.validation.constraints.NotBlank.message.default        = darf nicht nur aus Leerzeichen bestehen
jakarta.validation.constraints.NotEmpty.message.default        = ist ein Pflichtfeld
jakarta.validation.constraints.NotNull.message.default         = ist ein Pflichtfeld
jakarta.validation.constraints.Null.message.default            = darf nicht eingegeben werden
jakarta.validation.constraints.Past.message.default            = muss vor dem heutigen Tag liegen
jakarta.validation.constraints.PastOrPresent.message.default   = muss heute oder früher sein
jakarta.validation.constraints.Pattern.message.default         = muss im richtigen Format sein
jakarta.validation.constraints.Positive.message.default        = muss eine positive Zahl sein
jakarta.validation.constraints.PositiveOrZero.message.default  = muss 0 oder positiv sein
jakarta.validation.constraints.Size.message.default            = muss zwischen {min} und {max} Zeichen lang sein

# Business-friendly English messages for ecuacion-lib-validation field constraints.
jp.ecuacion.lib.validation.constraints.SizeString.message.default             = muss zwischen {min} und {max} Zeichen lang sein
jp.ecuacion.lib.validation.constraints.BooleanString.message.default          = muss "true" oder "false" sein
jp.ecuacion.lib.validation.constraints.IntegerString.message.default          = muss eine ganze Zahl sein
jp.ecuacion.lib.validation.constraints.LongString.message.default             = muss eine ganze Zahl sein
jp.ecuacion.lib.validation.constraints.EnumElement.message.default            = muss eine gültige Auswahl sein
jp.ecuacion.lib.validation.constraints.PatternWithDescription.message.default = muss "{description}" entsprechen
jp.ecuacion.lib.validation.constraints.ElementsNotEmpty.message.default       = muss mindestens einen Eintrag enthalten
jp.ecuacion.lib.validation.constraints.FileExists.message.default             = muss eine vorhandene Datei sein
jp.ecuacion.lib.validation.constraints.DirExists.message.default              = muss ein vorhandener Ordner sein
jp.ecuacion.lib.validation.constraints.PathExists.message.default             = muss eine vorhandene Datei oder ein vorhandener Ordner sein
jp.ecuacion.lib.validation.constraints.FileExtension.message.default          = muss eine "{extension}"-Datei sein

