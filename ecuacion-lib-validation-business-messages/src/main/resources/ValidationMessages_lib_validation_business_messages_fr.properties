# Business-friendly English messages for Jakarta Validation standard constraints.
# These override the neutral HV-standard messages provided by ecuacion-lib-core.
jakarta.validation.constraints.AssertFalse.message.default     = doit être désactivé
jakarta.validation.constraints.AssertTrue.message.default      = doit être activé
jakarta.validation.constraints.DecimalMax.message.default      = doit être ${inclusive == true ? 'au maximum' : 'inférieur à'} {value}
jakarta.validation.constraints.DecimalMin.message.default      = doit être ${inclusive == true ? 'au minimum' : 'supérieur à'} {value}
jakarta.validation.constraints.Digits.message.default          = doit comporter au maximum {integer} chiffres entiers et {fraction} décimales
jakarta.validation.constraints.Email.message.default           = doit être une adresse e-mail valide
jakarta.validation.constraints.Future.message.default          = doit être postérieur à aujourd’hui
jakarta.validation.constraints.FutureOrPresent.message.default = doit être aujourd’hui ou plus tard
jakarta.validation.constraints.Max.message.default             = doit être inférieur ou égal à {value}
jakarta.validation.constraints.Min.message.default             = doit être supérieur ou égal à {value}
jakarta.validation.constraints.Negative.message.default        = doit être un nombre négatif
jakarta.validation.constraints.NegativeOrZero.message.default  = doit être 0 ou négatif
jakarta.validation.constraints.NotBlank.message.default        = ne doit pas contenir uniquement des espaces
jakarta.validation.constraints.NotEmpty.message.default        = est obligatoire
jakarta.validation.constraints.NotNull.message.default         = est obligatoire
jakarta.validation.constraints.Null.message.default            = ne doit pas être saisi
jakarta.validation.constraints.Past.message.default            = doit être antérieur à aujourd’hui
jakarta.validation.constraints.PastOrPresent.message.default   = doit être aujourd’hui ou plus tôt
jakarta.validation.constraints.Pattern.message.default         = doit être au format correct
jakarta.validation.constraints.Positive.message.default        = doit être un nombre positif
jakarta.validation.constraints.PositiveOrZero.message.default  = doit être 0 ou positif
jakarta.validation.constraints.Size.message.default            = doit comporter entre {min} et {max} caractères

