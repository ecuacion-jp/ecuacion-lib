jp.ecuacion.lib.validation.constraints.AnyNotNull.message.default                 = mindst ét af felterne {0} skal udfyldes
jp.ecuacion.lib.validation.constraints.AllNullOrAllNotNull.message.default        = felterne {0} skal enten alle udfyldes eller alle være tomme
jp.ecuacion.lib.validation.constraints.AllOrNoneNull.message.default              = felterne {0} skal enten alle udfyldes eller alle være tomme
jp.ecuacion.lib.validation.constraints.AnyEmpty.message.default                   = et af felterne {0} skal være blankt
jp.ecuacion.lib.validation.constraints.AnyNotEmpty.message.default                = mindst ét af felterne {0} skal udfyldes
jp.ecuacion.lib.validation.constraints.AllEmptyOrAllNotEmpty.message.default      = felterne {0} skal enten alle være udfyldt eller alle være blanke
jp.ecuacion.lib.validation.constraints.AllOrNoneEmpty.message.default             = felterne {0} skal enten alle være udfyldt eller alle være blanke
jp.ecuacion.lib.validation.constraints.GreaterThan.message.default                = skal være større end {baselinePropertyPathItemName}
jp.ecuacion.lib.validation.constraints.GreaterThanOrEqualTo.message.default       = skal være større end eller lig med {baselinePropertyPathItemName}
jp.ecuacion.lib.validation.constraints.LessThan.message.default                   = skal være mindre end {baselinePropertyPathItemName}
jp.ecuacion.lib.validation.constraints.LessThanOrEqualTo.message.default          = skal være mindre end eller lig med {baselinePropertyPathItemName}
jp.ecuacion.lib.validation.constraints.NullWhen.message.default                   = skal være tom, når {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotNullWhen.message.default                = skal udfyldes, når {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.EmptyWhen.message.default                  = skal være blank, når {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
