# Business-friendly English messages for Jakarta Validation standard constraints.
# These override the neutral HV-standard messages provided by ecuacion-lib-core.
jakarta.validation.constraints.AssertFalse.message.default     = skal være slået fra
jakarta.validation.constraints.AssertTrue.message.default      = skal være slået til
jakarta.validation.constraints.DecimalMax.message.default      = skal være ${inclusive == true ? 'højst' : 'mindre end'} {value}
jakarta.validation.constraints.DecimalMin.message.default      = skal være ${inclusive == true ? 'mindst' : 'større end'} {value}
jakarta.validation.constraints.Digits.message.default          = må højst have {integer} heltalscifre og {fraction} decimaler
jakarta.validation.constraints.Email.message.default           = skal være en gyldig e-mailadresse
jakarta.validation.constraints.Future.message.default          = skal være efter i dag
jakarta.validation.constraints.FutureOrPresent.message.default = skal være i dag eller senere
jakarta.validation.constraints.Max.message.default             = skal være {value} eller mindre
jakarta.validation.constraints.Min.message.default             = skal være {value} eller mere
jakarta.validation.constraints.Negative.message.default        = skal være et negativt tal
jakarta.validation.constraints.NegativeOrZero.message.default  = skal være 0 eller negativ
jakarta.validation.constraints.NotBlank.message.default        = må ikke kun bestå af mellemrum
jakarta.validation.constraints.NotEmpty.message.default        = skal udfyldes
jakarta.validation.constraints.NotNull.message.default         = skal udfyldes
jakarta.validation.constraints.Null.message.default            = må ikke udfyldes
jakarta.validation.constraints.Past.message.default            = skal være før i dag
jakarta.validation.constraints.PastOrPresent.message.default   = skal være i dag eller tidligere
jakarta.validation.constraints.Pattern.message.default         = skal have det korrekte format
jakarta.validation.constraints.Positive.message.default        = skal være et positivt tal
jakarta.validation.constraints.PositiveOrZero.message.default  = skal være 0 eller positiv
jakarta.validation.constraints.Size.message.default            = skal være mellem {min} og {max} tegn

# Business-friendly English messages for ecuacion-lib-validation field constraints.
jp.ecuacion.lib.validation.constraints.SizeString.message.default             = skal være mellem {min} og {max} tegn
jp.ecuacion.lib.validation.constraints.BooleanString.message.default          = skal være "true" eller "false"
jp.ecuacion.lib.validation.constraints.IntegerString.message.default          = skal være et heltal
jp.ecuacion.lib.validation.constraints.LongString.message.default             = skal være et heltal
jp.ecuacion.lib.validation.constraints.EnumElement.message.default            = skal være et gyldigt valg
jp.ecuacion.lib.validation.constraints.PatternWithDescription.message.default = skal matche "{description}"
jp.ecuacion.lib.validation.constraints.ElementsNotEmpty.message.default       = skal indeholde mindst ét element
jp.ecuacion.lib.validation.constraints.FileExists.message.default             = skal være en eksisterende fil
jp.ecuacion.lib.validation.constraints.DirExists.message.default              = skal være en eksisterende mappe
jp.ecuacion.lib.validation.constraints.PathExists.message.default             = skal være en eksisterende fil eller mappe
jp.ecuacion.lib.validation.constraints.FileExtension.message.default          = skal være en "{extension}"-fil

