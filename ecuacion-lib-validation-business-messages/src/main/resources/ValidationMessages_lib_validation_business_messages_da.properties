jp.ecuacion.lib.validation.constraints.TrueWhen.message.default                   = skal være slået til, når {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.FalseWhen.message.default                  = skal være slået fra, når {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.StringWhen.message.default                 = skal være den angivne værdi, når {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotStringWhen.message.default              = må ikke være den angivne værdi, når {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.PatternWhen.message.default                = skal have det angivne format, når {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotPatternWhen.message.default             = må ikke have det angivne format, når {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.ValueOfPropertyPathWhen.message.default    = skal svare til værdien af et andet felt, når {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
jp.ecuacion.lib.validation.constraints.NotValueOfPropertyPathWhen.message.default = må ikke svare til værdien af et andet felt, når {conditionDescription}{validatesWhenConditionNotSatisfiedDescription}
