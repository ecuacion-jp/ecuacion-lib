jp.ecuacion.lib.validation.constraints.AllNullOrAllNotNull.message.default        = i campi {0} devono essere tutti inseriti o tutti lasciati vuoti
jp.ecuacion.lib.validation.constraints.AllOrNoneNull.message.default              = i campi {0} devono essere tutti inseriti o tutti lasciati vuoti
jp.ecuacion.lib.validation.constraints.AnyEmpty.message.default                   = uno tra {0} deve essere vuoto
