# Business-friendly English messages for Jakarta Validation standard constraints.
# These override the neutral HV-standard messages provided by ecuacion-lib-core.
jakarta.validation.constraints.AssertFalse.message.default     = deve essere disattivato
jakarta.validation.constraints.AssertTrue.message.default      = deve essere attivato
jakarta.validation.constraints.DecimalMax.message.default      = deve essere ${inclusive == true ? 'al massimo' : 'minore di'} {value}
jakarta.validation.constraints.DecimalMin.message.default      = deve essere ${inclusive == true ? 'almeno' : 'maggiore di'} {value}
jakarta.validation.constraints.Digits.message.default          = deve avere al massimo {integer} cifre intere e {fraction} cifre decimali
jakarta.validation.constraints.Email.message.default           = deve essere un indirizzo email valido
jakarta.validation.constraints.Future.message.default          = deve essere successivo a oggi
jakarta.validation.constraints.FutureOrPresent.message.default = deve essere oggi o successivo
jakarta.validation.constraints.Max.message.default             = deve essere {value} o meno
jakarta.validation.constraints.Min.message.default             = deve essere {value} o più
jakarta.validation.constraints.Negative.message.default        = deve essere un numero negativo
jakarta.validation.constraints.NegativeOrZero.message.default  = deve essere 0 o negativo
jakarta.validation.constraints.NotBlank.message.default        = non deve contenere solo spazi
jakarta.validation.constraints.NotEmpty.message.default        = è obbligatorio
jakarta.validation.constraints.NotNull.message.default         = è obbligatorio
jakarta.validation.constraints.Null.message.default            = non deve essere inserito
jakarta.validation.constraints.Past.message.default            = deve essere precedente a oggi
jakarta.validation.constraints.PastOrPresent.message.default   = deve essere oggi o precedente
jakarta.validation.constraints.Pattern.message.default         = deve essere nel formato corretto
jakarta.validation.constraints.Positive.message.default        = deve essere un numero positivo
jakarta.validation.constraints.PositiveOrZero.message.default  = deve essere 0 o positivo
jakarta.validation.constraints.Size.message.default            = deve contenere tra {min} e {max} caratteri

# Business-friendly English messages for ecuacion-lib-validation field constraints.
jp.ecuacion.lib.validation.constraints.SizeString.message.default             = deve contenere tra {min} e {max} caratteri
jp.ecuacion.lib.validation.constraints.BooleanString.message.default          = deve essere "true" o "false"
jp.ecuacion.lib.validation.constraints.IntegerString.message.default          = deve essere un numero intero
jp.ecuacion.lib.validation.constraints.LongString.message.default             = deve essere un numero intero
jp.ecuacion.lib.validation.constraints.EnumElement.message.default            = deve essere una selezione valida
jp.ecuacion.lib.validation.constraints.PatternWithDescription.message.default = deve corrispondere a "{description}"
jp.ecuacion.lib.validation.constraints.ElementsNotEmpty.message.default       = deve contenere almeno un elemento
jp.ecuacion.lib.validation.constraints.FileExists.message.default             = deve essere un file esistente
jp.ecuacion.lib.validation.constraints.DirExists.message.default              = deve essere una cartella esistente
jp.ecuacion.lib.validation.constraints.PathExists.message.default             = deve essere un file o una cartella esistente
jp.ecuacion.lib.validation.constraints.FileExtension.message.default          = deve essere un file "{extension}"

