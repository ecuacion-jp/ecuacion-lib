jp.ecuacion.lib.validation.constraints.AllEmptyOrAllNotEmpty.message.default      = i campi {0} devono essere tutti compilati o tutti vuoti
jp.ecuacion.lib.validation.constraints.AllOrNoneEmpty.message.default             = i campi {0} devono essere tutti compilati o tutti vuoti
