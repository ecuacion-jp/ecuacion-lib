jakarta.validation.constraints.Min.message.default             = {0} mesti {value} atau lebih (nilai yang dimasukkan: {invalidValue})
jakarta.validation.constraints.Negative.message.default        = {0} mesti nombor negatif (nilai yang dimasukkan: {invalidValue})
jakarta.validation.constraints.NegativeOrZero.message.default  = {0} mesti 0 atau negatif (nilai yang dimasukkan: {invalidValue})
jakarta.validation.constraints.NotBlank.message.default        = {0} tidak boleh mengandungi ruang kosong sahaja
jakarta.validation.constraints.NotEmpty.message.default        = {0} wajib diisi
jakarta.validation.constraints.NotNull.message.default         = {0} wajib diisi
jakarta.validation.constraints.Null.message.default            = {0} tidak boleh diisi (nilai yang dimasukkan: {invalidValue})
jakarta.validation.constraints.Past.message.default            = {0} mesti sebelum hari ini (nilai yang dimasukkan: {invalidValue})
jakarta.validation.constraints.PastOrPresent.message.default   = {0} mesti hari ini atau sebelumnya (nilai yang dimasukkan: {invalidValue})
jakarta.validation.constraints.Pattern.message.default         = {0} mesti dalam format yang betul (nilai yang dimasukkan: {invalidValue})
jakarta.validation.constraints.Positive.message.default        = {0} mesti nombor positif (nilai yang dimasukkan: {invalidValue})
jakarta.validation.constraints.PositiveOrZero.message.default  = {0} mesti 0 atau positif (nilai yang dimasukkan: {invalidValue})
jakarta.validation.constraints.Size.message.default            = {0} mesti antara {min} hingga {max} aksara (nilai yang dimasukkan: {invalidValue})

