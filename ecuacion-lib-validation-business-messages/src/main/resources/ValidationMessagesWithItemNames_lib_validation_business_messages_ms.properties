jakarta.validation.constraints.AssertFalse.message.default     = {0} mesti dimatikan (nilai yang dimasukkan: {invalidValue})
jakarta.validation.constraints.AssertTrue.message.default      = {0} mesti dihidupkan (nilai yang dimasukkan: {invalidValue})
jakarta.validation.constraints.DecimalMax.message.default      = {0} mesti ${inclusive == true ? 'paling banyak' : 'kurang daripada'} {value} (nilai yang dimasukkan: {invalidValue})
jakarta.validation.constraints.DecimalMin.message.default      = {0} mesti ${inclusive == true ? 'sekurang-kurangnya' : 'lebih daripada'} {value} (nilai yang dimasukkan: {invalidValue})
jakarta.validation.constraints.Digits.message.default          = {0} mesti mempunyai paling banyak {integer} digit integer dan {fraction} digit perpuluhan (nilai yang dimasukkan: {invalidValue})
jakarta.validation.constraints.Email.message.default           = {0} mesti alamat e-mel yang sah (nilai yang dimasukkan: {invalidValue})
jakarta.validation.constraints.Future.message.default          = {0} mesti selepas hari ini (nilai yang dimasukkan: {invalidValue})
jakarta.validation.constraints.FutureOrPresent.message.default = {0} mesti hari ini atau selepasnya (nilai yang dimasukkan: {invalidValue})
