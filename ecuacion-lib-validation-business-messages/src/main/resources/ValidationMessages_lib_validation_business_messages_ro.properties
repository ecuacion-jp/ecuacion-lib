jakarta.validation.constraints.Null.message.default            = nu trebuie completat
jakarta.validation.constraints.Past.message.default            = trebuie să fie înainte de ziua de azi
jakarta.validation.constraints.PastOrPresent.message.default   = trebuie să fie azi sau mai devreme
jakarta.validation.constraints.Pattern.message.default         = trebuie să aibă formatul corect
jakarta.validation.constraints.Positive.message.default        = trebuie să fie un număr pozitiv
jakarta.validation.constraints.PositiveOrZero.message.default  = trebuie să fie 0 sau pozitiv
jakarta.validation.constraints.Size.message.default            = trebuie să aibă între {min} și {max} caractere

