# Business-friendly Japanese message parts for ecuacion-lib-validation *When constraints.
#
# NotNullWhen / NotEmptyWhen use "入力" (a suru-verb noun) as their message.default's core
# word, which needs "してください" rather than the generic "にしてください" suffix used by
# the other *When constraints' noun-based core words (空欄, 未入力, オン, オフ, ...).
# These overrides append "に" to the "validatesWhenConditionNotSatisfied" description part so
# that it still reads naturally when appended before that "にしてください" is dropped in
# NotNullWhen.message.default / NotEmptyWhen.message.default (see ValidationMessages*_ja.properties
# in this module).
jp.ecuacion.lib.validation.constraints.NotNullWhen.messagePart.validatesWhenConditionNotSatisfied  = 、それ以外の値の場合はnullに
jp.ecuacion.lib.validation.constraints.NotEmptyWhen.messagePart.validatesWhenConditionNotSatisfied = 、それ以外の値の場合は空欄に
