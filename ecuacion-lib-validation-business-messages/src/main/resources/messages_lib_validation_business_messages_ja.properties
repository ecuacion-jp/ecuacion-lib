# Business-friendly Japanese message parts for ecuacion-lib-validation *When constraints.
# These override the neutral message parts provided by ecuacion-lib-validation
# (messages_lib_validation_ja.properties) so that the whole message uses business-friendly words.
#
# The *When messages in ValidationMessages*_ja.properties of this module end with
# "{validatesWhenConditionNotSatisfiedDescription}してください". The core word before the part
# has "に" when it is a noun (未入力に, オンに, ...) and has no "に" when it is "入力",
# a suru-verb noun. So the "validatesWhenConditionNotSatisfied" parts follow the same rule.

## ConditionalXxxValidator
