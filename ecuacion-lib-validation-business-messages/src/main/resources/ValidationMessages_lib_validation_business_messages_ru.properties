# Business-friendly English messages for Jakarta Validation standard constraints.
# These override the neutral HV-standard messages provided by ecuacion-lib-core.
jakarta.validation.constraints.AssertFalse.message.default     = должно быть выключено
jakarta.validation.constraints.AssertTrue.message.default      = должно быть включено
jakarta.validation.constraints.DecimalMax.message.default      = должно быть ${inclusive == true ? 'не больше' : 'меньше'} {value}
jakarta.validation.constraints.DecimalMin.message.default      = должно быть ${inclusive == true ? 'не меньше' : 'больше'} {value}
jakarta.validation.constraints.Digits.message.default          = должно содержать не более {integer} цифр в целой части и {fraction} знаков после запятой
jakarta.validation.constraints.Email.message.default           = должно быть корректным адресом электронной почты
jakarta.validation.constraints.Future.message.default          = должно быть позже сегодняшнего дня
jakarta.validation.constraints.FutureOrPresent.message.default = должно быть сегодня или позже
jakarta.validation.constraints.Max.message.default             = должно быть не больше {value}
jakarta.validation.constraints.Min.message.default             = должно быть не меньше {value}
jakarta.validation.constraints.Negative.message.default        = должно быть отрицательным числом
jakarta.validation.constraints.NegativeOrZero.message.default  = должно быть 0 или отрицательным
jakarta.validation.constraints.NotBlank.message.default        = не должно состоять только из пробелов
jakarta.validation.constraints.NotEmpty.message.default        = обязательно для заполнения
jakarta.validation.constraints.NotNull.message.default         = обязательно для заполнения
jakarta.validation.constraints.Null.message.default            = не должно заполняться
jakarta.validation.constraints.Past.message.default            = должно быть раньше сегодняшнего дня
jakarta.validation.constraints.PastOrPresent.message.default   = должно быть сегодня или раньше
jakarta.validation.constraints.Pattern.message.default         = должно быть в правильном формате
jakarta.validation.constraints.Positive.message.default        = должно быть положительным числом
jakarta.validation.constraints.PositiveOrZero.message.default  = должно быть 0 или положительным
jakarta.validation.constraints.Size.message.default            = должно содержать от {min} до {max} символов

