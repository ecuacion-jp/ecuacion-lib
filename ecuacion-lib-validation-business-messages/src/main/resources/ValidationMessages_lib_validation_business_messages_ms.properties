# Business-friendly English messages for Jakarta Validation standard constraints.
# These override the neutral HV-standard messages provided by ecuacion-lib-core.
jakarta.validation.constraints.AssertFalse.message.default     = mesti dimatikan
jakarta.validation.constraints.AssertTrue.message.default      = mesti dihidupkan
jakarta.validation.constraints.DecimalMax.message.default      = mesti ${inclusive == true ? 'paling banyak' : 'kurang daripada'} {value}
jakarta.validation.constraints.DecimalMin.message.default      = mesti ${inclusive == true ? 'sekurang-kurangnya' : 'lebih daripada'} {value}
jakarta.validation.constraints.Digits.message.default          = mesti mempunyai paling banyak {integer} digit integer dan {fraction} digit perpuluhan
jakarta.validation.constraints.Email.message.default           = mesti alamat e-mel yang sah
jakarta.validation.constraints.Future.message.default          = mesti selepas hari ini
jakarta.validation.constraints.FutureOrPresent.message.default = mesti hari ini atau selepasnya
jakarta.validation.constraints.Max.message.default             = mesti {value} atau kurang
jakarta.validation.constraints.Min.message.default             = mesti {value} atau lebih
jakarta.validation.constraints.Negative.message.default        = mesti nombor negatif
jakarta.validation.constraints.NegativeOrZero.message.default  = mesti 0 atau negatif
jakarta.validation.constraints.NotBlank.message.default        = tidak boleh mengandungi ruang kosong sahaja
jakarta.validation.constraints.NotEmpty.message.default        = wajib diisi
jakarta.validation.constraints.NotNull.message.default         = wajib diisi
jakarta.validation.constraints.Null.message.default            = tidak boleh diisi
jakarta.validation.constraints.Past.message.default            = mesti sebelum hari ini
jakarta.validation.constraints.PastOrPresent.message.default   = mesti hari ini atau sebelumnya
jakarta.validation.constraints.Pattern.message.default         = mesti dalam format yang betul
jakarta.validation.constraints.Positive.message.default        = mesti nombor positif
jakarta.validation.constraints.PositiveOrZero.message.default  = mesti 0 atau positif
jakarta.validation.constraints.Size.message.default            = mesti antara {min} hingga {max} aksara

