name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

env:
  MAVEN_OPTS: -Xmx2g

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Validate POM after version update
        run: |
          mvn versions:set -DnewVersion=0.0.0-CI-TEST -DgenerateBackupPoms=false
          mvn versions:update-properties -Dincludes=jp.ecuacion.lib -DgenerateBackupPoms=false
          mvn validate
          git checkout -- .

      - name: Verify (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: mvn verify -Dwagon.skip=true

      - name: Test (windows)
        if: matrix.os == 'windows-latest'
        run: mvn test -Dcheckstyle.skip=true -Dspotbugs.skip=true -Dlicense.skip=true

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main'))
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: >-
            ecuacion-lib-core/target/site/jacoco/jacoco.xml,
            ecuacion-lib-validation/target/site/jacoco/jacoco.xml
          fail_ci_if_error: false
