name: Docs

# Builds the reference site (MkDocs) from docs/ on every PR / push that touches it,
# and publishes it to GitHub Pages (https://ecuacion-jp.github.io/ecuacion-lib/)
# only when a release tag is pushed (the github-pages environment allows tags only).

on:
  push:
    tags:
      - '*'
    branches:
      - '**'
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: docs/requirements.txt

      - name: Install MkDocs
        run: pip install -r docs/requirements.txt

      - name: Build
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          path: site

  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
