version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 0 20 * *"
      timezone: "Asia/Tokyo"
    target-branch: "develop"
    groups:
      dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "jp.ecuacion.*:*"
      # Held at 9.1.5.Final until 16.5.0 (see ecuacion-lib-bom/pom.xml). Remove this entry then.
      - dependency-name: "org.hibernate.validator:hibernate-validator"
        versions: [">= 9.1.6"]
