name: 'Install ecuacion dependency'
description: 'Checks out a sibling ecuacion-* repo and mvn installs it, skipping checks not needed for a dependency build.'

inputs:
  repository:
    description: 'owner/repo of the dependency to check out'
    required: true
  path:
    description: 'Checkout path'
    required: true
  ref:
    description: 'Ref to check out. Empty resolves to the default branch.'
    required: false
    default: ''
  extra-mvn-args:
    description: 'Extra arguments appended to the mvn install command'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v5
      with:
        repository: ${{ inputs.repository }}
        path: ${{ inputs.path }}
        ref: ${{ inputs.ref }}

    - shell: bash
      working-directory: ${{ inputs.path }}
      run: mvn install -Dmaven.test.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true -Dlicense.skip=true -Djacoco.skip=true -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Dallure.report.skip=true ${{ inputs.extra-mvn-args }}
