name: 'Import GPG key'
description: 'Imports the Maven Central signing key. Wraps crazy-max/ghaction-import-gpg, pinned to a commit SHA since tags are mutable.'

inputs:
  gpg_private_key:
    required: true
  passphrase:
    required: true

runs:
  using: 'composite'
  steps:
    - uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
      with:
        gpg_private_key: ${{ inputs.gpg_private_key }}
        passphrase: ${{ inputs.passphrase }}
